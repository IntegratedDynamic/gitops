# Forward-auth: Envoy asks authentik's embedded outpost about every request
# on the parent's HTTPRoute before forwarding it. The outpost answers with
# either "allowed" (+ identity headers) or a redirect to the login flow, so
# unauthenticated browsers, and API clients too, get a decision with no
# per-app OIDC client, redirectURL or secret.
#
# .Release.Name/.Release.Namespace resolve to the PARENT chart's release
# (subcharts share .Release); the parent's HTTPRoute is named after it.
#
# Settings found necessary on kind (spike behind infra issue #135):
#  - headersToExtAuth must carry `cookie`: for an HTTP ext-auth service Envoy
#    forwards only Host/Method/Path/Content-Length/Authorization by default,
#    so without it the outpost never sees the session and loops on login.
#  - the ext-auth path below is hardcoded in authentik for Envoy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}-sso
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}
  extAuth:
    failOpen: false
    headersToExtAuth:
      - cookie
      - x-forwarded-proto
      - x-forwarded-for
      - user-agent
    http:
      # group/kind/weight written explicitly to match the Gateway API's own
      # schema defaults, avoiding permanent OutOfSync in ArgoCD.
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.authentikServiceName }}
          namespace: {{ .Values.authentikServiceNamespace }}
          port: {{ .Values.authentikServicePort }}
          weight: 1
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - x-authentik-username
        - x-authentik-groups
        - x-authentik-email
        - x-authentik-name
        - x-authentik-uid
        - x-authentik-jwt
        - x-authentik-meta-jwks
        - x-authentik-meta-outpost
        - x-authentik-meta-provider
        - x-authentik-meta-app
        - x-authentik-meta-version
