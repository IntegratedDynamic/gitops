# Gates the parent app's own HTTPRoute behind GitHub org SSO (via Dex, see
# bootstrap/values.yaml). Envoy Gateway's native OIDC filter requires
# redirectURL to live on that HTTPRoute's own hostname — one SecurityPolicy
# per protected app, not a shared policy. .Release.Name/.Release.Namespace
# here resolve to the PARENT chart's release (subcharts share .Release).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}-sso
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}
  oidc:
    provider:
      issuer: {{ .Values.issuer | quote }}
      # Talks to Dex's in-cluster Service directly rather than resolving the
      # issuer hostname — avoids depending on external-dns/Scaleway DNS
      # propagation (this caused a real outage on cluster restart: the
      # Gateway LB IP changes, and envoy-gateway retried OIDC discovery
      # before the new record propagated, wedging the policy Invalid).
      #
      # backendRefs' group/kind/weight below (and clientSecret's/jwt's
      # further down): written explicitly to match the Gateway API's own
      # schema defaults, avoiding permanent OutOfSync in ArgoCD (confirmed
      # live 2026-08-11).
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.dexServiceName }}
          namespace: {{ .Values.dexServiceNamespace }}
          port: {{ .Values.dexServicePort }}
          weight: 1
      # Spelled out explicitly (Dex's standard OIDC paths) so the
      # controller's admission-time validation skips its own discovery
      # fetch entirely — that fetch ignores backendRefs and used plain DNS.
      authorizationEndpoint: "{{ .Values.issuer }}/auth"
      tokenEndpoint: "{{ .Values.issuer }}/token"
    clientID: {{ .Values.clientID | quote }}
    clientSecret:
      group: ""
      kind: Secret
      name: {{ .Values.clientSecretName }}
    refreshToken: true
    redirectURL: "https://{{ .Values.hostname }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    cookieDomain: {{ .Values.cookieDomain | quote }}
  {{- if .Values.requiredGroup }}
    # groups scope + a fixed idToken cookie name so the jwt/authorization
    # blocks below can read the group claim back out of it.
    scopes:
      - groups
    cookieNames:
      idToken: {{ .Release.Name }}-id-token
  # Restricts access to members of one GitHub team (org:team, as Dex's
  # github connector formats the groups claim) — on top of the org-wide
  # login gate above. Everything stays in this policy; the app itself
  # never sees or checks group membership.
  jwt:
    providers:
      - name: dex
        issuer: {{ .Values.issuer | quote }}
        remoteJWKS:
          uri: "{{ .Values.issuer }}/keys"
          cacheDuration: 300s
          backendRefs:
            - group: ""
              kind: Service
              name: {{ .Values.dexServiceName }}
              namespace: {{ .Values.dexServiceNamespace }}
              port: {{ .Values.dexServicePort }}
              weight: 1
        extractFrom:
          cookies:
            - {{ .Release.Name }}-id-token
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-required-group
        action: Allow
        principal:
          jwt:
            provider: dex
            claims:
              - name: groups
                valueType: StringArray
                values:
                  - {{ .Values.requiredGroup | quote }}
  {{- end }}
