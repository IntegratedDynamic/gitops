<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="2">
<title>Démarrage en cours…</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 0 16px; }
  .spin { width: 40px; height: 40px; margin: 0 auto 20px; border: 4px solid rgba(128,128,128,.3); border-top-color: currentColor; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  p { margin: 0; opacity: .7; }
</style>
</head>
<body>
  <main>
    <div class="spin" role="status" aria-label="Chargement"></div>
    <h1>Le service démarre…</h1>
    <p>Cette page se recharge automatiquement. / Starting up, this page refreshes by itself.</p>
  </main>
</body>
</html>
