replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# No ingress-nginx on scaleway — routing goes through the shared Envoy
# Gateway instead (apps/gateway-config), via HTTPRoute below.
ingress:
  enabled: false

gateway:
  enabled: true
  hostname: demo.scalepack.fr
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway
