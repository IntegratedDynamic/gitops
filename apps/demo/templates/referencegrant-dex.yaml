{{- if .Values.auth.enabled }}
# Lets this namespace's SecurityPolicy (above) reference the Dex Service in
# the gateway namespace directly. Lives here rather than in apps/dex-init
# because ReferenceGrant is granted BY the target namespace (gateway) TO a
# named source namespace — each protected app's own chart owns its half of
# this trust relationship, auditable per-app via `kubectl get referencegrant`.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ .Release.Name }}-sso-to-dex
  namespace: {{ .Values.auth.dexServiceNamespace }}
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: {{ .Release.Namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ .Values.auth.dexServiceName }}
{{- end }}
