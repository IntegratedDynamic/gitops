{{- if .Values.auth.enabled }}
# Gates this app behind GitHub org SSO (via Dex, see platform/scaleway/dex.yml).
# Envoy Gateway's native OIDC filter requires the redirectURL to live on this
# same HTTPRoute's own hostname — it intercepts /oauth2/callback itself
# before the request ever reaches the backend below, since this HTTPRoute
# has no path `matches` (it already catches every path on this host).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}-sso
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}
  oidc:
    provider:
      issuer: {{ .Values.auth.issuer | quote }}
      # Talks to Dex's in-cluster Service directly instead of resolving
      # auth.scalepack.fr — avoids depending on external-dns/Scaleway DNS
      # propagation for discovery/token/JWKS calls (this DNS dependency
      # caused a real outage: on cluster restart, the Gateway LB IP changes,
      # and envoy-gateway retried OIDC discovery before the new record had
      # propagated, permanently wedging the SecurityPolicy in an Invalid
      # state until manually kicked). `issuer` above still has to match
      # Dex's own configured issuer for token validation.
      backendRefs:
        - name: {{ .Values.auth.dexServiceName }}
          namespace: {{ .Values.auth.dexServiceNamespace }}
          port: {{ .Values.auth.dexServicePort }}
      # Also spelled out explicitly (Dex's standard OIDC paths) — the
      # controller's own admission-time validation fetches
      # /.well-known/openid-configuration via a plain DNS lookup of `issuer`,
      # ignoring backendRefs entirely (that field only affects the data-plane
      # runtime path). Providing both skips that discovery fetch outright.
      authorizationEndpoint: "{{ .Values.auth.issuer }}/auth"
      tokenEndpoint: "{{ .Values.auth.issuer }}/token"
    clientID: {{ .Values.auth.clientID | quote }}
    clientSecret:
      name: {{ .Values.auth.clientSecretName }}
    redirectURL: "https://{{ .Values.gateway.hostname }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    cookieDomain: {{ .Values.auth.cookieDomain | quote }}
{{- end }}
