# Fait entrer la clé privée de la GitHub App dans le cluster.
#
# C'est le maillon qui évite d'avoir la clé dans git : les SecretStores GitHub
# ont besoin d'un Secret k8s, ESO le fabrique depuis OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-private-key
  namespace: {{ .Release.Namespace }}
  annotations:
    # Wave 0 : la clé doit exister avant les SecretStores qui la référencent.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.source.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.github.privateKey.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.github.privateKey.openbaoKey }}
      remoteRef:
        key: {{ .Values.github.privateKey.openbaoPath }}
        property: {{ .Values.github.privateKey.openbaoKey }}
