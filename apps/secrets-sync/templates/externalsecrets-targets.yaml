# Un ExternalSecret par cible : matérialise le secret OpenBao dédié à cette
# cible dans son propre Secret k8s. Isolation volontaire — voir le commentaire
# sur `source` dans values.yaml.
{{- range .Values.targets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets-sync-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ $.Values.source.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $.Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: secrets-sync-{{ .name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $.Values.source.openbaoPathPrefix }}/{{ .name }}
{{- end }}
