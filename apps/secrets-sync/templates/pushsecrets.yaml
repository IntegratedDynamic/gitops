# Un PushSecret par cible : pousse les clés choisies du Secret k8s intermédiaire
# vers GitHub, à travers le SecretStore correspondant.
{{- range .Values.targets }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: github-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Wave 2 : après le SecretStore et le Secret source.
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ $.Values.pushRefreshInterval | quote }}
  secretStoreRefs:
    - name: github-{{ .name }}
      kind: SecretStore
  selector:
    secret:
      name: secrets-sync-{{ .name }}
  # `None` : supprimer le PushSecret laisse le secret en place côté GitHub.
  # Volontaire — un `helm uninstall` ne doit pas casser des workflows en prod.
  deletionPolicy: None
  # `Replace` : OpenBao fait autorité, une modification manuelle côté GitHub est
  # écrasée au refresh suivant.
  updatePolicy: Replace
  data:
    {{- range .secrets }}
    - match:
        secretKey: {{ . }}
        remoteRef:
          remoteKey: {{ . }}
    {{- end }}
{{- end }}
