# Synchronisation OpenBao → GitHub Actions secrets.
#
# Sens du flux : OpenBao est la source de vérité. ESO lit les valeurs, les
# matérialise dans un Secret k8s intermédiaire, puis les pousse vers GitHub.
# Le provider GitHub d'ESO est write-only : rien ne revient de GitHub.
#
# Aucune valeur de secret ici — uniquement des identifiants publics et des
# chemins. Les valeurs vivent dans OpenBao.

# ClusterSecretStore déclaré par le chart openbao-init.
clusterSecretStoreName: openbao

github:
  # appID / installationID sont typés int64 dans la CRD : surtout pas de
  # guillemets, sinon le webhook ESO rejette le SecretStore.
  appID: 4346625
  installationID: 147805215
  organization: IntegratedDynamic

  # Clé privée de la GitHub App. Lue dans OpenBao, jamais dans git.
  privateKey:
    # Chemin relatif au mount kv/ (le provider vault préfixe tout seul).
    openbaoPath: apps/secrets-sync/github/eso-github-app-private-key
    openbaoKey: privateKey.pem
    # Secret k8s intermédiaire que les SecretStores référencent.
    secretName: github-app-private-key

# Préfixe des secrets OpenBao source — un par cible, sous <prefix>/<target.name>.
# Volontairement PAS un secret unique partagé : deux cibles sans rapport (un
# secret d'org, un secret d'un repo précis) ne doivent pas partager un
# historique de versions Vault ni une policy d'accès. Chaque cible a son propre
# secret, donc sa propre policy possible et son propre historique de rotation.
#
# Le segment `github` isole ce qui est spécifique à ce provider : tout ce qui
# est propre à la synchro (peu importe la destination) vit sous
# apps/secrets-sync/, ce qui est propre à GitHub vit sous
# apps/secrets-sync/github/ — de la place pour un autre provider plus tard
# (ex. apps/secrets-sync/slack/) sans collision de noms.
source:
  openbaoPathPrefix: apps/secrets-sync/github
  refreshInterval: 1h

# Cibles de publication. Une entrée = un secret OpenBao (à
# <openbaoPathPrefix>/<name>) + un ExternalSecret + un SecretStore + un
# PushSecret, tous dédiés à cette cible.
#
# Le scope (org / repo / environnement) se règle sur le SecretStore, pas sur le
# PushSecret : c'est pour ça qu'il faut une cible distincte par portée, même
# quand deux cibles visent le même repo.
#
# Champs :
#   name        identifiant k8s de la cible (kebab-case) ET nom du secret
#               OpenBao sous le préfixe ci-dessus
#   repository  omis → secret d'organisation
#   environment optionnel, exige `repository` et que l'env existe déjà côté GitHub
#   secrets     clés à pousser, telles qu'elles apparaissent dans le secret
#               OpenBao de la cible ET dans GitHub (mapping 1:1, volontairement
#               simple)
targets:
  # - name: global
  #   secrets:
  #     - TEST_ORGA

  # - name: infrastructure
  #   repository: infrastructure
  #   secrets:
  #     - TEST_REPO

  - name: infrastructure-scaleway
    repository: infrastructure
    environment: scaleway
    secrets:
      - SCW_ACCESS_KEY
      - SCW_SECRET_KEY

# Visibilité des secrets d'organisation créés : "all" ou "private".
orgSecretVisibility: private

# Fréquence de repush. ESO ne peut pas relire GitHub (write-only) : il repousse
# à l'aveugle à chaque intervalle, ce qui corrige une dérive manuelle côté GitHub.
pushRefreshInterval: 1h
