{{- if .Values.clusterSecretStore.enabled }}
# Point d'entrée unique d'ESO vers OpenBao, pour tout le cluster.
#
# Vit ici (et non dans apps/secrets-sync/) parce que c'est du câblage OpenBao
# partagé : n'importe quelle app peut le référencer. Le mettre dans le chart
# secrets-sync créerait une dépendance artificielle de tout le cluster envers
# le cas d'usage GitHub.
#
# Le provider s'appelle `vault` : OpenBao est un fork de Vault et parle la même
# API, ESO n'a pas de provider dédié.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  annotations:
    # Wave 2 : après le serveur OpenBao (wave 0) et le job de restore (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    vault:
      server: {{ .Values.baoAddr | quote }}
      path: {{ .Values.clusterSecretStore.mountPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          # Rôle créé manuellement dans OpenBao — voir openbao-claude.md.
          # Lié au SA external-secrets/external-secrets via la policy eso-read.
          role: {{ .Values.clusterSecretStore.role | quote }}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- end }}
