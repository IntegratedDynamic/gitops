apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.acmeEmail }}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.scaleway.com
            solverName: scaleway
            config:
              accessKeySecretRef:
                name: {{ .Values.scalewayCredentialsSecretName }}
                key: SCW_ACCESS_KEY
              secretKeySecretRef:
                name: {{ .Values.scalewayCredentialsSecretName }}
                key: SCW_SECRET_KEY
