{{- if .Values.enabled }}
# Exposes the Grafana UI at grafana.scalepack.fr on the shared gateway.
# Grafana authenticates natively via its own auth.generic_oauth provider
# (platform/scaleway/kube-prometheus-stack.yml) rather than going through
# Envoy Gateway's SecurityPolicy filter (apps/sso-guard) — same reasoning
# as apps/argocd-config/apps/openbao-config: Grafana's own login page and
# /login/generic_oauth callback need to be reachable before any session
# exists, and a blanket edge gate fights that handshake. The local
# admin/admin login stays enabled as a break-glass fallback for now (see
# platform/scaleway/kube-prometheus-stack.yml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - backendRefs:
        - name: {{ .Values.grafanaServer.serviceName }}
          port: {{ .Values.grafanaServer.servicePort }}
{{- end }}
