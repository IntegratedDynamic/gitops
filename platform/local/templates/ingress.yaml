apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ingress
  namespace: argocd
  labels:
    domain: platform
    subdomain: ingress
spec:
  project: platform

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    # Directory source: children are external Helm charts (pinned versions), no
    # git revision to thread — so a plain folder of manifests, not a chart.
    path: platform/local/ingress
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
