apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-init
  namespace: argocd
  annotations:
    # Wave 0, same wave as `openbao` (its sibling in this service): on a
    # from-scratch cluster openbao starts uninitialized → sealed → 0/1 NotReady,
    # and never reaches Healthy until this restore Job initializes it. Running
    # both in parallel (not gating init behind openbao's health) avoids a
    # deadlock — the openbao Service publishes not-ready addresses so the Job
    # can reach it while it is still 0/1.
    argocd.argoproj.io/sync-wave: "0"
  labels:
    domain: platform
    subdomain: secrets
    service: openbao
spec:
  project: platform

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: apps/openbao-init
    helm:
      valueFiles:
        - values-local.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
