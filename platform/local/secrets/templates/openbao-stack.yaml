apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-stack
  namespace: argocd
  labels:
    domain: platform
    subdomain: secrets
    service: openbao
spec:
  project: platform

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: platform/local/secrets/openbao
    helm:
      parameters:
        - name: revision
          value: {{ .Values.revision }}
        - name: repoURL
          value: {{ .Values.repoURL }}

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
