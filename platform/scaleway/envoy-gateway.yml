# Gateway API CRDs come from this chart's own bundled crds subchart
# (experimental channel: standard + TCPRoute/UDPRoute/ListenerSet etc — a
# strict superset, so GatewayClass/Gateway/HTTPRoute work identically).
# Deliberately not pinning a separate standard-channel install alongside
# this one anymore: the two fought over the same CRD/safe-upgrades-policy
# objects on every sync, since ArgoCD applies both through the same shared
# SSA field manager (no real per-Application ownership). Simpler to just
# have one source of truth: whatever this chart bundles for its own
# pinned version.
# Channels explained: https://gateway-api.sigs.k8s.io/concepts/versioning/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default

  source:
    repoURL: oci://registry-1.docker.io/envoyproxy/gateway-helm
    targetRevision: v1.8.1
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
