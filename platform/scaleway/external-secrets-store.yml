apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-store
  namespace: argocd
  annotations:
    # Wave 1: applied after the operator + CRDs (external-secrets, wave 0) so the
    # ClusterSecretStore CRD it relies on already exists.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/IntegratedDynamic/gitops.git
    targetRevision: main
    path: platform/scaleway/external-secrets-store

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
