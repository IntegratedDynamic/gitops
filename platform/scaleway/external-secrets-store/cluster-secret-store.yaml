# Cluster-wide store: any namespace's ExternalSecret can pull from Infisical
# through this. Auth is the universal-auth credential seeded out-of-band by
# Terraform (02-cluster/scaleway/external-secrets.tf) into the secret below —
# the one secret ESO can't source from itself.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: platform-p-qc1
        environmentSlug: staging
        secretsPath: /
