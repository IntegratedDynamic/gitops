apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-init
  namespace: argocd
  annotations:
    # Wave 2 (after `openbao`, wave 0) — scaleway keeps its original ordering:
    # the restore Job runs once the openbao server is up. (Local uses wave 0 to
    # run init in parallel because there openbao auto-unseals via AWS KMS and
    # would otherwise never become Healthy from scratch.)
    argocd.argoproj.io/sync-wave: "2"
  labels:
    domain: platform
    subdomain: secrets
    service: openbao
spec:
  project: platform

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: apps/openbao-init
    helm:
      valueFiles:
        - values-scaleway.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
