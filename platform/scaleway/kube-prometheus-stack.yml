apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.1.0
    helm:
      values: |
        # Lightweight config for the small Kapsule pool (DEV1-M nodes).
        alertmanager:
          enabled: false

        grafana:
          adminPassword: admin
          # ClusterIP for now: reach it via `kubectl port-forward`. Public
          # exposure + SSO is handled later by the API gateway layer (issue #3).
          service:
            type: ClusterIP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 768Mi
            # Uses the Kapsule default StorageClass (Scaleway block storage).
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 5Gi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
