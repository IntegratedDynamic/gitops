apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability
  namespace: argocd
  labels:
    domain: platform
    subdomain: observability
spec:
  project: platform

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    # Directory source (no Chart.yaml here): children are external Helm charts
    # (pinned versions), no git revision to thread. recurse is false by default —
    # do NOT set it explicitly, ArgoCD normalizes it away → perpetual OutOfSync.
    path: platform/scaleway/observability

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
