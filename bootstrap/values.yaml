# Cluster environment to bootstrap; selects bootstrap/templates/<env>.yaml,
# which creates that env's services-vendor-<env> Application and
# services-app-<env> ApplicationSet. Set by the external provisioner (e.g.
# the Terraform infra repo).
#
# TODO(validation): enforce that every services/**/applications/<env>/
# folder referenced by an env actually exists (as a PR check).
env: local

# Git ref this cluster tracks, propagated to every child Application so a
# feature branch can be tested end-to-end before merging. MUST stay `main`
# on origin/main -- overriding it on your own branch is a handy DevX trick,
# just don't merge that change in.
# TODO(validation): enforce `revision: main` as a PR check before merge.
revision: main
repoURL: https://github.com/IntegratedDynamic/gitops.git

# Every scaleway Application, rendered as a managed resource of the
# `bootstrap` Application's own sync (bootstrap/templates/scaleway.yaml) --
# NOT via an ApplicationSet. Confirmed live: ArgoCD's ApplicationSet
# RollingSync only paces staged *updates* across an already-existing
# fleet, not first-ever bootstrap ordering -- every stage's apps got
# created and synced simultaneously regardless of step order on a fresh
# ApplicationSet. Plain sync-wave on one parent Application's own
# resources is what actually works. A product's chart and its
# -init/-config companion normally share a wave and sync concurrently as
# one unit (brief intra-wave race, self-heals in seconds) EXCEPT where the
# dependency is on another app's *completion*, not just its existence --
# more waves are cheap, add one whenever "exists" isn't actually enough.
#
# Each wave's comment below is the short, load-bearing "why" only --
# abandoned earlier designs, specific confirmed-live incidents, and naming
# history live in README.md instead. Read that before changing a wave
# assignment that looks arbitrary but isn't.
#
# infra#84 (2026-08-24): OpenBao+ESO (former wave 0/1), monitoring minus
# Grafana (former wave 2/3), and Velero (former wave 4) were extracted from
# this list into the infrastructure repo's own
# 10-cluster/scaleway/platform-apps/ chart -- three parallel-starting
# Applications (secrets-apps/monitoring-apps/backups-apps) that must all
# reach Healthy before THIS Application (bootstrap) is even created by
# Terraform, replacing what used to be their own sync-waves here. See that
# chart's README.md for the full design, and this file's README.md for
# what changed on this side. Every remaining app below that still depends
# on OpenBao/ESO or Velero being up (every *-secret chart, grafana's
# restore hook) is unaffected in practice -- those prerequisites now finish
# even earlier (before bootstrap starts at all) than they did as bootstrap's
# own wave 0/1/4.
#
# Sorted by wave, ascending -- keep it that way.
scalewayApps:
  # ── wave 1 ────────────────────────────────────────────────────────────
  # dex: no dependency beyond the infra repo's secrets-apps domain (OpenBao
  # + ESO, now extracted -- see the infra#84 note above); only its public
  # exposure (dex-gateway, wave 6) needs the Gateway. Confirmed live:
  # eager-OIDC-discovery consumers like argo-server crash-loop if Dex isn't
  # already reachable at their own startup, unlike Grafana/ArgoCD's lazy
  # OIDC dial on first login.
  - {name: dex, namespace: gateway, chartPath: services/platform/dex/chart, valueFile: values-scaleway.yaml, wave: "1", syncWaveLabelPaths: ['dex.podLabels.scalepack\.fr/sync-wave']}
  - {name: cert-manager-webhook-secret, namespace: cert-manager, chartPath: services/platform/cert-manager/webhook-secret, valueFile: values.yaml, wave: "1"}
  - {name: wireguard-secret, namespace: wireguard, chartPath: services/platform/wireguard-site-to-site/secret, valueFile: values-scaleway.yaml, wave: "1"}
  # wireguard-exit-secret: same shape, for the separate exit-node
  # deployment (services/platform/wireguard-exit) -- see that chart's
  # README for why it's a second, unrelated WireGuard deployment.
  # - {name: wireguard-exit-secret, namespace: wireguard-exit, chartPath: services/platform/wireguard-exit/secret, valueFile: values-scaleway.yaml, wave: "1"}
  - {name: dex-secret, namespace: gateway, chartPath: services/platform/dex/secret, valueFile: values.yaml, wave: "1"}
  - {name: external-dns-secret, namespace: external-dns, chartPath: services/platform/external-dns/secret, valueFile: values.yaml, wave: "1"}
  - {name: grafana-secret, namespace: monitoring, chartPath: services/platform/monitoring/grafana-secret, valueFile: values.yaml, wave: "1"}
  # argo-workflows-secret: the Secrets every terraform-apply CronWorkflow
  # pod mounts (Scaleway state-bucket credentials, plus a few tfvars only
  # one root needs -- see services/platform/argo-workflows/secret/values.yaml).
  - {name: argo-workflows-secret, namespace: argo-workflows, chartPath: services/platform/argo-workflows/secret, valueFile: values.yaml, wave: "1"}

  # ── wave 2 ────────────────────────────────────────────────────────────
  # argo-workflows: the workflow-controller AND server (`server.enabled`) --
  # the server's SSO now dials Dex in-cluster, so this has to sync after
  # wave 1's dex, not share a wave with it.
  - {name: argo-workflows, namespace: argo-workflows, chartPath: services/platform/argo-workflows/chart, valueFile: values-scaleway.yaml, wave: "2", syncWaveLabelPaths: ['argo-workflows.controller.podLabels.scalepack\.fr/sync-wave']}

  # ── wave 4 ────────────────────────────────────────────────────────────
  # envoy-gateway + cert-manager (+ its Scaleway DNS01 ACME webhook): don't
  # depend on each other at all -- what actually needs both is
  # gateway-config (wave 5): envoy-gateway for the Gateway API CRDs,
  # cert-manager for the cert-manager.io CRDs its ClusterIssuers need. Kept
  # at wave 4 (not renumbered down) even though velero/alloy/otel-collector
  # moved out (infra#84 note above) -- gaps are cheap, no reason to shift
  # every later wave's number for this.
  - {name: envoy-gateway, namespace: envoy-gateway-system, chartPath: services/platform/gateway/chart, valueFile: values-scaleway.yaml, wave: "4", syncWaveLabelPaths: ['gateway-helm.deployment.pod.labels.scalepack\.fr/sync-wave']}
  - {name: cert-manager, namespace: cert-manager, chartPath: services/platform/cert-manager/chart, valueFile: values-scaleway.yaml, wave: "4", syncWaveLabelPaths: ['cert-manager.podLabels.scalepack\.fr/sync-wave', 'cert-manager.webhook.podLabels.scalepack\.fr/sync-wave', 'cert-manager.cainjector.podLabels.scalepack\.fr/sync-wave']}
  - {name: cert-manager-webhook-scaleway, namespace: cert-manager, chartPath: services/platform/cert-manager/webhook-chart, valueFile: values-scaleway.yaml, wave: "4", syncWaveLabelPaths: ['scaleway-certmanager-webhook.podLabels.scalepack\.fr/sync-wave']}
  # argocd-config-monitoring: a PrometheusRule, needs the infra repo's
  # monitoring-apps domain's kube-prometheus-stack-crds Established --
  # guaranteed true well before this wave, since that domain now finishes
  # before bootstrap even starts (infra#84 note above).
  - {name: argocd-config-monitoring, namespace: argocd, chartPath: services/platform/argocd-config/monitoring, valueFile: values.yaml, wave: "4"}

  # ── wave 5 ────────────────────────────────────────────────────────────
  # gateway-config needs BOTH wave 4's envoy-gateway (Gateway API CRDs)
  # AND cert-manager (cert-manager.io CRDs) to have actually finished
  # installing, not just exist -- a genuinely hard dependency: its
  # ClusterIssuer objects are cert-manager.io-typed, and if that CRD isn't
  # registered yet ArgoCD's sync fails outright at the API level and does
  # NOT self-heal (confirmed live: 5 retries exhausted, unlike every
  # pod-level race this file otherwise tolerates) -- so it can't share
  # wave 4 with the CRDs it depends on.
  - {name: gateway-config, namespace: gateway, chartPath: services/platform/gateway/config, valueFile: values-scaleway.yaml, wave: "5"}
  # grafana joins here for a narrower reason -- it only needs the infra
  # repo's backups-apps domain's velero (its grafana-restore-* PreSync hook
  # needs the `velero` namespace/CRDs to exist) -- guaranteed true well
  # before this wave, same reasoning as argocd-config-monitoring above.
  # No syncWaveLabelPaths (unlike its siblings): grafana-chart hardcodes
  # its wave label directly -- the inject-via-Helm-parameter mechanism
  # every other app here uses produced a live-broken manifest for this
  # specific chart (see values-scaleway.yaml's own podLabels comment).
  - {name: grafana, namespace: monitoring, chartPath: services/platform/monitoring/grafana-chart, valueFile: values-scaleway.yaml, wave: "5"}

  # ── wave 6 ────────────────────────────────────────────────────────────
  # platform: wireguard, Dex's gateway, external-dns, terraform-apply --
  # all need wave 5's gateway-config to have actually finished
  # reconciling.
  - {name: wireguard-config, namespace: wireguard, chartPath: services/platform/wireguard-site-to-site/config, valueFile: values-scaleway.yaml, wave: "6", syncWaveLabelPaths: ['syncWave']}
  # wireguard-exit-config disabled 2026-08-19: its real kernel wg0
  # interface (unlike wireguard-site-to-site's app-layer proxying)
  # conflicts with Cilium's XDP acceleration -- confirmed live, 100%
  # reproducible, Cilium CrashLoopBackOff on whatever node it lands on.
  # - {name: wireguard-exit-config, namespace: wireguard-exit, chartPath: services/platform/wireguard-exit/config, valueFile: values-scaleway.yaml, wave: "6"}
  - {name: dex-gateway, namespace: gateway, chartPath: services/platform/dex/gateway, valueFile: values.yaml, wave: "6"}
  - {name: external-dns, namespace: external-dns, chartPath: services/platform/external-dns/chart, valueFile: values-scaleway.yaml, wave: "6", syncWaveLabelPaths: ['external-dns.podLabels.scalepack\.fr/sync-wave']}
  # terraform-apply: wave placement is a real dependency (grafana-managed
  # can't succeed before grafana-bootstrap has minted a fresh token
  # against the rebuilt Grafana, wave 5) -- proper per-root dependency/
  # health gating (e.g. openbao-managed only actually needs OpenBao, now
  # the infra repo's secrets-apps domain) is follow-up work, not done here.
  # This chart's own PostSync hook (templates/initial-run-workflow.yaml)
  # submits grafana-bootstrap then grafana-managed immediately once this
  # wave syncs, instead of leaving them to wait out their next hourly
  # CronWorkflow trigger.
  - {name: terraform-apply, namespace: argo-workflows, chartPath: services/platform/argo-workflows/terraform-apply, valueFile: values-scaleway.yaml, wave: "6"}

  # ── wave 7 ────────────────────────────────────────────────────────────
  # every remaining *-gateway chart: same dependency (the shared Gateway
  # from wave 5 + Dex from wave 6), no ordering between them.
  - {name: grafana-gateway, namespace: monitoring, chartPath: services/platform/monitoring/grafana-gateway, valueFile: values-scaleway.yaml, wave: "7"}
  - {name: argocd-config, namespace: argocd, chartPath: services/platform/argocd-config/config, valueFile: values-scaleway.yaml, wave: "7"}
  - {name: argocd-config-gateway, namespace: argocd, chartPath: services/platform/argocd-config/gateway, valueFile: values-scaleway.yaml, wave: "7"}
  - {name: openbao-gateway, namespace: openbao, chartPath: services/platform/openbao/gateway, valueFile: values-scaleway.yaml, wave: "7"}
  - {name: argo-workflows-gateway, namespace: argo-workflows, chartPath: services/platform/argo-workflows/gateway, valueFile: values.yaml, wave: "7"}

  # ── wave 8 ────────────────────────────────────────────────────────────
  - {name: demo, namespace: demo, chartPath: services/products/demo/chart, valueFile: values-scaleway.yaml, wave: "8", syncWaveLabelPaths: ['syncWave']}
