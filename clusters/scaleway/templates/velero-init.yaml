apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-init
  namespace: argocd
  annotations:
    # Wave 3: after openbao-init (wave 2), whose chart declares the
    # ClusterSecretStore this app's ExternalSecret depends on. Same wave as
    # external-dns-init and cert-manager-webhook-init — all three only need
    # that ClusterSecretStore.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: apps/velero-init

  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
