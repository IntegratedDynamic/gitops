apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-config
  namespace: argocd
  annotations:
    # Wave 4: after cert-manager-webhook-init (wave 3, materializes the
    # credentials the ClusterIssuers reference) and after platform (wave 0,
    # which brings up envoy-gateway, cert-manager and its Scaleway webhook).
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: apps/gateway-config
    helm:
      valueFiles:
        - values-scaleway.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gateway

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
