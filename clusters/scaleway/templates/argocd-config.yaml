apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
  annotations:
    # Wave 5: its HTTPRoute needs gateway-config's wave-4 Gateway to exist
    # first (same reasoning as demo/dex-init).
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: apps/argocd-config
    helm:
      valueFiles:
        - values-scaleway.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
