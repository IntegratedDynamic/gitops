apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-sync
  namespace: argocd
spec:
  project: default

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: apps/secrets-sync
    helm:
      # values-scaleway.yaml met `targets: []` : l'Application existe et se
      # synchronise, mais ne pousse rien vers GitHub. Voir le fichier pour le
      # pourquoi (GitHub est global, un seul cluster doit faire autorité).
      valueFiles:
        - values-scaleway.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: secrets-sync

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
