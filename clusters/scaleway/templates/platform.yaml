apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  labels:
    domain: platform
spec:
  project: platform

  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    # platform/scaleway is now a Helm app-of-apps chart that fans out into the
    # platform sub-domains, so revision/repoURL are threaded down as params.
    path: platform/scaleway
    helm:
      parameters:
        - name: revision
          value: {{ .Values.revision }}
        - name: repoURL
          value: {{ .Values.repoURL }}

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
