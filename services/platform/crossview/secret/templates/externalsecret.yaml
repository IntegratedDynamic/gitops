# One Secret assembled from two OpenBao objects: the Dex client secret
# (shared apps/dex/credentials) and Crossview's own apps/crossview/credentials.
# Explicit `data:` entries (not dataFrom) since the keys come from different
# paths and each needs the name the crossview chart's secretKeyRef expects
# (chart/values-scaleway.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: {{ .Values.oidc.openbaoPath }}
        property: {{ .Values.oidc.property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- range $k := list "session-secret" "admin-username" "admin-password" }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $.Values.local.openbaoPath }}
        property: {{ $k }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
