# Crossview's single Secret. All values are Terraform-managed in the infra
# repo's 11-secrets/openbao/managed; OpenBao stays the source of truth, no
# credential value ever lives in this repo.
namespace: crossview

# ClusterSecretStore declared by services/platform/secrets-sync/config.
clusterSecretStoreName: openbao

secretName: crossview-credentials

# The Dex static client's secret (shared apps/dex/credentials object, same as
# every other native-OIDC app -- see
# services/platform/dex/chart/values-scaleway.yaml's staticClients.crossview).
oidc:
  openbaoPath: apps/dex/credentials
  property: crossview-client-secret

# session-secret signs the session cookie (must stay stable across restarts or
# every login is invalidated); admin-* is the local break-glass login, a
# random password instead of the upstream chart's default admin/password.
local:
  openbaoPath: apps/crossview/credentials

refreshInterval: 1h
