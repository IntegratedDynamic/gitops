namespace: crossview

# Values nest under `crossview:` because this is a thin wrapper declaring the
# real chart as a dependency (see Chart.yaml) -- Helm only exposes a
# subchart's values under its dependency name.
crossview:
  global:
    namespace: crossview
    createNamespace: false  # ArgoCD's CreateNamespace=true owns it

  # The upstream chart ships `pullPolicy: Always` and an unpinned tag
  # (falls back to the chart's appVersion). IfNotPresent: the tag IS the pin.
  image:
    pullPolicy: IfNotPresent

  # ── No database ─────────────────────────────────────────────────────────
  # Crossview's OIDC login works without PostgreSQL: users live in the
  # signed session cookie instead (upstream docs/SSO_SETUP.md, "database-free
  # SSO", requires auth.mode: session). The only thing lost is user
  # persistence across logins -- irrelevant for a single-admin homelab, and
  # it avoids a stateful Postgres pod to back up for what is only a viewer.
  database:
    enabled: false
  config:
    database:
      enabled: false
    server:
      log:
        # TEMPORARY: the backend logs nothing at `info` (no request or error
        # lines at all), which left the dashboard's "Error loading" panels
        # undiagnosable from the pod. Revert to `info` once fixed.
        level: debug
      auth:
        mode: session
      cors:
        # Public URL, no trailing slash. Mandatory: also the post-login
        # redirect target (defaults to localhost otherwise). Hardcoded to
        # the main workspace like grafana's root_url -- an ephemeral
        # cluster's hostSuffix is NOT threaded through here, so SSO into
        # crossview only works on the main workspace.
        origin: https://crossview.staging.scalepack.fr
    sso:
      oidc:
        enabled: true
        providerName: Dex
        clientId: crossview
        # Split-horizon, per upstream docs: `issuer` MUST stay empty (a
        # non-empty issuer makes OIDC discovery override the explicit
        # endpoints below). Only the browser-facing authorization URL goes
        # through the public route; token + userinfo are server-to-server
        # calls dialed in-cluster -- pods can't reliably reach the cluster's
        # own public route (same hairpin-NAT gap argo-workflows hit, see
        # services/platform/argo-workflows/chart/values-scaleway.yaml).
        issuer: ""
        authorizationURL: https://auth.staging.scalepack.fr/auth
        tokenURL: http://dex.gateway.svc:5556/token
        userInfoURL: http://dex.gateway.svc:5556/userinfo
        callbackURL: https://crossview.staging.scalepack.fr/api/auth/oidc/callback
        scope: openid profile email

  secrets:
    # Upstream defaults are adminUsername=admin / adminPassword=password --
    # a publicly known local login. Blanked here (an empty string is skipped
    # by the chart's own secret rendering) and re-injected below from
    # OpenBao via app.extraEnv instead.
    adminUsername: ""
    adminPassword: ""
    dbPassword: ""
    OIDCClientSecret:
      secretKeyRef:
        name: crossview-credentials
        key: oidc-client-secret
    sessionSecret:
      secretKeyRef:
        name: crossview-credentials
        key: session-secret

  # The upstream Deployment reads its config via configMapKeyRef, i.e. only at
  # pod start, and has no checksum annotation: a ConfigMap change alone never
  # rolls it (hit live 2026-11-03, a stale CORS_ORIGIN/callback after the
  # domain rename). reloader is already deployed in the cluster; this asks it
  # to restart the pod on a ConfigMap/Secret change. Placed on the pod
  # template because the upstream chart exposes no Deployment-level
  # annotations -- adding it also changes the template, so this very sync
  # rolls the pod once, reloader's pod-template support or not.
  podAnnotations:
    reloader.stakater.com/auto: "true"

  app:
    extraEnv:
      - name: ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: crossview-credentials
            key: admin-username
      - name: ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: crossview-credentials
            key: admin-password

  # The upstream ClusterRole is `get/list/watch` on apiGroups `*` /
  # resources `*` -- every Secret in the cluster included. Replaced by
  # templates/clusterrole.yaml (+ binding), scoped to what a Crossplane
  # viewer actually needs.
  rbac:
    create: false

  # The pod-anti-affinity the chart defaults to is meaningless for 1 replica.
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
