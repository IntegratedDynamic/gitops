# Pulls WireGuard exit-node state from OpenBao into Secrets that
# services/platform/wireguard-exit/config's Deployment mounts — nothing
# about the tunnel is hardcoded in this repo, all of it is minted in the
# infra repo's 04-vpn/wireguard-exit and routed through OpenBao like every
# other cross-repo value (05-secrets/openbao/managed, see that root's
# README for the full chain). Mirrors
# services/platform/wireguard-site-to-site/secret exactly — separate
# namespace/OpenBao paths, same pattern.
namespace: wireguard-exit

# ClusterSecretStore declared by services/platform/secrets-sync/config.
clusterSecretStoreName: openbao

refreshInterval: 1h

# The tunnel server's own private key — sensitive, its own object since
# nothing else reads it.
serverKey:
  openbaoPath: apps/wireguard-exit/server-key
  secretName: wireguard-exit-server-key

# name -> {publicKey, allowedIPs}. Not actually secret, but routed through
# the same pipe anyway — no cross-repo copy-paste for this either. See
# services/platform/wireguard-exit/config/templates/deployment.yaml for how
# this Secret gets turned into wg0.conf's [Peer] blocks.
peers:
  openbaoPath: apps/wireguard-exit/peers
  secretName: wireguard-exit-peers
