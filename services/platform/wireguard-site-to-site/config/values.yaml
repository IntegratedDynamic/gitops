# A self-hosted WireGuard tunnel so infra repo's 11-secrets/openbao's vault
# provider (local dev + CI) can reach OpenBao instead of the public gateway
# route (openbao.scalepack.fr) — that route stays public for a different,
# unrelated reason: OpenBao's own native OIDC/UI login for humans
# (services/platform/openbao/gateway), which this domain doesn't touch. No
# third-party control plane (Tailscale evaluated, ruled out) — see infra
# repo's 04-vpn/wireguard-site-to-site/README.md for the full design and where every
# key in this chart's values actually comes from.
#
# This pod terminates the tunnel and proxies to whatever internal target a
# peer's own request names (dynamicProxy below) at the application layer
# (see templates/deployment.yaml's proxy-dynamic sidecar) rather than
# routing/NAT-ing at the kernel layer — a first attempt used
# net.ipv4.ip_forward + iptables MASQUERADE, which needs the node pool's
# kubelet to allowlist those as "unsafe sysctls". Confirmed live 2026-08-09
# that's a dead end twice over:
# Scaleway's kubelet_args API rejects widening that allowlist for this
# cluster's k8s version at all, and even where it is available, it's a
# cluster-wide relaxation for one workload's benefit — worth avoiding on
# its own merits. The proxy needs none of that: a peer's traffic terminates
# locally at this pod's own tunnel address, so there's no forwarding
# decision for the kernel to make at all.
#
# Exposed as a NodePort directly on a Kapsule node's public IP, not through
# the shared Gateway — confirmed live 2026-08-09 that Scaleway's LB Service
# integration silently drops non-TCP ports, so a UDPRoute there is never
# actually reachable no matter how correctly Envoy Gateway itself is
# configured. See templates/service.yaml and templates/networkpolicy.yaml
# for how that new entry point is hardened (externalTrafficPolicy: Local +
# explicit least-privilege NetworkPolicy, on top of WireGuard's own
# silent-drop-on-auth-failure behavior).
#
# OIDC-gated web UIs (Grafana, ArgoCD, ...) were reachable over the tunnel
# via a proxy-gateway sidecar (raw TCP passthrough to Envoy Gateway's real
# Service) plus split-DNS resolving *.scalepack.fr to this pod's own tunnel
# address. Removed 2026-08-24 (infrastructure#81): this domain exists for
# machine credentials reaching OpenBao's API, not human OIDC/UI login (that
# stays on the public route, untouched) — the DNS/proxy machinery below now
# targets internal cluster DNS instead, which is what those credentials
# actually need. Human UI access over the tunnel is a non-goal here.
namespace: wireguard

# Soft "spread pods from this same sync-wave across nodes" pod label
# (see templates/deployment.yaml, which hardcodes the actual
# topologySpreadConstraints — matchLabelKeys needs no wave-number value).
# Safe empty default here; the real wave number is injected per-env by
# bootstrap/templates/scaleway.yaml from that env's bootstrap/values.yaml
# scalewayApps entry (see this app's `syncWaveLabelPaths`).
syncWave: "0"

# Internal-cluster DNS suffixes the dns sidecar answers with this pod's own
# tunnel address (server.address, see templates/deployment.yaml) instead of
# forwarding upstream — covers every Service in the cluster generically
# (Kubernetes' full *.<namespace>.svc.cluster.local FQDN form, matched via
# the "cluster.local" suffix, and the shorter *.<namespace>.svc form Argo
# Workflows already uses in-cluster, matched via the "svc" suffix) instead
# of one hostname hardcoded per target. A peer resolving any such name gets
# this pod's address; dynamicProxy below (templates/deployment.yaml's
# proxy-dynamic sidecar) is what actually delivers the traffic onward.
dnsInternalZones:
  - cluster.local
  - svc

server:
  port: 51820
  # Fixed rather than letting Kubernetes assign one from the NodePort range
  # at random — peers' Endpoint needs a port that doesn't change if this
  # Service is ever recreated. Must stay inside the cluster's configured
  # NodePort range (default 30000-32767).
  nodePort: 30820
  # external-dns keeps this pointed at whichever node currently hosts the
  # pod (see templates/service.yaml's annotation) — peers dial this, never
  # a raw IP.
  hostname: wg.scalepack.fr
  # WireGuard's own point-to-point overlay subnet — unrelated to the
  # cluster's pod/Service CIDR. The server sits at .1; each peer below gets
  # its own /32 out of this range as its allowedIPs.
  address: 10.100.0.1/24
  image:
    repository: lscr.io/linuxserver/wireguard
    tag: "1.0.20260223"
  # Secrets materialized by services/platform/wireguard-site-to-site/secret (ExternalSecrets
  # from OpenBao's kv/apps/wireguard/server-key and kv/apps/wireguard/peers
  # respectively) — nothing about the tunnel's keys or peer list is
  # hardcoded in this repo, all of it flows from the infra repo's
  # 04-vpn/wireguard-site-to-site through OpenBao (see that init chart's values.yaml).
  privateKeySecretName: wireguard-server-key
  privateKeySecretKey: private-key
  peersSecretName: wireguard-peers
  serviceName: wireguard

# Ports the proxy-dynamic sidecar (templates/deployment.yaml) listens on —
# a peer dialing this pod's tunnel address on one of these gets proxied to
# WHATEVER internal Service its own request names (plain-HTTP Host header
# for httpPorts, TLS SNI for tlsPorts), resolved live via this cluster's
# own CoreDNS at request time. No Service/NetworkPolicy change needed for
# any of this: this traffic arrives already-decrypted over wg0 inside the
# pod's own netns, never through the K8s Service that only fronts the outer
# WireGuard UDP port (templates/service.yaml) — same path proxy-gateway
# used to reach its own ports 80/443 before it was replaced, validated live
# 2026-08-09.
#
# dnsInternalZones above makes DNS resolution generic (any internal name
# resolves to this pod), and this sidecar makes delivery generic too — a
# genuinely new internal Service needs nothing added here, only a new PORT
# if it doesn't already listen on one already covered below (this pod can't
# do kernel-level packet forwarding to an arbitrary destination —
# net.ipv4.ip_forward is on Kapsule's unsafe-sysctls list, and Scaleway's
# kubelet_args API refuses to widen that allowlist for this cluster's k8s
# version, confirmed live 2026-08-09, see README.md — so a TCP listener
# still has to be bound per port ahead of time; that's the one thing that
# can't be made fully dynamic).
#
# httpPorts covers OpenBao's plain-HTTP API (8200) and Grafana (80) today —
# add a port here (not a target) the day some other internal service needs
# a port neither already covers. tlsPorts (443) has no current consumer,
# kept for symmetry/forward-compatibility with a future internal
# TLS-native service; SNI carries no port, so it assumes the backend
# listens on the same port number as the one dialed.
dynamicProxy:
  dnsResolver: coredns.kube-system.svc.cluster.local
  httpPorts:
    - 80
    - 8200
  tlsPorts:
    - 443

# This chart was the one exception that already had explicit per-container
# resources missing entirely (not even a chart default: we own this
# template). Confirmed live 2026-08-11 alongside every other requestless
# platform chart — see services/platform/cert-manager/chart/values-scaleway.yaml's
# comment for the full incident. Every container here is a thin proxy/init
# step, so these all stay small — except where noted below.
#
# dns got OOMKilled at its original 32Mi limit during a live relaunch
# (2026-08-11): every container here runs `apk add --no-cache <pkg>` fresh
# at startup (nothing's baked into the base alpine image), and that
# package-fetch/install step spikes well above what the actual running
# process needs afterwards. proxy-dynamic uses the nginx:alpine image
# directly (no apk install of its own) but runs a real master+worker
# process pair instead of a single socat process, so it gets the same
# tier proxyGateway (its closest predecessor, also a real daemon rather
# than a thin relay) used to.
resources:
  renderConf:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  wireguard:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi
  proxyDynamic:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
  dns:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 128Mi
