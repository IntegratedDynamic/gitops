# Dedicated ServiceAccount (not "default") purely so no container in this
# pod auto-mounts a token at all (automountServiceAccountToken: false in
# deployment.yaml) — explicit, self-documenting "zero K8s API access" rather
# than relying on the namespace's default SA's implicit behavior. Used to
# also carry a Role/RoleBinding letting the (now-removed) proxy-gateway
# sidecar discover Envoy Gateway's real Service name at startup —
# infrastructure#81 dropped that sidecar along with the *.scalepack.fr DNS
# trick it served, so no in-cluster API access is needed here anymore.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wireguard
  namespace: {{ .Values.namespace }}
