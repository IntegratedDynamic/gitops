apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    # A second replica during a rollout would mean two pods both claiming
    # the same peer set with independent state — recreate rather than
    # risk that, a short tunnel blip during a rollout is fine.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wireguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wireguard
        scalepack.fr/sync-wave: {{ .Values.syncWave | quote }}
    spec:
      # Soft "spread pods from this same sync-wave across nodes" — see
      # services/platform/cert-manager/chart/values-scaleway.yaml's
      # comment on the same fix. Hardcoded here (not driven by values)
      # since matchLabelKeys (K8s 1.27+) needs no wave number at all — it
      # resolves it from the pod's own scalepack.fr/sync-wave label above
      # at schedule time. This chart is in-house (not a vendored
      # dependency), so unlike other charts in this repo, this had to be
      # added to the template itself, not just set via values.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - scalepack.fr/sync-wave
          labelSelector: {}
      serviceAccountName: wireguard
      automountServiceAccountToken: false
      initContainers:
        # Combines the non-secret template (configmap.yaml) with the private
        # key from services/platform/wireguard-site-to-site/secret's Secret into the actual
        # wg0.conf the server container reads — this has to happen at pod
        # start, not at Helm render time, since ArgoCD never sees the
        # Secret's live content.
        - name: render-wg-conf
          image: alpine:3.22
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache jq
              PRIVATE_KEY=$(cat /secrets/{{ .Values.server.privateKeySecretKey }})
              sed "s|__PRIVATE_KEY__|$PRIVATE_KEY|" /template/wg0.conf.tmpl > /config/wg_confs/wg0.conf
              # One file per peer (the wireguard-peers Secret mounted below),
              # each containing that peer's {publicKey, allowedIPs} as JSON —
              # see infra repo's 11-secrets/openbao/managed/main.tf for how
              # that Secret's content is shaped.
              for f in /peers/*; do
                name=$(basename "$f")
                pubkey=$(jq -r '.publicKey' "$f")
                allowedips=$(jq -r '.allowedIPs' "$f")
                printf "\n# %s\n[Peer]\nPublicKey = %s\nAllowedIPs = %s\n" "$name" "$pubkey" "$allowedips" >> /config/wg_confs/wg0.conf
              done
              chmod 600 /config/wg_confs/wg0.conf
          resources: {{ .Values.resources.renderConf | toYaml | nindent 12 }}
          volumeMounts:
            - name: conf-template
              mountPath: /template
              readOnly: true
            - name: server-key
              mountPath: /secrets
              readOnly: true
            - name: peers
              mountPath: /peers
              readOnly: true
            - name: wg-confs
              mountPath: /config/wg_confs
      containers:
        - name: wireguard
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources: {{ .Values.resources.wireguard | toYaml | nindent 12 }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # Custom wg_confs/wg0.conf is supplied directly (mounted below)
            # — this disables the image's own key/peer auto-generation,
            # since Terraform (infra repo's 04-vpn/wireguard-site-to-site) already
            # owns that.
          ports:
            - name: wireguard
              containerPort: {{ .Values.server.port }}
              protocol: UDP
          volumeMounts:
            - name: wg-confs
              mountPath: /config/wg_confs
        # Dynamic discovery-based reverse proxy: one nginx sidecar listening
        # on a handful of well-known ports (dynamicProxy.httpPorts/tlsPorts)
        # — instead of one static socat listener hardcoded per target
        # (the earlier design, infrastructure#81's first pass), the actual
        # backend is resolved live from what the client itself asked for:
        # the plain-HTTP request's own Host header for httpPorts
        # (`proxy_pass http://$http_host$request_uri` — nginx resolves
        # $http_host as a variable via the `resolver` directive below, at
        # request time, unlike a literal proxy_pass target which only
        # resolves once at startup), or the TLS ClientHello's SNI name for
        # tlsPorts (`stream` block, `ssl_preread on`, no certificate needed
        # here since this is passthrough, not termination). Either way this
        # container never sees the target's identity ahead of time — any
        # internal Service on one of these ports becomes reachable the
        # moment DNS resolves its name (dnsInternalZones below already
        # makes that generic), nothing to add here when a new one shows up.
        # No RBAC/K8s API access needed (unlike the old proxy-gateway sidecar
        # this replaced 2026-08-24, which had to `kubectl get svc` to find
        # its one static target) — `resolver` just points at this cluster's
        # own CoreDNS Service, the same resolver every other pod already
        # uses by default. Userspace proxying, not kernel routing, same
        # reasoning as the design it replaces — see README.md's "Why the
        # tunnel doesn't route to internal ClusterIPs directly".
        #
        # A listener still has to be bound ahead of time per PORT (a TCP
        # socket can't cover every port at once) — that's the one thing
        # still "listed" here, not a target hostname. TLS's SNI carries no
        # port, so a tlsPorts entry assumes the backend listens on the same
        # port number as the one dialed (true for the common case, e.g.
        # some future internal service on 443); httpPorts has no such
        # assumption since $http_host already carries the port the client
        # actually dialed.
        - name: proxy-dynamic
          image: nginx:1.27-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cat > /tmp/nginx.conf <<'NGINX_EOF'
              worker_processes 1;
              events { worker_connections 1024; }
              http {
                resolver {{ .Values.dynamicProxy.dnsResolver }} valid=10s;
                # nginx's resolver does plain, literal DNS resolution -- no
                # ndots/search-domain expansion the way a normal pod's own
                # resolv.conf gives it for free. The tunnel's dnsmasq happily
                # answers the short "<name>.<namespace>.svc" form (a suffix
                # match, not a real lookup — see dnsInternalZones), but
                # CoreDNS itself returns NXDOMAIN for that exact 3-label
                # query (confirmed live 2026-08-24: `nslookup
                # openbao.openbao.svc coredns...` -> NXDOMAIN, `nslookup
                # openbao.openbao.svc.cluster.local` -> resolves fine) — so
                # passing $http_host straight to proxy_pass 502'd for any
                # peer using the short form Argo Workflows itself uses
                # in-cluster. Normalize it here instead: only the bare short
                # form (no dot after "svc", so this doesn't touch an
                # already-qualified *.svc.cluster.local Host) gets
                # "cluster.local" appended before proxying.
                map $http_host $proxy_host {
                  "~^(?<svcname>[^.]+\.[^.]+\.svc)(?<port>:\d+)?$"  $svcname.cluster.local$port;
                  default                                            $http_host;
                }
                {{- range .Values.dynamicProxy.httpPorts }}
                server {
                  listen {{ . }};
                  location / {
                    proxy_pass http://$proxy_host$request_uri;
                    proxy_set_header Host $http_host;
                  }
                }
                {{- end }}
              }
              stream {
                resolver {{ .Values.dynamicProxy.dnsResolver }} valid=10s;
                {{- range .Values.dynamicProxy.tlsPorts }}
                server {
                  listen {{ . }};
                  ssl_preread on;
                  proxy_pass $ssl_preread_server_name:{{ . }};
                }
                {{- end }}
              }
              NGINX_EOF
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          resources: {{ .Values.resources.proxyDynamic | toYaml | nindent 12 }}
        # Split DNS: answers every internal-cluster hostname (dnsInternalZones
        # — the "svc" and "cluster.local" suffixes, so this covers any
        # Service in any namespace generically, not one hostname per target)
        # with this pod's own tunnel address (server.address, stripped of
        # its CIDR suffix) and forwards everything else upstream. Peers get
        # this pushed via their wg-quick config's DNS setting (infra repo's
        # 04-vpn/wireguard-site-to-site/main.tf) — while the tunnel is up,
        # any internal hostname resolves to the tunnel automatically, no
        # /etc/hosts editing, and it reverts the moment the tunnel goes down
        # (scoped to the interface's own DNS config, not a standing file
        # edit). Resolving the name is only half the story — see
        # proxy-dynamic above for how traffic actually gets delivered once
        # a peer's client has the tunnel's address.
        - name: dns
          image: alpine:3.22
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache dnsmasq
              exec dnsmasq --no-daemon --no-resolv \
                {{- range .Values.dnsInternalZones }}
                --address=/{{ . }}/{{ (splitList "/" $.Values.server.address) | first }} \
                {{- end }}
                --server=1.1.1.1 --server=8.8.8.8 \
                --port=53
          resources: {{ .Values.resources.dns | toYaml | nindent 12 }}
      volumes:
        - name: conf-template
          configMap:
            name: wireguard-conf-template
        - name: server-key
          secret:
            secretName: {{ .Values.server.privateKeySecretName }}
        - name: peers
          secret:
            secretName: {{ .Values.server.peersSecretName }}
        - name: wg-confs
          emptyDir: {}
