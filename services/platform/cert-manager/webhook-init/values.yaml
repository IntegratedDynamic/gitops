# Reuses the same Scaleway Domains & DNS credentials already synced for
# external-dns (services/platform/external-dns/init) — same API, same DomainsDNSFullAccess
# IAM scope, just materialized into the cert-manager namespace too so
# services/platform/cert-manager/applications/scaleway/webhook.vendor.yaml and
# services/platform/gateway/config's ClusterIssuers can read it. No new OpenBao seed
# needed.
namespace: cert-manager

# ClusterSecretStore declared by the openbao-init chart.
clusterSecretStoreName: openbao

openbao:
  path: apps/external-dns/scaleway-dns-credentials

secret:
  name: scaleway-dns-credentials

refreshInterval: 1h
