apiVersion: v2
name: cert-manager
description: Wrapper chart pulling in vendor cert-manager, managed as an Application
  by the infrastructure repo's
  10-cluster/scaleway/platform-apps/values-networking.yaml (infra#84,
  2026-08-25 — extracted from this repo's own bootstrap/values.yaml, see
  that file's own note). cert-manager itself consumes no OpenBao-sourced
  Secret — shares a wave with envoy-gateway in that domain, pure scheduling
  convenience, no dependency on either.
type: application
version: 0.1.0

dependencies:
  - name: cert-manager
    version: v1.21.0
    repository: "oci://quay.io/jetstack/charts"
