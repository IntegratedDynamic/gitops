# Values below nest under `cert-manager:` because this chart is a thin
# wrapper declaring the real cert-manager chart as a dependency (see
# chart/Chart.yaml) — Helm only exposes a subchart the values under its
# dependency name.
cert-manager:
  crds:
    enabled: true

  # Lets cert-manager watch Gateway API `Gateway` listeners directly
  # (via the cert-manager.io/cluster-issuer annotation) instead of
  # requiring a hand-written Certificate per app. ExperimentalGatewayAPISupport
  # already defaults to true in this chart version; only the controller
  # loop itself needs enabling.
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    gatewayAPI:
      enabled: true

  # Chart ships none of these by default (resources: {} everywhere) —
  # confirmed live 2026-08-11: with every platform chart requestless,
  # the scheduler has nothing to balance nodes on and Cluster
  # Autoscaler never sees a reason to use the pool's 3rd node, so a
  # fresh scaleway-homelab boot piles ~30 pods onto one 2-node's worth
  # of real RAM and OOMs.
  #
  # Sized from `kubectl top pods -n cert-manager` on the live cluster
  # (2026-08-11), not chart-doc guesses — a first pass anchored on
  # generic recommendations left the controller request at half its
  # observed usage. cainjector gets the most headroom: it watches every
  # CRD/webhook/APIService in the cluster to inject CA bundles, so its
  # memory scales with total CRD count and spikes hardest during the
  # initial sync right after cert-manager's own CRDs land.
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Soft "spread pods from this same sync-wave across nodes" — same
  # pattern on every chart in this repo (controller here, webhook/cainjector
  # below, each chart's own long-lived pods elsewhere). Confirmed live
  # 2026-08-12: without this, the default scheduler happily piles every
  # pod that starts in the same sync-wave onto whichever of the pool's 2
  # nodes it favors first, causing resource contention there while the
  # other node sits idle. ScheduleAnyway, not DoNotSchedule: with only 2
  # nodes, a hard requirement would leave pods unschedulable whenever the
  # pool is temporarily down to 1 node.
  #
  # topologySpreadConstraints' matchLabelKeys (K8s 1.27+) resolves the
  # actual wave number from the pod's own scalepack.fr/sync-wave label at
  # schedule time, so this block never embeds a wave number itself — only
  # podLabels below does. podLabels' value here is a fallback default, not
  # the source of truth — bootstrap/templates/scaleway.yaml injects this
  # app's real `wave` into each of the 3 podLabels below independently
  # (main/webhook/cainjector each become their own map once Helm parses
  # this file, so the YAML anchor only shares the *default*, each still
  # needs its own override — see this app's `syncWaveLabelPaths` entry in
  # bootstrap/values.yaml). Set to "-1" (not a real wave) rather than a
  # plausible-looking number, so a standalone render makes the
  # un-injected fallback obvious instead of silently matching production.
  podLabels: &waveLabel
    scalepack.fr/sync-wave: "-1"
  topologySpreadConstraints: &waveSpread
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - scalepack.fr/sync-wave
      labelSelector: {}

  webhook:
    podLabels: *waveLabel
    topologySpreadConstraints: *waveSpread
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  cainjector:
    podLabels: *waveLabel
    topologySpreadConstraints: *waveSpread
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 320Mi
  startupapicheck:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
