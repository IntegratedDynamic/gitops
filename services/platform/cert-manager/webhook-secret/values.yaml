# Reuses the same Scaleway Domains & DNS credentials already synced for
# external-dns (services/platform/external-dns/secret) — same API, same DomainsDNSFullAccess
# IAM scope, just materialized into the cert-manager namespace too so
# services/platform/gateway/config's ClusterIssuers can read it (both charts
# live in the infra repo's platform-apps/values-networking.yaml, infra#84).
# No new OpenBao seed needed.
namespace: cert-manager

# ClusterSecretStore declared by services/platform/secrets-sync/config.
clusterSecretStoreName: openbao

openbao:
  path: apps/external-dns/scaleway-dns-credentials

secret:
  name: scaleway-dns-credentials

refreshInterval: 1h
