# Mirrors services/platform/external-dns/secret/templates/externalsecret.yaml — same
# OpenBao path, different target namespace/Secret name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    # Merge, not Owner (2026-08-25): the infra repo's 10-cluster/scaleway
    # bootstraps this same Secret directly (kubernetes_secret.
    # scaleway_dns_credentials) so cert-manager-webhook-scaleway's pod isn't
    # blocked on ESO's first sync during cluster bring-up (confirmed live:
    # pod stuck on "secret \"scaleway-dns-credentials\" not found" while
    # ESO was still catching up). ESO now just keeps the keys self-healed
    # against OpenBao going forward -- Merge requires the Secret to already
    # exist, which Terraform having created it first guarantees.
    creationPolicy: Merge
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.openbao.path }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
