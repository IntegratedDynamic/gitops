apiVersion: v2
name: cert-manager-webhook-scaleway
description: Wrapper chart pulling in the vendor scaleway-certmanager-webhook
  chart (cert-manager's Scaleway DNS01 ACME solver), so this deployment goes
  as a plain Application managed directly by bootstrap/templates/scaleway.yaml (see bootstrap/values.yaml's scalewayApps list) instead of the
  old, uncoordinated services-vendor-scaleway/services-app-scaleway split. Unlike the main
  cert-manager chart, this one DOES consume an OpenBao-sourced Secret
  (scaleway-dns-credentials, materialized by
  services/platform/cert-manager/webhook-init) — same class of race as
  Velero/external-dns/Dex/Grafana, just not caught in the first pass since
  this chart reads it via a different values key
  (secret.externalSecretName, not existingSecret/secretKeyRef). Stage "eso",
  bundled with webhook-init.
type: application
version: 0.1.0

dependencies:
  - name: scaleway-certmanager-webhook
    version: 0.4.2
    repository: "https://helm.scw.cloud/"
