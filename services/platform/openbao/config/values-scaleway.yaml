enabled: true

namespace: openbao

gateway:
  hostname: openbao.scalepack.fr
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# Service created by the openbao-helm chart (services/platform/openbao/applications/scaleway/chart.vendor.yaml),
# release name "openbao" — matches services/platform/openbao/init's baoAddr.
openbaoServer:
  serviceName: openbao
  servicePort: 8200
