{{- if .Values.restore.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init
  namespace: {{ .Release.Namespace }}
  annotations:
    # Normal resource (not a hook): an all-hooks Application never triggers a sync
    # and its hooks never run. Wave 0 → created before the Job (wave 1).
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
