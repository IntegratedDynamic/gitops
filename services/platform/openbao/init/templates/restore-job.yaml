{{- if .Values.restore.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init-restore
  namespace: {{ .Release.Namespace }}
  annotations:
    # Normal resource, wave 1 (after SA + ConfigMap). On a fresh cluster the Job
    # doesn't exist → OutOfSync → ArgoCD creates and runs it. Re-runs on a live
    # cluster are prevented by the idempotence guard in restore.sh.
    argocd.argoproj.io/sync-wave: "1"
    # A Job's spec.selector/template.labels are immutable — Replace=true alone
    # still does a plain `kubectl replace` (PUT), which the API server rejects
    # just the same. Force=true makes ArgoCD delete+recreate instead.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-init
        component: restore
    spec:
      serviceAccountName: openbao-init
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/restore.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BAO_ADDR
              value: {{ .Values.baoAddr | quote }}
            - name: S3_HOST
              value: {{ .Values.s3.host | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_URI
              value: {{ .Values.s3.uri | quote }}
            - name: S3CMD_EXTRA_FLAG
              value: {{ .Values.s3.extraFlag | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3CredentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3CredentialsSecret }}
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: openbao-init-restore
        - name: tmp
          emptyDir: {}
{{- end }}
