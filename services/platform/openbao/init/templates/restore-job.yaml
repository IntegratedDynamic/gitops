{{- if .Values.restore.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init-restore
  namespace: {{ .Release.Namespace }}
  annotations:
    # Wave 1 (after SA + ConfigMap). On a fresh cluster the Job doesn't exist
    # → ArgoCD creates and runs it. Re-runs on a live cluster are prevented
    # by the idempotence guard in restore.sh.
    argocd.argoproj.io/sync-wave: "1"
    # hook: Sync -- keeps this resource applied in-line with the normal
    # Sync phase, respecting sync-wave (unlike PreSync/PostSync, which run
    # entirely before/after every non-hook resource -- this Job's
    # wave-1-after-wave-0 dependency on the SA/RBAC/ConfigMap needs that).
    #
    # No hook-delete-policy (2026-09-17, reverted from HookSucceeded):
    # HookSucceeded deleted this Job -- and its Pod -- the instant it
    # succeeded, so `kubectl get pods` / `kubectl logs` had nothing to show
    # afterwards, a real repeated debugging cost. Omitting it falls back to
    # ArgoCD's own default (BeforeHookCreation: delete-then-recreate on
    # every future sync of secrets-apps), which is what HookSucceeded had
    # been added to avoid after a confirmed-live incident (a mid-restore
    # Job killed and recreated, landing in a window restore.sh's marker
    # guard couldn't recover from unattended). Deliberately accepting that
    # risk again: the marker guard now resumes correctly from most
    # interruptions on its own.
    argocd.argoproj.io/hook: Sync
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-init
        component: restore
    spec:
      serviceAccountName: openbao-init
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Copies a kubectl binary onto a shared volume for the main container --
      # openbao-snapshot-agent (bao + s3cmd only) has no Kubernetes API client
      # of its own, and restore.sh now needs one (see that script's own
      # comment on the openbao-restore-state marker Secret). Same
      # alpine/kubectl image already used elsewhere in this repo for
      # in-cluster kubectl access (10-cluster/scaleway's
      # wait-argocd-apps-healthy module), not a new dependency.
      initContainers:
        - name: copy-kubectl
          image: alpine/kubectl:1.35.3
          command: ["sh", "-c", "cp \"$(command -v kubectl)\" /shared/kubectl"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/restore.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BAO_ADDR
              value: {{ .Values.baoAddr | quote }}
            - name: S3_HOST
              value: {{ .Values.s3.host | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_URI
              value: {{ .Values.s3.uri | quote }}
            - name: S3CMD_EXTRA_FLAG
              value: {{ .Values.s3.extraFlag | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3CredentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3CredentialsSecret }}
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
            - name: shared
              mountPath: /shared
      volumes:
        - name: scripts
          configMap:
            name: openbao-init-restore
        - name: tmp
          emptyDir: {}
        - name: shared
          emptyDir: {}
{{- end }}
