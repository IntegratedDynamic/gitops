# Local cluster overrides. Mirrors services/platform/openbao/applications/local/chart.vendor.yaml snapshotAgent.config
# so the restore reads from the same bucket the backups are pushed to.
s3:
  host: s3.fr-par.scw.cloud
  bucket: backup-dev-id
  uri: s3://backup-dev-id
  extraFlag: "--server-side-encryption -v"
