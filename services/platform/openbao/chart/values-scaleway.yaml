# Values below nest under `openbao:` because this chart is a thin wrapper
# declaring the real OpenBao chart as a dependency (see chart/Chart.yaml) —
# Helm only exposes a subchart the values under its dependency name.
openbao:
  server:
    ha:
      enabled: false
    # Soft "spread pods from this same sync-wave across nodes" — every
    # chart in this repo gets the same pattern (see e.g.
    # services/platform/cert-manager/chart/values-scaleway.yaml's comment
    # on the same fix), via topologySpreadConstraints' matchLabelKeys
    # (K8s 1.27+): the scheduler looks up scalepack.fr/sync-wave on the
    # pod being scheduled itself and ANDs it into the selector, so this
    # constraint stays generic — no wave number embedded here at all, only
    # in extraLabels below. ScheduleAnyway (not DoNotSchedule): with only
    # 2 nodes, a hard requirement would leave pods unschedulable whenever
    # the pool is down to 1 node.
    #
    # extraLabels' value here is a fallback default, not the source of
    # truth — bootstrap/templates/scaleway.yaml injects this app's real
    # `wave` from bootstrap/values.yaml via source.helm.parameters
    # (see that app's `syncWaveLabelPaths` entry), overriding it. Set to
    # "-1" (not a real wave — waves start at 0) rather than a
    # plausible-looking number, so a standalone `helm template` run makes
    # the un-injected fallback obviously wrong instead of silently
    # matching production.
    extraLabels:
      scalepack.fr/sync-wave: "-1"
    topologySpreadConstraints: |
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - scalepack.fr/sync-wave
        labelSelector: {}
    # AWS credentials the awskms seal authenticates with. OpenBao must read
    # these at startup to unseal — they cannot come from OpenBao itself
    # (chicken-and-egg). Secret created out-of-band by 02-cluster/scaleway
    # terraform; values originate from 03-backup/scaleway kms.tf.
    extraSecretEnvironmentVars:
      - envName: AWS_ACCESS_KEY_ID
        secretName: openbao-unseal-aws
        secretKey: AWS_ACCESS_KEY_ID
      - envName: AWS_SECRET_ACCESS_KEY
        secretName: openbao-unseal-aws
        secretKey: AWS_SECRET_ACCESS_KEY
    standalone:
      config: |
        ui = true
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = true
        }
        storage "raft" {
          path    = "/openbao/data"
          node_id = "openbao-0"
        }
        # Auto-unseal via AWS KMS. region + kms_key_id are non-secret
        # (the IAM creds above gate access). On first `bao operator init`
        # this yields RECOVERY keys, not unseal keys — store them safely.
        seal "awskms" {
          region     = "eu-west-3"
          kms_key_id = "367e11de-75f4-4df0-a038-b6cf06ae2ead"
        }

    # Chart ships resources: {} by default. See
    # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
    # the same fix. OpenBao backs every other app's secrets in this
    # cluster (including its own snapshotAgent below), so it gets the
    # most headroom of anything here — raft compaction and unseal both
    # spike above steady-state usage. Request sized from `kubectl top
    # pods -n openbao` (2026-08-11, observed 49-62m/113Mi); limit kept
    # well above that for the compaction/unseal spikes above.
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
      limits:
        cpu: 500m
        memory: 512Mi

  injector:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  snapshotAgent:
    enabled: true
    schedule: "0 * * * *" # Every hours, at 0min.
    s3CredentialsSecret: "scaleway-s3-credentials"
    # Runs as its own CronJob (not a sidecar in the server pod) — a
    # short-lived s3cmd export, so it gets a low request but a limit
    # well above it: same "bursty tool, generous limit" reasoning as
    # monitoring/applications/scaleway/chart.app.yaml's grafana/prometheus comment.
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 256Mi
    config:
      s3Host: "s3.fr-par.scw.cloud"
      s3Bucket: "backup-dev-id"
      s3Uri: "s3://backup-dev-id"
      s3ExpireDays: "14"
      s3cmdExtraFlag: "--server-side-encryption -v"
      # baoAuthPath: "kubernetes"
      # baoRole: "snapshot"
