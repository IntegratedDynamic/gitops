apiVersion: v2
name: openbao
description: Wrapper chart pulling in vendor OpenBao, managed as an Application by the
  infrastructure repo's 10-cluster/scaleway/platform-apps/values-secrets.yaml
  (infra#84 — extracted from this repo's own bootstrap/values.yaml, see that
  file's own note). OpenBao is the root of that domain (wave 0) —
  its own unseal credentials come from a Secret provisioned out-of-band by
  Terraform (10-cluster/scaleway), not from OpenBao/ESO itself
  (chicken-and-egg), so it has no upstream dependency in this graph.
type: application
version: 0.1.0

dependencies:
  - name: openbao
    version: 0.28.6
    repository: "https://openbao.github.io/openbao-helm"
