enabled: true

namespace: openbao

# domain: the platform's base domain -- a value like everything else here,
# never hardcoded in the template.
domain: scalepack.fr

# hostSuffix: overridden per-cluster by the infra repo's argocd.tf
# (var.env_suffix, this app's hostSuffixParam: true in
# values-networking-resources.yaml) -- empty by default (main's own
# workspace, hostname unchanged: "openbao.scalepack.fr"). An ephemeral
# cluster workspace overrides this to e.g. "-pr-123", producing
# "openbao-pr-123.scalepack.fr" -- still one flat DNS label under domain,
# no change needed to gateway-config's wildcard cert.
hostSuffix: ""

gateway:
  hostPrefix: openbao
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# Service created by the openbao-helm chart (bootstrap/values.yaml),
# release name "openbao" — matches services/platform/openbao/init's baoAddr.
openbaoServer:
  serviceName: openbao
  servicePort: 8200
