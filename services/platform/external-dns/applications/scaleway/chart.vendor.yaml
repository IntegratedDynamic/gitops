apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      values: |
        provider:
          name: scaleway

        # gateway-httproute picks up hostnames from HTTPRoutes attached to
        # the shared Gateway (services/platform/gateway/config) — needs the Gateway API
        # CRDs from gateway-api-crds.yml.
        sources:
          - service
          - gateway-httproute

        # Credentials materialized by services/platform/external-dns/init from
        # OpenBao (see services/platform/external-dns/applications/scaleway/init.app.yaml).
        env:
          - name: SCW_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: external-dns-scaleway-credentials
                key: SCW_ACCESS_KEY
          - name: SCW_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: external-dns-scaleway-credentials
                key: SCW_SECRET_KEY

        # scalepack.fr, bought through Scaleway Domains & DNS. Leave
        # txtOwnerId as-is going forward — changing it orphans existing TXT
        # ownership records.
        domainFilters:
          - scalepack.fr
        policy: upsert-only
        registry: txt
        txtOwnerId: scaleway

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
