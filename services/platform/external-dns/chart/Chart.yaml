apiVersion: v2
name: external-dns
description: Wrapper chart pulling in vendor external-dns, managed as an Application
  by the infrastructure repo's
  10-cluster/scaleway/platform-apps/values-networking.yaml (infra#84,
  2026-08-25 — extracted from this repo's own bootstrap/values.yaml, see
  that file's own note). Consumes external-dns-scaleway-credentials,
  materialized by services/platform/external-dns/secret (moved to that
  same domain's wave 0 — still ESO/OpenBao, unchanged mechanism).
type: application
version: 0.1.0

dependencies:
  - name: external-dns
    version: 1.21.1
    repository: https://kubernetes-sigs.github.io/external-dns
