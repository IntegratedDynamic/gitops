# Values below nest under `external-dns:` because this chart is a thin
# wrapper declaring the real external-dns chart as a dependency (see
# chart/Chart.yaml) — Helm only exposes a subchart the values under its
# dependency name.
external-dns:
  provider:
    name: scaleway

  # gateway-httproute picks up hostnames from HTTPRoutes attached to
  # the shared Gateway (services/platform/gateway/config) — needs the Gateway API
  # CRDs from gateway-api-crds.yml.
  sources:
    - service
    - gateway-httproute

  # Credentials materialized by services/platform/external-dns/secret from
  # OpenBao (see bootstrap/values.yaml).
  env:
    - name: SCW_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: external-dns-scaleway-credentials
          key: SCW_ACCESS_KEY
    - name: SCW_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: external-dns-scaleway-credentials
          key: SCW_SECRET_KEY

  # scalepack.fr, bought through Scaleway Domains & DNS. Leave
  # txtOwnerId as-is going forward — changing it orphans existing TXT
  # ownership records.
  domainFilters:
    - scalepack.fr
  policy: upsert-only
  registry: txt
  txtOwnerId: scaleway

  # See cert-manager/applications/scaleway/chart.app.yaml's comment
  # on the same fix — this chart also ships resources: {} by default,
  # and this pod is one that was confirmed live 2026-08-11 getting
  # node-pressure Evicted during a fresh cluster boot.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

  # Soft "spread pods from this same sync-wave across nodes" — see
  # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
  # the same fix. podLabels' value is a fallback default, not the source
  # of truth — bootstrap/templates/scaleway.yaml injects this app's real
  # `wave` here (see this app's `syncWaveLabelPaths` entry in
  # bootstrap/values.yaml). Set to "-1" (not a real wave) rather than a
  # plausible-looking number, so a standalone render makes the
  # un-injected fallback obvious instead of silently matching production.
  podLabels:
    scalepack.fr/sync-wave: "-1"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - scalepack.fr/sync-wave
      labelSelector: {}
