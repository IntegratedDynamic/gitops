# Materializes the Scaleway DNS credentials that the infra repo's
# platform-apps/values-networking.yaml (infra#84) references via
# secretKeyRef. Lives in
# its own chart (mirrors services/platform/secrets-sync/config) rather than inside the
# external-dns Application itself, since platform/<env>/*.yml stays plain
# Application manifests pointing at external Helm charts — there's no room
# there for an ExternalSecret alongside.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    # Merge, not Owner (2026-08-25): the infra repo's 10-cluster/scaleway
    # bootstraps this same Secret directly (kubernetes_secret.
    # external_dns_scaleway_credentials) so external-dns's pod isn't
    # blocked on ESO's first sync during cluster bring-up -- same fix as
    # services/platform/cert-manager/webhook-secret, confirmed live for
    # that one (pod stuck on "secret not found" while ESO was still
    # catching up). ESO now just keeps the keys self-healed against OpenBao
    # going forward -- Merge requires the Secret to already exist, which
    # Terraform having created it first guarantees.
    creationPolicy: Merge
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.openbao.path }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
