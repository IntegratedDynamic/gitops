# Materializes the Scaleway DNS credentials that the infra repo's
# platform-apps/values-networking.yaml (infra#84) references via
# secretKeyRef. Lives in
# its own chart (mirrors services/platform/secrets-sync/config) rather than inside the
# external-dns Application itself, since platform/<env>/*.yml stays plain
# Application manifests pointing at external Helm charts — there's no room
# there for an ExternalSecret alongside.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.openbao.path }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
