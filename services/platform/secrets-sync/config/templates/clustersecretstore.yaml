# Point d'entrée unique d'ESO vers OpenBao, pour tout le cluster — pas
# seulement pour ce qui suit dans ce chart (secrets-sync/GitHub). Vit ici
# uniquement parce que ce chart tourne dans la même sync-wave qu'ESO
# lui-même (voir bootstrap/values.yaml) ; le mettre dans openbao/init
# (son emplacement d'origine) créait un piège inverse — ça RESSEMBLAIT à
# une dépendance sur le Helm chart d'ESO (puisque c'est ESO qui le
# consomme), ce qui a produit deux mauvais ordres de sync-wave avant
# d'être corrigé (2026-08-12).
#
# ATTENTION : ce fichier couple maintenant TOUT le cluster (velero,
# external-dns, dex, grafana, argocd-config, wireguard, cert-manager's
# DNS01 webhook...) à ce chart secrets-sync — si secrets-sync est un jour
# désactivé/supprimé de scaleway (ses `targets` y sont déjà vides, V0
# n'étant validée que sur local — voir values-scaleway.yaml), ce serait
# un motif suffisant pour "nettoyer" ce chart tout entier sans se rendre
# compte que ça casserait la moitié du cluster. Vérifié consciemment lors
# de ce déplacement (2026-08-12) — pas un oubli.
#
# Le provider s'appelle `vault` : OpenBao est un fork de Vault et parle la
# même API, ESO n'a pas de provider dédié.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStoreName }}
spec:
  provider:
    vault:
      server: {{ .Values.clusterSecretStore.baoAddr | quote }}
      path: {{ .Values.clusterSecretStore.mountPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          # Rôle créé par Terraform (infra repo's 11-secrets/openbao/managed).
          role: {{ .Values.clusterSecretStore.role | quote }}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
