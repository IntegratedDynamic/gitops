# Un SecretStore GitHub par cible.
#
# Pourquoi un par cible plutôt qu'un seul : dans le provider GitHub d'ESO, la
# portée du push (organisation / repo / environnement) est portée par le
# SecretStore via `repository` et `environment`. Le PushSecret ne choisit que
# les clés, pas la destination. Deux portées = deux stores, même si le repo
# visé est le même.
{{- range .Values.targets }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Wave 1 : après l'ExternalSecret qui fabrique le Secret de la clé privée.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    github:
      # Entiers, pas des chaînes : la CRD les type en int64.
      # Le `| int64` n'est pas cosmétique : sans lui Helm rend ces valeurs en
      # notation scientifique (4.346625e+06) et la CRD rejette le manifeste.
      appID: {{ $.Values.github.appID | int64 }}
      installationID: {{ $.Values.github.installationID | int64 }}
      organization: {{ $.Values.github.organization }}
      {{- if .repository }}
      repository: {{ .repository }}
      {{- else }}
      # Pas de `repository` → secret d'organisation.
      orgSecretVisibility: {{ $.Values.orgSecretVisibility }}
      {{- end }}
      {{- if .environment }}
      # L'environnement doit exister côté GitHub : ESO ne le crée pas.
      environment: {{ .environment }}
      {{- end }}
      auth:
        privateKey:
          name: {{ $.Values.github.privateKey.secretName }}
          key: {{ $.Values.github.privateKey.openbaoKey }}
{{- end }}
