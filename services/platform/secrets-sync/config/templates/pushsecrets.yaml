# Un PushSecret par cible : pousse les clés choisies du Secret k8s intermédiaire
# vers GitHub, à travers le SecretStore correspondant.
{{- range .Values.targets }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: github-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Wave 2 : après le SecretStore et le Secret source.
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ $.Values.pushRefreshInterval | quote }}
  secretStoreRefs:
    - name: github-{{ .name }}
      kind: SecretStore
  selector:
    secret:
      name: secrets-sync-{{ .name }}
  # `None` : supprimer le PushSecret laisse le secret en place côté GitHub.
  # Volontaire — un `helm uninstall` ne doit pas casser des workflows en prod.
  deletionPolicy: None
  # `Replace` : OpenBao fait autorité, une modification manuelle côté GitHub est
  # écrasée au refresh suivant.
  updatePolicy: Replace
  # Each entry's conversionStrategy is explicit, not left to the CRD's own
  # default: the API server injects "None" onto the live object when this
  # field is omitted, and ArgoCD's diff doesn't recognize that server-side
  # default as equivalent to "absent" -- the PushSecret showed permanent
  # OutOfSync (confirmed live 2026-09-14) even though nothing was ever
  # actually wrong. Matching what the live object always converges to
  # removes the drift outright.
  data:
    {{- range .secrets }}
    - conversionStrategy: None
      match:
        secretKey: {{ . }}
        remoteRef:
          remoteKey: {{ . }}
    {{- end }}
{{- end }}
