# Un ExternalSecret par cible : matérialise le secret OpenBao dédié à cette
# cible dans son propre Secret k8s. Isolation volontaire — voir le commentaire
# sur `source` dans values.yaml.
{{- range .Values.targets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets-sync-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ $.Values.source.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $.Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: secrets-sync-{{ .name }}
    creationPolicy: Owner
    # See services/platform/velero/init/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ $.Values.source.openbaoPathPrefix }}/{{ .name }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
