# The peer list used to be hardcoded here, replaced by
# services/platform/wireguard/secret's wireguard-peers Secret (synced from
# OpenBao, itself sourced from the infra repo's 04-vpn/wireguard state).
#
# syncWave: fallback default, not the source of truth —
# bootstrap/templates/scaleway.yaml injects this app's real `wave` here
# (see this app's `syncWaveLabelPaths` entry in bootstrap/values.yaml).
# The anti-affinity itself is hardcoded in templates/deployment.yaml now
# (topologySpreadConstraints' matchLabelKeys needs no wave-number value).
# Set to "-1" (not a real wave) rather than a plausible-looking number,
# so a standalone render makes the un-injected fallback obvious instead
# of silently matching production.
syncWave: "-1"
