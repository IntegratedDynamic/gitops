# Mirrors services/platform/dex/init's templates/externalsecret.yaml exactly —
# same OpenBao -> ESO -> Secret pattern every app's init chart uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.serverKey.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.serverKey.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.serverKey.openbaoPath }}
