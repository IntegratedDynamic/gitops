# Materializes Dex's credentials that bootstrap/values.yaml references
# via envVars/secretKeyRef. Split out of services/platform/dex/init
# 2026-08-13 (that chart now holds only the HTTPRoute) — every ExternalSecret-
# only chart across this repo moved into its own <product>/secret chart, all
# declared in wave 1 (alongside secrets-sync/ESO) instead of the product's
# own later wave, so ESO has the maximum possible buffer to actually sync
# the real Secret before anything downstream needs to mount it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.openbao.path }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
