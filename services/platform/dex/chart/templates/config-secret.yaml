# See values-scaleway.yaml's own comment on dex.configSecret for why this
# exists at all (the vendored Dex chart's own secret.yaml renders
# .Values.config via plain toYaml, no `tpl` — a template placeholder
# written there would never be evaluated). This is now the SOLE source of truth
# for Dex's config; do not also add a `dex.config` key to any values file,
# it would render this file's own templating moot but the subchart
# wouldn't consume it anyway (configSecret.create: false).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dex.configSecret.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.yaml: |
    issuer: https://auth{{ .Values.hostSuffix }}.{{ .Values.domain }}

    storage:
      # See values-scaleway.yaml's header comment — `memory` rotates the
      # OIDC signing keys on every Dex restart and breaks every RP's
      # cached JWKS.
      type: kubernetes
      config:
        inCluster: true

    # GitHub is the only login method — no local username/password DB.
    enablePasswordDB: false

    oauth2:
      # Skip Dex's own "Grant Access" consent screen — envoy-gateway is
      # our own trusted client, not a third-party app.
      skipApprovalScreen: true

    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: "$GITHUB_CLIENT_ID"
          clientSecret: "$GITHUB_CLIENT_SECRET"
          redirectURI: https://auth{{ .Values.hostSuffix }}.{{ .Values.domain }}/callback
          orgs:
            - name: IntegratedDynamic

    staticClients:
      - id: envoy-gateway
        name: Envoy Gateway
        # staticClients has no $VAR expansion (that's connectors/storage
        # only) — it needs this dedicated secretEnv field instead,
        # naming the env var (no $ prefix). https://github.com/dexidp/dex/issues/889
        secretEnv: ENVOY_CLIENT_SECRET
        redirectURIs:
          # demo's own gateway was never given hostSuffix support (out of
          # scope for the gateway refactor that added it everywhere else)
          # — stays unsuffixed to match its actual, always-flat hostname.
          - https://demo.{{ .Values.domain }}/oauth2/callback
      - id: argocd
        name: ArgoCD
        secretEnv: ARGOCD_CLIENT_SECRET
        redirectURIs:
          - https://argocd{{ .Values.hostSuffix }}.{{ .Values.domain }}/auth/callback
      - id: argocd-cli
        name: ArgoCD CLI
        public: true
        redirectURIs:
          # Fixed port (8085) is the CLI's documented default
          # (--sso-port to override) — a local loopback URL, never
          # suffixed.
          - http://localhost:8085/auth/callback
      - id: openbao
        name: OpenBao
        secretEnv: OPENBAO_CLIENT_SECRET
        redirectURIs:
          - https://openbao{{ .Values.hostSuffix }}.{{ .Values.domain }}/ui/vault/auth/oidc/oidc/callback
          # `bao login -method=oidc`'s own default local callback port.
          - http://localhost:8250/oidc/callback
      - id: grafana
        name: Grafana
        secretEnv: GRAFANA_CLIENT_SECRET
        redirectURIs:
          # Grafana's fixed generic_oauth callback path.
          - https://grafana{{ .Values.hostSuffix }}.{{ .Values.domain }}/login/generic_oauth
      - id: argo-workflows
        name: Argo Workflows
        secretEnv: ARGO_WORKFLOWS_CLIENT_SECRET
        redirectURIs:
          # Argo Server's fixed SSO callback path (server.sso.redirectUrl,
          # services/platform/argo-workflows/chart/values-scaleway.yaml).
          - https://argo-workflows{{ .Values.hostSuffix }}.{{ .Values.domain }}/oauth2/callback
