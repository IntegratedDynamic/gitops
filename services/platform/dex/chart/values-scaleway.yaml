# The identity broker: turns GitHub's org-restricted OAuth into a standard
# OIDC provider that Envoy Gateway's native SecurityPolicy.oidc can talk to
# directly (GitHub itself has no discovery/JWKS/id_token — Dex bridges that
# gap). Single replica — no HA on Scaleway, consistent with the rest of this
# cluster.
#
# storage.type: kubernetes (was `memory`). Dex's OIDC signing keys are part
# of its storage; with `memory` they are regenerated on every pod restart,
# which silently invalidates every already-issued id_token platform-wide —
# argocd-server / Grafana / OpenBao keep a stale JWKS cached and start
# rejecting valid logins with "failed to verify id token signature" until
# each is itself restarted. Confirmed live 2026-08-29 (a restored homelab:
# reconcile OpenBao -> restart Dex to pick up rotated client secrets -> every
# OIDC RP broke). `kubernetes` storage persists the signing keys (and all
# other Dex state) in `dex.coreos.com` CRDs, so a Dex restart no longer
# rotates them. The chart's default RBAC already covers it
# (rbac.create + rbac.createClusterScoped, both true — a namespaced Role on
# dex.coreos.com/* plus a ClusterRole letting Dex create its own CRDs on
# first boot). Still single-replica; the CRD-backed store tolerates the
# brief 2-pod overlap of a rolling update.
#
# NOT fixed here: client secrets (staticClients' secretEnv) are still read
# from `dex-credentials` at pod start, so a rotation of those still needs a
# manual `kubectl rollout restart deploy/dex` (+ the RPs). That half wants a
# secret-reloader — its own follow-up.
#
# staticClients.envoy-gateway is the one OAuth2 client every protected app's
# SecurityPolicy authenticates against (see services/products/demo/chart/templates/securitypolicy.yaml).
# Its redirectURIs list must include every protected app's callback URL —
# add a line here whenever a new app opts into SSO.
#
# staticClients.argocd is a separate client: ArgoCD talks OIDC natively
# (configs.cm.oidc.config in the infrastructure repo's argocd.tf) instead of
# going through Envoy Gateway's SecurityPolicy filter, so it needs its own
# clientID/secret (see services/platform/argocd-config/config for the redirectURI's HTTPRoute
# and the ExternalSecret materializing this secret into argocd's namespace).
#
# staticClients.argocd-cli is `argocd login --sso`'s own direct PKCE dance
# against Dex (bypassing argocd-server entirely, unlike the browser flow
# above) — it can never know argocd's client secret, so it needs its own
# public (secret-less) client, wired via configs.cm.oidc.config.cliClientID
# in the infrastructure repo's argocd.tf. Confirmed live: pointing the CLI
# at the confidential `argocd` client instead fails with Dex's
# "invalid_client: Invalid client credentials."
#
# staticClients.grafana is another native-OIDC app, same shape as argocd:
# Grafana's own auth.generic_oauth provider (see
# bootstrap/values.yaml) talks to Dex directly, with
# its role_attribute_path mapping the IntegratedDynamic:Admin group (this
# same "groups" claim sso-guard already reads) to Grafana's Admin org role,
# everyone else falling back to Viewer. Secret materialized into the
# monitoring namespace by services/platform/monitoring/grafana-secret, mirroring services/platform/dex/secret.
#
# staticClients.openbao is different again: OpenBao has no app-level "OIDC
# provider" setting like ArgoCD/Grafana — it's a dedicated JWT/OIDC *auth
# method* (auth/oidc), configured inside OpenBao itself (bao write
# auth/oidc/config / auth/oidc/role, applied out-of-band the same way as
# the rest of OpenBao's internal config — see openbao-claude.md). Both
# redirect URIs are required: the UI's fixed callback path
# (/ui/vault/auth/<mount>/oidc/callback, mount = "oidc") and the CLI's
# default `bao login -method=oidc` callback (localhost:8250). See
# services/platform/openbao/gateway for the HTTPRoute exposing openbao.scalepack.fr.
#
# Credentials (GitHub client id/secret, the static client secret) come from
# OpenBao via services/platform/dex/secret — wave 1 in bootstrap/values.yaml
# (alongside secrets-sync/ESO), not this chart's own wave 6, so ESO has the
# maximum possible buffer to sync the real Secret before this pod starts.
#
# domain/hostSuffix: same flat-suffix convention as the five *-gateway
# charts (services/platform/dex/gateway et al., "refactor(gateway): flat
# hostSuffix instead of a nested baseDomain") -- domain is the platform's
# real base domain (never hardcoded in a template), hostSuffix is
# overridden per-cluster by the infra repo's argocd.tf (var.env_suffix,
# dex-apps' own hostSuffix parameter in 10-cluster/scaleway/platform-apps/
# values-dex.yaml). Empty by default: main's own workspace keeps every
# hostname below unchanged.
#
# CONFIRMED LIVE (infra#113 SSO-fix, 2026-09-17): an ephemeral cluster's
# Gateway/HTTPRoute layer already got hostSuffix support from that gateway
# refactor, but Dex's OWN issuer/redirect-URI config here never did --
# every OIDC login against a suffixed cluster (e.g. https://argocd-pr-123.
# scalepack.fr) failed outright, because Dex's static "argocd" client only
# ever whitelisted the UNSUFFIXED https://argocd.scalepack.fr/auth/callback,
# and ArgoCD's own oidc.config.issuer (infra repo's argocd.tf) pointed at
# the unsuffixed https://auth.scalepack.fr -- production's real Dex, not
# the ephemeral cluster's own.
domain: scalepack.fr
hostSuffix: ""

# infra#113 SSO-fix follow-up (2026-09-18): GitHub's OAuth App requires an
# exact, manually pre-registered redirect_uri per host -- confirmed live
# testing cluster pr-114 ("Be careful! The redirect_uri is not associated
# with this application"), and that doesn't scale to one new hostname per
# ephemeral cluster. Ephemeral clusters (hostSuffix != "") bypass the real
# GitHub connector via a local password login instead (config-secret.yaml's
# enablePasswordDB/staticPasswords) -- it's not the stable workspace's real
# GitHub-org-gated SSO, but it's enough to validate the OIDC wiring itself
# (Dex <-> ArgoCD/Grafana/OpenBao). Plaintext on purpose, not pre-hashed:
# config-secret.yaml bcrypts it at render time via Sprig's `bcrypt`, and
# it's threaded in fresh per apply by 10-cluster/scaleway/argocd.tf's
# random_password.dex_static_password (dex-apps' own parameter, same
# mechanism as hostSuffix above) -- never a fixed password committed here.
# Empty by default: main's own workspace never enables the password DB at
# all (see config-secret.yaml's `ne .Values.hostSuffix ""` guard).
dexStaticPassword: ""

# Values below nest under `dex:` because this chart is a thin wrapper
# declaring the real Dex chart as a dependency (see chart/Chart.yaml) — Helm
# only exposes a subchart the values under its dependency name.
dex:
  # The vendored Dex chart's own templates/secret.yaml renders `.Values.
  # config` via a PLAIN `toYaml` — confirmed in charts/dex-0.24.1.tgz, no
  # `tpl` call anywhere near it -- so a `{{ }}` placeholder written directly
  # into a `config:` key here would never be evaluated, it'd be dumped into
  # Dex's actual config file as literal text. configSecret.create: false
  # (+ a name of our own choosing) turns that subchart-rendered Secret off
  # entirely; templates/config-secret.yaml (this chart's own, sibling to
  # this file) is now the SOLE source of truth for Dex's config, built with
  # real Helm templating so issuer/redirectURI/staticClients can use
  # {{ .Values.hostSuffix }}.
  configSecret:
    create: false
    name: dex-config-override

  envVars:
    - name: GITHUB_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: dex-credentials
          key: github-client-id
    - name: GITHUB_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-credentials
          key: github-client-secret
    - name: ENVOY_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-credentials
          key: envoy-client-secret
    - name: ARGOCD_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-credentials
          key: argocd-client-secret
    - name: OPENBAO_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-credentials
          key: openbao-client-secret
    - name: GRAFANA_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-credentials
          key: grafana-client-secret
    - name: ARGO_WORKFLOWS_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: dex-credentials
          key: argo-workflows-client-secret

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  # Soft "spread pods from this same sync-wave across nodes" — see
  # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
  # the same fix. podLabels' value is a fallback default, not the source
  # of truth — bootstrap/templates/scaleway.yaml injects this app's real
  # `wave` here (see this app's `syncWaveLabelPaths` entry in
  # bootstrap/values.yaml). Set to "-1" (not a real wave) rather than a
  # plausible-looking number, so a standalone render makes the
  # un-injected fallback obvious instead of silently matching production.
  podLabels:
    scalepack.fr/sync-wave: "-1"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - scalepack.fr/sync-wave
      labelSelector: {}
