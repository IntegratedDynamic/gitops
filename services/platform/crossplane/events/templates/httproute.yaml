# Public receiver for GitHub's push webhook. Authenticity = the HMAC check done
# by the EventSource (webhookSecret); only /hooks/* is routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workspace-events
  namespace: {{ .Values.namespace }}
  annotations:
    # After the EventSource (wave 1): the route's backend Service
    # (workspaces-eventsource-svc) is created by the controller from it, and an
    # HTTPRoute with a missing backend is not Healthy -- in wave 0 it would
    # block the waves that create that Service.
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ printf "%s%s.%s" .Values.gateway.hostPrefix .Values.hostSuffix .Values.domain }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: workspaces-eventsource-svc
          port: 12000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /hooks/
