# Slack bot token for the Sensor's notify-slack trigger. The OpenBao entry is
# declared in the infra repo's 11-secrets/openbao/managed (placeholder value,
# ignore_changes) and the real token is set once by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.slack.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.slack.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    # The HTTP trigger sends a header value verbatim: build "Bearer <token>" here.
    template:
      data:
        authorization: "Bearer {{ `{{ .token }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.slack.openbaoPath }}
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
