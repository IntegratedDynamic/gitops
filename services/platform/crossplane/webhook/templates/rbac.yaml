apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-webhook
  namespace: {{ .Values.namespace }}
---
# Workspaces are cluster-scoped, hence ClusterRole; resourceNames pins it to
# exactly these objects and verbs (no list/watch/create/delete).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-webhook
rules:
  - apiGroups: ["opentofu.upbound.io"]
    resources: ["workspaces"]
    resourceNames: {{ .Values.workspaces | toJson }}
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-webhook
subjects:
  - kind: ServiceAccount
    name: workspace-webhook
    namespace: {{ .Values.namespace }}
