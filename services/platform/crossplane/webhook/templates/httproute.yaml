# Public receiver for GitHub's push webhook. Authenticity = the HMAC check in
# hooks.yaml; only /hooks/* is routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workspace-webhook
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ printf "%s%s.%s" .Values.gateway.hostPrefix .Values.hostSuffix .Values.domain }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: workspace-webhook
          port: 9000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /hooks/
