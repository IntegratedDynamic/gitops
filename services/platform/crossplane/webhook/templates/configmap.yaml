apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-webhook
  namespace: {{ .Values.namespace }}
data:
  # Rendered by webhook itself at start (-template): getenv keeps the HMAC
  # secret out of the ConfigMap.
  hooks.yaml: |
    - id: workspaces
      execute-command: /config/annotate.sh
      command-working-directory: /tmp
      response-message: "workspaces annotated"
      trigger-rule:
        and:
          - match:
              type: payload-hmac-sha256
              secret: '{{ `{{ getenv "HMAC_SECRET" }}` }}'
              parameter:
                source: header
                name: X-Hub-Signature-256
          - match:
              type: value
              value: push
              parameter:
                source: header
                name: X-GitHub-Event
          - match:
              type: value
              value: refs/heads/{{ .Values.gitRef }}
              parameter:
                source: payload
                name: ref
  annotate.sh: |
    #!/bin/sh
    # PATCH the force-reconcile annotation on each Workspace (cluster-scoped)
    # straight through the API server with this pod's ServiceAccount token.
    set -eu
    SA=/var/run/secrets/kubernetes.io/serviceaccount
    now=$(date -u +%s)
    for ws in {{ join " " .Values.workspaces }}; do
      curl -sS --fail --cacert "$SA/ca.crt" \
        -H "Authorization: Bearer $(cat "$SA/token")" \
        -H "Content-Type: application/merge-patch+json" \
        -X PATCH \
        -d "{\"metadata\":{\"annotations\":{\"scalepack.fr/force-reconcile\":\"$now\"}}}" \
        "https://kubernetes.default.svc/apis/opentofu.upbound.io/v1beta1/workspaces/$ws" >/dev/null
      echo "annotated $ws"
    done
