# The GitHub OAuth App credentials behind authentik's "GitHub" login source,
# for the authentik-managed Workspace (14-sso/managed/github.tf): EXTERNAL
# secrets -- issued by GitHub, nothing can generate them -- so, unlike
# authentik's own random secrets (kv/apps/authentik/eso-generated), they are
# Terraform-owned in the infra repo's 11-secrets/openbao/managed
# (vault_kv_secret_v2.authentik_github, kv/apps/authentik/credentials).
# Surfaced to the Workspace as TF_VAR_github_client_id/_secret
# (workspace-authentik-managed.yaml). Until real values are in OpenBao they are
# the "REPLACE_ME" placeholders and the root creates no source at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.authentikGithub.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Wave 2, AFTER openbao-managed (wave 1, which writes
    # apps/authentik/credentials) and BEFORE the authentik-managed Workspace
    # (wave 3): same reasoning as externalsecret-authentik-token.yaml -- a sync
    # error here must never fail the sync before the wave-1 Workspaces are
    # updated.
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.authentikGithub.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  data:
    {{- range $k, $prop := dict "client-id" .Values.authentikGithub.clientIdProperty "client-secret" .Values.authentikGithub.clientSecretProperty }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $.Values.authentikGithub.openbaoPath }}
        property: {{ $prop }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
