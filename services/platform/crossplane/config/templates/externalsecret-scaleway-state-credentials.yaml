# SCW_ACCESS_KEY/SCW_SECRET_KEY for every Workspace: OpenTofu's native
# `backend "s3"` (surfaced as AWS_* by the Workspace env) and the
# `data.external.scw_credentials` → cross-root `terraform_remote_state`
# reads in each root. A dedicated workload identity (infra repo's
# 01-iam/workload/scaleway, "argo-workflows-state") — this credential
# leaves the admin's machine and lands on the cluster, so it gets its own
# identity, not a reused state-bucket one. Moved here from
# services/platform/argo-workflows/secret (issue #101): same OpenBao KV
# path, new target Secret name, this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.stateCredentials.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.stateCredentials.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.stateCredentials.openbaoPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
