# The authentik-managed Workspace's provider credential: authentik's akadmin
# API token (AUTHENTIK_BOOTSTRAP_TOKEN, created on authentik's first start),
# read from the same ESO-generated OpenBao object authentik itself reads its
# other credentials from (services/platform/authentik/secret). Surfaced to the Workspace as
# TF_VAR_authentik_token (workspace-authentik-managed.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.authentikToken.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Wave 2: AFTER openbao-managed / grafana-managed (wave 1), and BEFORE the
    # authentik-managed Workspace (wave 3) that reads this Secret.
    #  - after wave 1: this Secret only exists once ESO has generated and pushed
    #    authentik's credentials, which itself needs the `eso-generate` policy
    #    that the openbao-managed Workspace (wave 1, same Application) applies.
    #    At wave 0 its sync error ("could not get secret data from provider")
    #    failed the whole sync before the Workspaces were ever updated -- so
    #    that policy never got applied.
    #  - before wave 3: the Workspace does NOT "just retry until the Secret
    #    appears" when it shares or precedes this wave. ArgoCD reports it as a
    #    failed task and never starts the wave that creates the Secret. See the
    #    sync order in workspace-authentik-managed.yaml.
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.authentikToken.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.authentikToken.openbaoPath }}
        property: {{ .Values.authentikToken.property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
