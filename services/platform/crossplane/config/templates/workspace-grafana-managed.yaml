# 12-monitoring/grafana/managed — Grafana-as-code (MCP service account,
# prometheus/loki/tempo data sources, the default dashboards). Replaces the
# terraform-apply-grafana-managed CronWorkflow (issue #101). Its grafana
# provider authenticates directly as Grafana's admin (basic auth) — there
# is no separate grafana-bootstrap Workspace anymore (its minted
# service-account token could stop authenticating after a Velero restore,
# infra#82 mode 1). The admin password comes in as TF_VAR_grafana_admin_password
# from the crossplane-grafana-admin ESO Secret (externalsecret-grafana-admin.yaml),
# not a cross-root state read — so there's nothing to sequence against
# openbao-managed; the Workspace just needs Grafana reachable, which the
# infra crossplane-apps tier's wait_grafana_healthy gate ensures.
# infra#82 restore drift is handled inside the root itself (pinned data-source
# uids + config-driven `import` blocks — see 12-monitoring/grafana/managed/main.tf).
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: grafana-managed
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # See providerconfig.yaml -- Workspace CRD ships in wave 0's Provider package.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    crossplane.io/external-name: {{ .Values.workspaces.grafanaManaged.externalName }}
spec:
  deletionPolicy: Orphan
  managementPolicies: ["Observe", "Create", "Update"]
  forProvider:
    # Surface the full `tofu init/plan/apply` CLI output in the
    # provider-opentofu pod logs (kubectl -n crossplane-system logs
    # deploy/provider-opentofu, and Loki via Alloy) -- the closest thing to
    # the retired CronWorkflow`s per-run pod logs.
    enableTofuCLILogging: true
    source: Remote
    module: git::{{ .Values.infraRepo }}?ref={{ .Values.gitRef }}
    entrypoint: {{ .Values.workspaces.grafanaManaged.entrypoint }}
    remotePullPolicy: Always
    planArgs:
      - -var-file=env/{{ .Values.workspaces.grafanaManaged.externalName }}.tfvars
    applyArgs:
      - -var-file=env/{{ .Values.workspaces.grafanaManaged.externalName }}.tfvars
    env:
      {{- include "crossplane-config.stateCredentialsEnv" . | nindent 6 }}
      - name: TF_VAR_grafana_url
        value: {{ .Values.workspaces.grafanaManaged.grafanaUrl | quote }}
      # Grafana admin password — basic auth for the grafana provider AND the
      # infra#82 restore-adopt probes (data.http, admin-authed).
      - name: TF_VAR_grafana_admin_password
        secretKeyRef:
          namespace: {{ .Values.namespace }}
          name: {{ .Values.grafanaAdmin.secretName }}
          key: admin-password
  providerConfigRef:
    name: default
