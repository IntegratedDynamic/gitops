# Password of authentik's read-only database role `grafana_reader`, for the
# authentik-managed Workspace, which declares the Grafana data source of the
# "who has access to what" dashboard (infra repo's 14-sso/managed/reporting.tf).
# ESO-generated in services/platform/authentik/secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.authentikReporting.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Wave 2, like the akadmin token and for the same reasons
    # (externalsecret-authentik-token.yaml): same producer, read by the same
    # wave-3 Workspace.
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.authentikReporting.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.authentikReporting.openbaoPath }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
