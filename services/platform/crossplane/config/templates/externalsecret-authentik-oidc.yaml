# The OIDC client secrets for 14-sso/managed/oidc.tf (the providers authentik
# serves to ArgoCD, Grafana, Crossview and OpenBao). They are the SAME internal
# random secrets the Dex static clients used (kv/apps/dex/credentials, owned by
# the infra repo's 11-secrets/openbao/managed), so each client keeps reading the
# secret it already reads and only its issuer changes. Assembled into ONE JSON
# map (client key -> secret), surfaced to the Workspace as
# TF_VAR_oidc_client_secrets (workspace-authentik-managed.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.authentikOidc.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Wave 2, AFTER openbao-managed (wave 1, which writes
    # apps/authentik/oidc-clients) and BEFORE the authentik-managed Workspace
    # (wave 3): same reasoning as externalsecret-authentik-token.yaml.
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.authentikOidc.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client-secrets: >-
          {{ "{{" }} dict {{ range $k, $_ := .Values.authentikOidc.clients }}"{{ $k }}" .{{ $k }} {{ end }}| toJson {{ "}}" }}
  data:
    {{- range $k, $prop := .Values.authentikOidc.clients }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $.Values.authentikOidc.openbaoPath }}
        property: {{ $prop }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
