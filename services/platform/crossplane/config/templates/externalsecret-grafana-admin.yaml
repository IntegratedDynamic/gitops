# Grafana's admin credential (kv/apps/grafana/admin — admin-user /
# admin-password), owned by infra repo's 11-secrets/openbao/managed. The
# grafana-managed Workspace's OpenTofu module authenticates as this admin
# (basic auth) instead of a minted service-account token that could stop
# authenticating after a Velero restore (infra#82 mode 1) — see
# 12-monitoring/grafana/managed/version.tf. Same OpenBao KV path the
# monitoring/grafana-secret chart already syncs for Grafana itself; this is
# a second target Secret, in this namespace, for the Workspace's env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafanaAdmin.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.grafanaAdmin.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.grafanaAdmin.openbaoPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
