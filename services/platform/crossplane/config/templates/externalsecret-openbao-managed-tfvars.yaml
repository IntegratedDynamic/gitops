# The three required, no-default OpenTofu variables the openbao/managed
# reconcile can't generate itself (dex_github_connector,
# secrets_sync_github_eso_private_key, secrets_sync_github) — a duplicate
# of the same admin-supplied values 11-secrets/openbao/managed's "real"
# vault_kv_secret_v2 resources also write, JSON-encoded and TF_VAR_-prefixed
# on the infra-repo side, so the openbao-managed Workspace's env satisfies
# them directly. Moved here from services/platform/argo-workflows/secret
# (issue #101): same OpenBao KV path, new target Secret name, this
# namespace. Only openbao/managed consumes it — neither grafana Workspace
# references this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.openbaoManagedTfvars.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.openbaoManagedTfvars.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.openbaoManagedTfvars.openbaoPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
