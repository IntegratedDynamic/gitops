apiVersion: v2
name: authentik-secret
description: >-
  authentik's Secret, generated in-cluster: ESO generates the random values
  once, pushes them to OpenBao (kv/apps/authentik/eso-generated, IfNotExists)
  and an ExternalSecret reads them back as the one Secret the authentik chart
  and its PostgreSQL consume. No Terraform apply is involved -- these are
  INTERNAL secrets, see the infra repo's 11-secrets/openbao/managed
  (vault_policy.eso_generate) for the internal-vs-external split.
type: application
version: 0.1.0
