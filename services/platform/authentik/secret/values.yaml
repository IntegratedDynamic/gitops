# authentik's single Secret, materialized from OpenBao. The values are random
# strings generated by ESO (templates/generators.yaml) the FIRST time, pushed
# to OpenBao with updatePolicy IfNotExists, and read back from there: OpenBao
# stays the durable, audited source of truth (it survives a cluster rebuild
# through its raft snapshots), the in-cluster generator is only the origin.
# The keys are authentik's own env var names, so the upstream chart consumes
# the Secret whole via envFrom.
namespace: authentik

# ClusterSecretStore declared by services/platform/secrets-sync/config.
clusterSecretStoreName: openbao

secretName: authentik-credentials

# Object owned by ESO (the `eso-generate` policy lets ESO write only
# kv/{data,metadata}/apps/+/eso-generated). External secrets live in
# .../credentials, owned by Terraform.
openbaoPath: apps/authentik/eso-generated

refreshInterval: 1h

# One entry per key; length is the generated string's length.
#  - AUTHENTIK_SECRET_KEY: signs cookies / derives unique user ids. Never
#    rotate it after first install (authentik's own warning).
#  - AUTHENTIK_POSTGRESQL__PASSWORD: shared by authentik and its PostgreSQL
#    StatefulSet; changing it needs the database's own password changed too.
#  - AUTHENTIK_BOOTSTRAP_TOKEN: API token of the built-in akadmin, created on
#    FIRST start only. 14-sso/managed authenticates with it.
#  - AUTHENTIK_BOOTSTRAP_PASSWORD: akadmin's break-glass UI password (first
#    start only; read it from OpenBao).
generated:
  - {key: AUTHENTIK_SECRET_KEY, length: 64}
  - {key: AUTHENTIK_POSTGRESQL__PASSWORD, length: 32}
  - {key: AUTHENTIK_BOOTSTRAP_TOKEN, length: 48}
  - {key: AUTHENTIK_BOOTSTRAP_PASSWORD, length: 32}
