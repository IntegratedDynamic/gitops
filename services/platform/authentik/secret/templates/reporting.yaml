# A second, independent internal secret: the password of `grafana_reader`, the
# read-only PostgreSQL role behind the "who has access to what" Grafana
# dashboard (chart/templates/reporting-role.yaml creates the role, the infra
# repo's 14-sso/managed/reporting.tf declares the Grafana data source).
# Its own object because the main one is pushed IfNotExists as a whole: a key
# added to it would never reach an OpenBao that already holds it.
# Same three steps and waves as the main secret (generators.yaml, pushsecret.yaml,
# externalsecret.yaml).
{{- with .Values.reporting }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: {{ .length }}
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}-generated
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  target:
    name: {{ .secretName }}-generated
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .secretName }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: {{ $.Values.clusterSecretStoreName }}
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ .secretName }}-generated
  data:
    - conversionStrategy: None
      match:
        remoteRef:
          remoteKey: {{ .openbaoPath }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $.Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .openbaoPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
