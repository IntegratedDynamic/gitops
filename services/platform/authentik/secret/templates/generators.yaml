# Step 1 (wave 0): generate. One Password generator per key (each yields a
# single `password` field), and one ExternalSecret that assembles them into a
# local Secret holding ALL the keys under their final names -- so the push
# below is a single create of one KV object (a per-key push would be a
# create followed by updates of an object that already holds a partial value).
#
# This local Secret is regenerated on every refresh; that is harmless: OpenBao
# keeps the first value (IfNotExists) and every consumer reads OpenBao, never
# this Secret.
{{- range .Values.generated }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-{{ .key | lower | replace "_" "-" }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: {{ .length }}
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}-generated
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  target:
    name: {{ .Values.secretName }}-generated
    creationPolicy: Owner
  dataFrom:
    {{- range .Values.generated }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-{{ .key | lower | replace "_" "-" }}
      rewrite:
        # The generator's only field is `password`; give it the final key name.
        - transform:
            template: {{ .key | quote }}
    {{- end }}
