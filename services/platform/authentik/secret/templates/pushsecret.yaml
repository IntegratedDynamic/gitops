# Step 2 (wave 1): push the generated Secret to OpenBao, ONCE. IfNotExists
# means an existing object is never replaced. That guard is client-side: the
# `eso-generate` policy has to allow `update` on the object (ESO stamps
# metadata first, which makes the write an update), so the ACL alone would not
# stop an overwrite -- keep this field. KV v2 versioning keeps earlier values. A
# restored/surviving OpenBao keeps its values; only a fresh one gets new ones.
# No secretKey in `match`: the whole Secret is pushed as one object.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: {{ .Values.clusterSecretStoreName }}
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ .Values.secretName }}-generated
  data:
    # conversionStrategy: written explicitly to match the CRD's own schema
    # default, avoiding permanent OutOfSync in ArgoCD.
    - conversionStrategy: None
      match:
        remoteRef:
          remoteKey: {{ .Values.openbaoPath }}
