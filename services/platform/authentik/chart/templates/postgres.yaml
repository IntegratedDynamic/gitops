# PostgreSQL for authentik (the only stateful dependency since Redis was
# dropped in 2025.10). A plain single-replica StatefulSet on the official
# image rather than an operator-managed cluster: one fewer CRD tier to order
# in the platform-apps DAG for a first increment. The host is a value
# (authentik.authentik.postgresql.host), so swapping this for CloudNativePG
# or a managed database later is a values change, not a chart change.
#
# Credentials: POSTGRES_PASSWORD reads the very key authentik itself reads
# (AUTHENTIK_POSTGRESQL__PASSWORD) from the OpenBao-synced Secret, so there is
# exactly one source of truth for the password.
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
# Fields below that look redundant (podManagementPolicy, updateStrategy,
# revisionHistoryLimit, the retention policy, probe thresholds, volumeMode,
# the PVC template's apiVersion/kind/status...) are the API server's own
# defaults, written explicitly so ArgoCD does not show a permanent OutOfSync
# (lists such as volumeClaimTemplates are compared whole).
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          terminationMessagePath: /dev/termination-log
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretName }}
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
          args:
            - -c
            - max_connections={{ .Values.postgres.maxConnections }}
          # timeoutSeconds 5, not the 1 s default: `pg_isready` runs through `sh -c`
          # and missed 1 s on a node under a cold start's CPU contention (seen live
          # 2026-11-26), which fails readiness and, on liveness, restarts the one
          # database authentik cannot run without.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
      status:
        phase: Pending
{{- end }}
