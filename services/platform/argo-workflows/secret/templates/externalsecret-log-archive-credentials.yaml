# SCW_ACCESS_KEY/SCW_SECRET_KEY for the Argo Workflows controller's own
# artifactRepository.s3 (chart/values-scaleway.yaml) -- a dedicated
# workload identity (infra repo's 03-storage/scaleway, argo_workflows_logs
# entry), not the CronWorkflow pod's own state-bucket credentials above:
# different consumer (the controller Deployment, not a Workflow pod),
# different bucket, same "one identity per consumer" contract as every
# other tool bucket in that root.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.logArchiveCredentials.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.logArchiveCredentials.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.logArchiveCredentials.openbaoPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
