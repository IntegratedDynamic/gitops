# Materializes the argo-workflows Dex static client's id/secret (both
# properties of apps/dex/credentials, infra repo's
# 05-secrets/openbao/managed/main.tf's vault_kv_secret_v2.dex_credentials)
# into this namespace, same shape as
# services/platform/monitoring/grafana-secret's oidc ExternalSecret --
# single-key `data:` extraction rather than `dataFrom`, since the argo
# server chart's server.sso.clientId/clientSecret each want their own
# secretKey (client-id / client-secret) in one Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.sso.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.sso.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ .Values.sso.openbaoPath }}
        property: argo-workflows-client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.sso.openbaoPath }}
        property: argo-workflows-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
