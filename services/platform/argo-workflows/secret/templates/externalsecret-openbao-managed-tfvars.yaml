# The three required, no-default Terraform variables terraform-openbao-apply
# can't generate itself (dex_github_connector,
# secrets_sync_github_eso_private_key, secrets_sync_github) — a duplicate of
# the same admin-supplied values 11-secrets/openbao/managed's "real"
# vault_kv_secret_v2 resources also write, landed here specifically so the
# CronWorkflow's own apply can satisfy them (TF_VAR_* env vars, already
# JSON-encoded on the infra-repo side). See that root's main.tf comment on
# vault_kv_secret_v2.argo_workflows_openbao_managed_tfvars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.openbaoManagedTfvars.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.openbaoManagedTfvars.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.openbaoManagedTfvars.openbaoPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
