# SCW_ACCESS_KEY/SCW_SECRET_KEY for terraform-openbao-apply's CronWorkflow:
# both its own `terraform init` backend (-backend-config) and the
# data.external.scw_credentials env-var fallback used by the other
# cross-root state reads in 05-secrets/openbao/managed/main.tf. A dedicated
# workload identity (infra repo's 01-iam/workload/scaleway,
# "argo-workflows-state") -- this credential leaves the admin's machine and
# lands here on the cluster, so it gets its own identity like any other
# in-cluster workload, not a reused state-bucket one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.scalewayStateCredentials.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.scalewayStateCredentials.secretName }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.scalewayStateCredentials.openbaoPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
