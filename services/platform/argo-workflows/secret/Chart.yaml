apiVersion: v2
name: argo-workflows-secret
description: >-
  ExternalSecret-only chart materializing the Secrets
  terraform-openbao-apply's CronWorkflow pod mounts (Scaleway state-bucket
  credentials, the tfvars only an admin's local.auto.tfvars otherwise
  carries) from OpenBao. Split out as its
  own <product>/secret chart, same pattern as every other one in this repo
  (see e.g. services/platform/velero/secret) -- declared in wave 1 alongside
  ESO/secrets-sync, the earliest wave that can possibly hold it, so ESO gets
  the maximum buffer to sync these before terraform-openbao-apply's own wave
  needs to mount them.
type: application
version: 0.1.0
