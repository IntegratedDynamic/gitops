apiVersion: v2
name: argo-workflows-secret
description: >-
  ExternalSecret-only chart materializing the Secrets Argo Workflows needs
  from OpenBao: the argo-server SSO client, and the controller's
  object-storage credentials for log archival. Same <product>/secret chart
  pattern as every other one in this repo (see e.g.
  services/platform/velero/secret). The state-bucket credentials + the
  openbao/managed tfvars that also lived here moved to
  services/platform/crossplane/config when the terraform-apply CronWorkflows
  were replaced by Crossplane + provider-opentofu (issue #101).
type: application
version: 0.1.0
