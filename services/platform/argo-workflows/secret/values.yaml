# Pulls the two Secrets terraform-openbao-apply's CronWorkflow pod needs
# from OpenBao. Both KV entries are Terraform-managed in the infra repo
# (11-secrets/openbao/managed/main.tf,
# vault_kv_secret_v2.argo_workflows_scaleway_state_credentials /
# .argo_workflows_openbao_managed_tfvars) — OpenBao stays the source of
# truth, no credential value ever lives in this repo. No git credential
# here at all: both this repo and the infra repo are public, so the
# CronWorkflow's `git clone` is anonymous HTTPS, no deploy key needed.
namespace: argo-workflows

# ClusterSecretStore declared by services/platform/secrets-sync/config.
clusterSecretStoreName: openbao

scalewayStateCredentials:
  openbaoPath: apps/argo-workflows/scaleway-state-credentials
  secretName: argo-workflows-scaleway-state-credentials

openbaoManagedTfvars:
  openbaoPath: apps/argo-workflows/openbao-managed-tfvars
  secretName: argo-workflows-openbao-managed-tfvars

# The argo-server SSO client's id/secret (apps/dex/credentials, shared with
# every other native-OIDC app's static client -- see
# services/platform/dex/chart/values-scaleway.yaml's staticClients.argo-workflows).
sso:
  openbaoPath: apps/dex/credentials
  secretName: argo-workflows-sso

# The Argo Workflows controller's own object-storage credentials for
# archiving container logs -- see chart/values-scaleway.yaml's
# artifactRepository.s3.accessKeySecret/secretKeySecret, which reference
# this Secret by name.
logArchiveCredentials:
  openbaoPath: apps/argo-workflows/scaleway-log-archive-credentials
  secretName: argo-workflows-logs-scaleway-s3-credentials

refreshInterval: 1h
