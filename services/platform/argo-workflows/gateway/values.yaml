# Exposes Argo Server at argo-workflows.scalepack.fr via HTTPRoute.
namespace: argo-workflows

# Service created by the argo-workflows Helm chart (release name ==
# chart-instance name "argo-workflows", official chart's fullname helper
# appends "-server") -- confirmed via `helm template`, not assumed.
argoServer:
  serviceName: argo-workflows-server
  servicePort: 2746

# domain: the platform's base domain -- a value like everything else here,
# never hardcoded in the template.
domain: scalepack.fr

# hostSuffix: overridden per-cluster by the infra repo's argocd.tf
# (var.env_suffix, this app's hostSuffixParam: true in
# values-networking-resources.yaml) -- empty by default (main's own
# workspace, hostname unchanged: "argo-workflows.scalepack.fr"). An
# ephemeral cluster workspace overrides this to e.g. "-pr-123", producing
# "argo-workflows-pr-123.scalepack.fr" -- still one flat DNS label under
# domain, no change needed to gateway-config's wildcard cert.
hostSuffix: ""

gateway:
  hostPrefix: argo-workflows
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway
