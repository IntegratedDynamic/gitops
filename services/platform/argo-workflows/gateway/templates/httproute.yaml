# Exposes the Argo Server UI/API at argo-workflows.scalepack.fr on the
# shared gateway -- see Chart.yaml for why this is a split-out chart.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    # See services/products/demo/chart/templates/httproute.yaml's comment:
    # written explicitly to match the Gateway API's own schema defaults,
    # avoiding permanent OutOfSync in ArgoCD.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.argoServer.serviceName }}
          port: {{ .Values.argoServer.servicePort }}
          weight: 1
      # Also a schema default (omitted matches means "match everything"),
      # written explicitly for the same reason as backendRefs above.
      matches:
        - path:
            type: PathPrefix
            value: /
