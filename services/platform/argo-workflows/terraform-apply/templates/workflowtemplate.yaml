# Shared shape for every terraform-apply CronWorkflow instance (see
# cronworkflow.yaml): clone the infra repo, run an optional preflight
# self-heal script, `terraform init` against its Scaleway-hosted S3
# backend, select the workspace, apply. Parametrized by
# root/workspace/vault-address/extra-secret-name/preflight-script so a new
# root is a new entry in values-scaleway.yaml's terraformRoots, not a new
# template.
#
# `apply` is a `steps` template (clone -> preflight -> terraform-apply),
# not one monolithic container -- each step is its own pod, visible/
# debuggable independently in the Argo UI (separate logs, separate
# success/failure), same shape as initial-run-workflow.yaml's own
# bootstrap/managed DAG. The clone step hands the checked-out repo to the
# other two as a real Argo artifact (backed by the Scaleway bucket
# chart/values-scaleway.yaml's artifactRepository points at) instead of a
# shared emptyDir volume -- steps in a `steps`/`dag` template run as
# separate pods, so a plain volume wouldn't actually be shared between
# them.
#
# preflight-script defaults to "true" (an instant no-op) -- most roots
# (e.g. openbao-managed) need nothing here; only the grafana-bootstrap/
# grafana-managed entries below set a real one, to self-heal the two
# failure modes Terraform's own drift-detection structurally can't see
# (infra#82): a service-account token that still *exists* in Grafana but no
# longer authenticates (bootstrap), and a datasource that state thinks has
# one UID but Grafana now serves under another (managed) -- both first hit
# live 2026-08-23 after a cluster rebuild restored Grafana's PVC from an
# older Velero snapshot.
#
# This file mixes two templating languages on purpose: Helm's own dotted-
# Values syntax (resolved at `helm template`/ArgoCD sync time) and Argo's
# separate double-brace parameter syntax (resolved at Workflow-run time,
# once per CronWorkflow trigger). Every Argo-side reference below is
# wrapped in Helm's raw-string backtick form specifically so Helm's own
# template engine doesn't also try to parse it -- left unescaped, Helm
# reads it as a Go template field/function reference and fails to render.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: terraform-apply
  namespace: {{ .Values.namespace }}
spec:
  entrypoint: apply
  serviceAccountName: {{ .Values.serviceAccountName }}
  activeDeadlineSeconds: 900
  ttlStrategy:
    secondsAfterCompletion: 86400
  # OnWorkflowSuccess, not OnPodCompletion: the latter deletes a run's pod
  # immediately even on failure, making a failed run's logs unrecoverable
  # (confirmed live -- couldn't inspect why the first test run failed). Keep
  # failed pods around; only prune once the run actually succeeded.
  # archiveLogs (chart/values-scaleway.yaml) is the backstop for the same
  # gap once a pod IS pruned -- logs survive in Object Storage either way,
  # for 1 day (that bucket's own lifecycle rule, infra repo's 03-storage/
  # scaleway) -- long enough to debug the run that produced them, not a
  # durability target.
  podGC:
    strategy: OnWorkflowSuccess
  arguments:
    parameters:
      - name: root
      - name: workspace
      - name: vault-address
        value: ""
      - name: grafana-url
        value: ""
      - name: extra-secret-name
        value: argo-workflows-no-such-secret
      - name: preflight-script
        value: "true"
  templates:
    - name: apply
      inputs:
        parameters:
          - name: root
          - name: workspace
          - name: vault-address
          - name: grafana-url
          - name: extra-secret-name
          - name: preflight-script
            value: "true"
      steps:
        - - name: clone
            template: git-clone
        - - name: preflight
            template: preflight
            arguments:
              parameters:
                - {name: root, value: {{ `{{inputs.parameters.root}}` | quote }}}
                - {name: workspace, value: {{ `{{inputs.parameters.workspace}}` | quote }}}
                - {name: vault-address, value: {{ `{{inputs.parameters.vault-address}}` | quote }}}
                - {name: grafana-url, value: {{ `{{inputs.parameters.grafana-url}}` | quote }}}
                - {name: extra-secret-name, value: {{ `{{inputs.parameters.extra-secret-name}}` | quote }}}
                - {name: script, value: {{ `{{inputs.parameters.preflight-script}}` | quote }}}
              artifacts:
                - name: workspace
                  from: {{ `"{{steps.clone.outputs.artifacts.workspace}}"` }}
        - - name: terraform-apply
            template: terraform-apply
            arguments:
              parameters:
                - {name: root, value: {{ `{{inputs.parameters.root}}` | quote }}}
                - {name: workspace, value: {{ `{{inputs.parameters.workspace}}` | quote }}}
                - {name: vault-address, value: {{ `{{inputs.parameters.vault-address}}` | quote }}}
                - {name: grafana-url, value: {{ `{{inputs.parameters.grafana-url}}` | quote }}}
                - {name: extra-secret-name, value: {{ `{{inputs.parameters.extra-secret-name}}` | quote }}}
              artifacts:
                - name: workspace
                  from: {{ `"{{steps.clone.outputs.artifacts.workspace}}"` }}

    - name: git-clone
      container:
        image: {{ .Values.gitImage }}
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            git clone --depth 1 --branch {{ .Values.gitRef }} {{ .Values.gitRepo }} /tmp/workspace/infrastructure
        resources:
          {{- toYaml .Values.resources.gitClone | nindent 12 }}
      outputs:
        artifacts:
          - name: workspace
            path: /tmp/workspace/infrastructure

    # preflight and terraform-apply below share everything but the command
    # they run -- same image, same envFrom/env, same workingDir, same
    # inbound artifact. Not factored further into one common base: Argo has
    # no template-inheritance mechanism beyond what's already used here
    # (templateRef for cross-file reuse), and duplicating ~15 lines of
    # container plumbing twice is cheaper to read than inventing one.
    - name: preflight
      inputs:
        parameters:
          - name: root
          - name: workspace
          - name: vault-address
          - name: grafana-url
          - name: extra-secret-name
          - name: script
            value: "true"
        artifacts:
          # Fixed path, not root-dependent: the artifact IS the whole repo
          # (git-clone's own output.artifacts.path is /tmp/workspace/
          # infrastructure -- its *contents*, i.e. the repo root, land here
          # verbatim). workingDir (below) then descends from here into the
          # actual per-root subdirectory -- same two-level shape the
          # original single-container version used. Confirmed live:
          # collapsing this to one level put an empty directory at
          # workingDir ("Terraform initialized in an empty directory!"),
          # since that's not where the artifact's content actually lands.
          - name: workspace
            path: /workspace/infrastructure
      container:
        image: {{ .Values.terraformImage }}
        workingDir: {{ `/workspace/infrastructure/{{inputs.parameters.root}}` | quote }}
        envFrom:
          - secretRef:
              name: {{ .Values.scalewayCredentialsSecretName }}
          - secretRef:
              name: {{ `{{inputs.parameters.extra-secret-name}}` | quote }}
              optional: true
        env:
          - name: TF_VAR_vault_address
            value: {{ `{{inputs.parameters.vault-address}}` | quote }}
          - name: TF_VAR_grafana_url
            value: {{ `{{inputs.parameters.grafana-url}}` | quote }}
          - name: TF_WORKSPACE
            value: {{ `{{inputs.parameters.workspace}}` | quote }}
        command: [sh, -c]
        args:
          - {{ `{{inputs.parameters.script}}` | quote }}
        resources:
          {{- toYaml .Values.resources.terraformApply | nindent 12 }}

    - name: terraform-apply
      inputs:
        parameters:
          - name: root
          - name: workspace
          - name: vault-address
          - name: grafana-url
          - name: extra-secret-name
        artifacts:
          # See preflight's own inputs.artifacts comment above -- same
          # fixed path, same reason.
          - name: workspace
            path: /workspace/infrastructure
      container:
        image: {{ .Values.terraformImage }}
        workingDir: {{ `/workspace/infrastructure/{{inputs.parameters.root}}` | quote }}
        # SCW_ACCESS_KEY/SCW_SECRET_KEY, via envFrom -- satisfies both
        # `terraform init`'s -backend-config flags below AND every root's
        # data.external.scw_credentials env-var fallback (used by their own
        # cross-root state reads). extra-secret-name is optional: most
        # roots have nothing to add here (see values-scaleway.yaml's
        # terraformRoots comments), and a nonexistent Secret name with
        # optional: true just contributes zero env vars.
        envFrom:
          - secretRef:
              name: {{ .Values.scalewayCredentialsSecretName }}
          - secretRef:
              name: {{ `{{inputs.parameters.extra-secret-name}}` | quote }}
              optional: true
        env:
          - name: TF_VAR_vault_address
            value: {{ `{{inputs.parameters.vault-address}}` | quote }}
          - name: TF_VAR_grafana_url
            value: {{ `{{inputs.parameters.grafana-url}}` | quote }}
          - name: TF_WORKSPACE
            value: {{ `{{inputs.parameters.workspace}}` | quote }}
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            # jq: not in hashicorp/terraform's image, but required by every
            # root's data.external.scw_credentials (infra repo, e.g.
            # 11-secrets/openbao/managed/main.tf) -- confirmed live, the
            # third test run got all the way to `terraform plan` and died
            # on "sh: jq: not found". Alpine-based image, apk has it.
            apk add --no-cache jq >/dev/null
            terraform init -input=false \
              -backend-config="access_key=${SCW_ACCESS_KEY}" \
              -backend-config="secret_key=${SCW_SECRET_KEY}"
            # No `terraform workspace select` -- TF_WORKSPACE (env, above)
            # already selects it implicitly for every command below, and
            # Terraform outright refuses `workspace select` while
            # TF_WORKSPACE is set ("currently overridden using the
            # TF_WORKSPACE environment variable", confirmed live). Every
            # workspace this runs against already exists (created once by
            # an admin), so no -or-create behavior is needed either.
            terraform apply -auto-approve -input=false \
              -var-file="env/${TF_WORKSPACE}.tfvars"
        resources:
          {{- toYaml .Values.resources.terraformApply | nindent 12 }}
