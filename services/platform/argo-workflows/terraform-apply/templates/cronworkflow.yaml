# One CronWorkflow per services-scaleway.yaml terraformRoots entry, all
# referencing the shared terraform-apply WorkflowTemplate
# (workflowtemplate.yaml) via workflowTemplateRef -- see that file's own
# header comment for why some values below are wrapped in Helm's raw-string
# form.
#
# terraform apply is idempotent -- this deliberately does NOT try to detect
# "did main move" before running; it just re-applies HEAD every trigger and
# lets Terraform no-op when nothing changed. Simpler than Argo Events
# (EventBus + a publicly exposed webhook receiver) for the one thing any of
# these needs to react to.
{{- range .Values.terraformRoots }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: terraform-apply-{{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  # schedules (plural, a list) -- the singular `schedule` field is
  # deprecated in this chart's Argo Workflows version (2.0.1) and rejected
  # outright by strict decoding ("unknown field spec.schedule", confirmed
  # live against the CRD).
  schedules:
    - {{ .schedule | quote }}
  timezone: "Etc/UTC"
  # Never start a second run of the same root while one is still going --
  # terraform apply against the same workspace/state from two pods at once
  # would just fight over the S3 lock (use_lockfile in that root's
  # version.tf), not corrupt anything, but there's no reason to let that
  # race happen. Scoped per-CronWorkflow (per root), not repo-wide -- two
  # different roots applying concurrently is fine.
  concurrencyPolicy: Forbid
  # If the controller missed a trigger by more than this (node pool scaled
  # to 0, controller restart, ...), skip it rather than firing a burst of
  # catch-up runs once it's back.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: terraform-apply
    arguments:
      parameters:
        - name: root
          value: {{ .root | quote }}
        - name: workspace
          value: {{ .workspace | quote }}
        - name: vault-address
          value: {{ .vaultAddress | quote }}
        - name: grafana-url
          value: {{ .grafanaUrl | quote }}
        - name: extra-secret-name
          value: {{ .extraSecretName | quote }}
        # Most roots have nothing here (workflowtemplate.yaml's own
        # per-parameter default, "true", is an instant no-op) -- only
        # grafana-bootstrap/grafana-managed set a real preflightScript.
        - name: preflight-script
          value: {{ .preflightScript | default "true" | quote }}
{{- end }}
