namespace: argo-workflows

# argo-workflows/chart's workflow.serviceAccount (created, workflow.rbac
# still applies via its RoleBinding) -- unchanged default name from that
# chart's values, not re-declared there since this chart only needs to
# reference it, not own it.
serviceAccountName: argo-workflow

# Both this repo and the infra repo are public -- plain anonymous HTTPS,
# no git credential needed.
gitRepo: https://github.com/IntegratedDynamic/infrastructure.git
gitRef: main
gitImage: alpine/git:2.54.0

terraformImage: hashicorp/terraform:1.14
# Matches infra repo's mise.toml pin (terraform = "1.14") -- keep these two
# in step if that ever bumps.

# Secret materialized by services/platform/argo-workflows/secret (wave 1) --
# same identity/credential for every root below (argo-workflows-state in the
# infra repo's 01-iam/workload/scaleway, project-scoped like every other
# identity in that repo -- see that identity's own tfvars comment for why
# a per-bucket scaleway_object_bucket_policy was tried and reverted).
scalewayCredentialsSecretName: argo-workflows-scaleway-state-credentials

# PostSync hook (templates/initial-run-workflow.yaml): a Workflow object
# declared directly -- no wrapper Job/ConfigMap/RBAC, ArgoCD's own
# controller creates it as part of this Application's sync, same as every
# other resource here. Runs grafana-bootstrap then grafana-managed
# immediately once this Application syncs, instead of waiting for their
# next hourly CronWorkflow trigger. Closes the gap the terraform-apply
# entry's own wave-6 comment below flags as follow-up work -- ArgoCD
# already guarantees wave 5 (grafana) is Healthy by the time this
# Application (wave 6) syncs, so there's no reason left to also wait out
# the cron cadence. Deliberately scoped to just these two roots (hardcoded
# in initial-run-workflow.yaml, not a loop over every terraformRoots entry
# below) -- openbao-managed doesn't have this problem the same way (its
# actual data restore is its own raft-snapshot mechanism), and
# generalizing this to "run every root once immediately" is the "proper
# per-root dependency/health gating" that comment already calls out as
# separate work.
initialRun:
  enabled: true

resources:
  gitClone:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  terraformApply:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# One CronWorkflow per entry, all sharing the terraform-apply
# WorkflowTemplate (templates/workflowtemplate.yaml). extraSecretName is
# optional (envFrom optional: true in the template) -- point it at a Secret
# that doesn't exist for a root with no extra required variables, rather
# than making every root plumb one.
terraformRoots:
  - name: openbao-managed
    root: 11-secrets/openbao/managed
    workspace: 11-secrets-openbao-managed-dev
    # 10 minutes before the OpenBao snapshot agent's own hourly schedule
    # (services/platform/openbao/chart/values-scaleway.yaml, snapshotAgent.
    # schedule: "0 * * * *") -- deliberate, so that schedule's backup
    # captures whatever this apply just changed.
    schedule: "50 * * * *"
    # vault provider's in-cluster address (11-secrets/openbao/managed/
    # version.tf's var.vault_address) -- matches services/platform/openbao/
    # init's baoAddr. The whole reason this root runs from in-cluster at
    # all is that OpenBao isn't reachable any other way for a while after
    # cluster boot.
    vaultAddress: http://openbao.openbao.svc:8200
    # grafana_url isn't a variable this root declares -- TF_VAR_grafana_url
    # just gets ignored (Terraform's documented behavior for an
    # unrecognized TF_VAR_*), leaving it empty is harmless.
    grafanaUrl: ""
    # The only root with required, no-default variables this CronWorkflow
    # can't generate itself (dex_github_connector,
    # secrets_sync_github_eso_private_key, secrets_sync_github) -- see that
    # root's README "Credentials" section.
    extraSecretName: argo-workflows-openbao-managed-tfvars

  - name: grafana-bootstrap
    root: 12-monitoring/grafana/bootstrap
    workspace: 12-monitoring-grafana-bootstrap-dev
    schedule: "20 * * * *"
    # vault-address is simply unused by this root's variables; harmless
    # empty, same reasoning as grafanaUrl below for openbao-managed.
    vaultAddress: ""
    # Confirmed live: the public route (that root's version.tf default)
    # times out reaching Grafana from inside the cluster -- a pod behind
    # the cluster's own public ingress trying to reach it is a common
    # hairpin-NAT gap. Matches services/platform/monitoring's Grafana
    # Service (namespace monitoring, port 80).
    grafanaUrl: http://grafana.monitoring.svc:80/
    # No required, no-default variables at all -- both its own vars have
    # defaults and everything else is a cross-root state read.
    extraSecretName: argo-workflows-grafana-bootstrap-extra
    # Self-heal for a failure mode Terraform's own drift detection can't
    # see (infra#82): grafana_service_account_token.terraform can go dead
    # (Grafana rejects it with "invalid API key") while still existing and
    # showing not-expired/not-revoked in Grafana's own metadata -- a
    # cluster rebuild that restores Grafana's PVC from an older Velero
    # snapshot did exactly this 2026-08-23. `terraform apply` alone can
    # never notice: the provider has no way to read a token's secret value
    # back to compare it, only whether the resource still exists. So this
    # actually calls the token (same request the real apply would make
    # indirectly, e.g. reading dashboards) before the real apply runs, and
    # forces a `-replace` if Grafana rejects it -- confirmed live, a
    # freshly-created token on the same service account authenticates fine
    # immediately after, so recreation is the only real fix, there's
    # nothing to "repair" about the old one.
    preflightScript: |
      set -euo pipefail
      # Fails loudly instead of quietly no-op'ing against an empty
      # workingDir -- confirmed live this can actually happen (an
      # artifact-wiring regression once put an empty directory here, and
      # `terraform init` doesn't itself error on that, it just prints
      # "initialized in an empty directory" and exits 0).
      test -f version.tf || { echo "no version.tf in $(pwd) -- workspace artifact didn't land, aborting" >&2; exit 1; }
      apk add --no-cache curl >/dev/null
      terraform init -input=false \
        -backend-config="access_key=${SCW_ACCESS_KEY}" \
        -backend-config="secret_key=${SCW_SECRET_KEY}"
      TOKEN=$(terraform output -raw service_account_token 2>/dev/null || true)
      if [ -z "${TOKEN:-}" ]; then
        echo "no terraform service-account token in state yet -- nothing to preflight"
        exit 0
      fi
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        "${TF_VAR_grafana_url}api/serviceaccounts/search" \
        -H "Authorization: Bearer ${TOKEN}")
      if [ "$STATUS" = "401" ]; then
        echo "terraform's own Grafana token no longer authenticates (401) -- forcing recreation"
        terraform apply -auto-approve -input=false \
          -replace=grafana_service_account_token.terraform \
          -var-file="env/${TF_WORKSPACE}.tfvars"
      else
        echo "token still authenticates (status ${STATUS}) -- nothing to do"
      fi

  - name: grafana-managed
    root: 12-monitoring/grafana/managed
    workspace: 12-monitoring-grafana-managed-dev
    # 10 minutes after grafana-bootstrap: this root reads bootstrap's
    # service_account_token via data.terraform_remote_state -- running
    # after, not concurrently, avoids racing a token rotation.
    schedule: "30 * * * *"
    vaultAddress: ""
    grafanaUrl: http://grafana.monitoring.svc:80/
    extraSecretName: argo-workflows-grafana-managed-extra
    # Self-heal for the other half of infra#82: grafana_data_source.{prometheus,
    # loki,tempo} can exist live under a DIFFERENT uid than the one in
    # state (same Velero-restore-vs-live-provisioning mismatch as the
    # token above, first hit 2026-08-23) -- `terraform apply` then tries a
    # plain POST /datasources for a name that already exists and dies with
    # a 409, since Terraform has no "adopt if already there" behavior
    # (import is a one-time, explicit CLI action, never automatic). This
    # re-syncs state to whatever uid Grafana actually serves for each
    # named datasource before the real apply runs. `apply -refresh-only`
    # first: data.terraform_remote_state.grafana_bootstrap is re-read on
    # every plan/apply, but only *persisted* to state (where `terraform
    # output` reads from) by an apply -- without it this would read
    # whatever token was current as of the *last* real apply, not
    # necessarily the one grafana-bootstrap's own preflight just rotated
    # 10 minutes earlier.
    preflightScript: |
      set -euo pipefail
      # See grafana-bootstrap's own preflightScript comment above -- same
      # guard against a silently-empty workingDir.
      test -f version.tf || { echo "no version.tf in $(pwd) -- workspace artifact didn't land, aborting" >&2; exit 1; }
      apk add --no-cache jq curl >/dev/null
      terraform init -input=false \
        -backend-config="access_key=${SCW_ACCESS_KEY}" \
        -backend-config="secret_key=${SCW_SECRET_KEY}"
      terraform apply -refresh-only -auto-approve -input=false \
        -var-file="env/${TF_WORKSPACE}.tfvars"
      TOKEN=$(terraform state pull | jq -r '
        .resources[]
        | select(.type == "terraform_remote_state" and .name == "grafana_bootstrap")
        | .instances[0].attributes.outputs.value.service_account_token
      ')
      GRAFANA_URL="${TF_VAR_grafana_url%/}"
      for pair in grafana_data_source.prometheus:Prometheus \
                  grafana_data_source.loki:Loki \
                  grafana_data_source.tempo:Tempo; do
        addr="${pair%%:*}"
        name="${pair##*:}"
        live_uid=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
          "${GRAFANA_URL}/api/datasources/name/${name}" | jq -r '.uid // empty')
        if [ -z "$live_uid" ]; then
          echo "${name}: not live yet -- plain create will handle it"
          continue
        fi
        state_uid=$(terraform state pull | jq -r --arg addr "$addr" '
          .resources[]
          | select((.type + "." + .name) == $addr)
          | .instances[0].attributes.uid // empty
        ')
        if [ "$state_uid" != "$live_uid" ]; then
          echo "${name}: state uid (${state_uid:-none}) != live uid (${live_uid}) -- re-importing"
          terraform state rm "$addr" >/dev/null 2>&1 || true
          terraform import -input=false -var-file="env/${TF_WORKSPACE}.tfvars" \
            "$addr" "1:${live_uid}"
        else
          echo "${name}: uid matches -- nothing to do"
        fi
      done
