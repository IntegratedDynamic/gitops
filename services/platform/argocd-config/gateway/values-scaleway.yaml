enabled: true

namespace: argocd

# domain: the platform's base domain -- a value like everything else here,
# never hardcoded in the template.
domain: scalepack.fr

# hostSuffix: overridden per-cluster by the infra repo's argocd.tf
# (var.env_suffix, this app's hostSuffixParam: true in
# values-networking-resources.yaml) -- empty by default (main's own
# workspace, hostname unchanged: "argocd.scalepack.fr"). An ephemeral
# cluster workspace overrides this to e.g. "-pr-123", producing
# "argocd-pr-123.scalepack.fr" -- still one flat DNS label under domain,
# no change needed to gateway-config's wildcard cert.
hostSuffix: ""

gateway:
  hostPrefix: argocd
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# Service created by the argo-cd chart (helm_release.argocd in the
# infrastructure repo) — server.insecure is set there, so plain HTTP on
# this port carries both the UI and the API, same as every other backend
# behind the gateway. Duplicated in services/platform/argocd-config/config's
# own values-scaleway.yaml — that chart's restart-hook.yaml needs the same
# serviceName for its `kubectl rollout restart`, and there's no cross-chart
# values-sharing mechanism in this repo (same tradeoff every clusterSecretStoreName
# duplication elsewhere already accepts).
argocdServer:
  serviceName: argocd-server
  servicePort: 80
