enabled: true

namespace: argocd

# baseDomain: overridden per-cluster by the infra repo's argocd.tf
# (var.base_domain, this app's baseDomainParam: true in
# values-networking-resources.yaml) -- main's own workspace keeps this
# default unchanged, an ephemeral cluster workspace gets its own real
# subdomain instead. See services/platform/gateway/config/values-scaleway.yaml's
# baseDomain comment for the full "why".
baseDomain: scalepack.fr

gateway:
  hostPrefix: argocd
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# Service created by the argo-cd chart (helm_release.argocd in the
# infrastructure repo) — server.insecure is set there, so plain HTTP on
# this port carries both the UI and the API, same as every other backend
# behind the gateway. Duplicated in services/platform/argocd-config/config's
# own values-scaleway.yaml — that chart's restart-hook.yaml needs the same
# serviceName for its `kubectl rollout restart`, and there's no cross-chart
# values-sharing mechanism in this repo (same tradeoff every clusterSecretStoreName
# duplication elsewhere already accepts).
argocdServer:
  serviceName: argocd-server
  servicePort: 80
