namespace: argocd

# ArgoCD's own OIDC client, registered in bootstrap/values.yaml
# (staticClients.argocd). The secret this ExternalSecret creates is
# referenced from argocd-cm's oidc.config as
# $argocd-oidc-client-secret:oidc.clientSecret — see
# 10-cluster/scaleway/argocd.tf in the infrastructure repo.
oidcSecret:
  name: argocd-oidc-client-secret
  clusterSecretStoreName: openbao
  openbaoPath: apps/dex/credentials
