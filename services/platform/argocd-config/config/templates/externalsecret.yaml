{{- if .Values.enabled }}
# Materializes ArgoCD's OIDC client secret into its own namespace, labeled
# so argocd-cm's "$argocd-oidc-client-secret:oidc.clientSecret" reference
# resolves — ArgoCD requires app.kubernetes.io/part-of: argocd on any
# secret referenced this way (not just the built-in argocd-secret).
# https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#sensitive-data-and-sso-client-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.oidcSecret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.oidcSecret.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.oidcSecret.name }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: oidc.clientSecret
      remoteRef:
        key: {{ .Values.oidcSecret.openbaoPath }}
        property: argocd-client-secret
{{- end }}
