{{- if .Values.enabled }}
# Exposes the ArgoCD UI/API at argocd.scalepack.fr on the shared gateway.
# ArgoCD authenticates natively via OIDC (argocd-cm's oidc.config, see
# 02-cluster/scaleway/argocd.tf in the infrastructure repo) rather than
# going through Envoy Gateway's SecurityPolicy filter (charts/sso-guard) —
# tried the sso-guard edge gate here too (same mechanism as demo) but
# reverted it: unlike demo, both ArgoCD's CLI and its own web UI need a
# few endpoints reachable *before* any session exists (version/settings,
# and their own /auth/login → /auth/callback handshake) to bootstrap their
# own OIDC login, and a blanket gate on the whole HTTPRoute breaks that
# for everyone — confirmed live, `argocd login --sso` failed with
# "malformed header: missing HTTP content-type" (the CLI's initial gRPC
# call was getting a 302 instead of a response). ArgoCD's own native OIDC
# plus disabled anonymous access (users.anonymous.enable defaults false)
# already reject unauthenticated API access without this conflict.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - backendRefs:
        - name: {{ .Values.argocdServer.serviceName }}
          port: {{ .Values.argocdServer.servicePort }}
{{- end }}
