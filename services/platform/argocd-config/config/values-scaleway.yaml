enabled: true

namespace: argocd

# Service created by the argo-cd chart (helm_release.argocd in the
# infrastructure repo). Needed here for restart-hook.yaml's `kubectl
# rollout restart` target — duplicated in services/platform/argocd-config/
# gateway's own values-scaleway.yaml, which needs the same serviceName for
# its HTTPRoute backendRef. No cross-chart values-sharing mechanism in
# this repo (same tradeoff every clusterSecretStoreName duplication
# elsewhere already accepts).
argocdServer:
  serviceName: argocd-server
  servicePort: 80

# ArgoCD's own OIDC client, registered in bootstrap/values.yaml
# (staticClients.argocd). The secret this ExternalSecret creates is
# referenced from argocd-cm's oidc.config as
# $argocd-oidc-client-secret:oidc.clientSecret — see
# 02-cluster/scaleway/argocd.tf in the infrastructure repo.
oidcSecret:
  name: argocd-oidc-client-secret
  clusterSecretStoreName: openbao
  openbaoPath: apps/dex/credentials

# PostSync hook that bounces argocd-server once this app's OIDC secret is
# confirmed present — see templates/restart-hook.yaml for why.
restartHook:
  image: registry.k8s.io/kubectl:v1.35.3
