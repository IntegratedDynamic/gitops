# Values below nest under `reloader:` (our wrapper's dependency name), then
# AGAIN under `reloader:` (the upstream chart's own top-level settings
# block) -- confirmed via `helm show values stakater/reloader --version
# 2.2.17`. watchGlobally defaults to true upstream, which is what we want
# (cluster-wide watch, no override needed).
reloader:
  reloader:
    deployment:
      # Chart ships resources: {} by default. See external-secrets/chart's
      # values-scaleway.yaml for the same fix on a similarly light
      # controller. Conservative starting point -- retune from
      # `kubectl top pods -n reloader` after first live deploy, same as
      # that file's own note.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
