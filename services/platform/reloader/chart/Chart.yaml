apiVersion: v2
name: reloader
description: Wrapper chart pulling in vendor stakater/reloader, managed as an
  Application by the infrastructure repo's
  10-cluster/scaleway/platform-apps/values-secrets.yaml (wave 0 — needs
  nothing but ArgoCD to exist). Watches ConfigMaps/Secrets platform-wide,
  including ESO-synced ones, and rolling-restarts the
  Deployments/StatefulSets/DaemonSets that reference them.
type: application
version: 0.1.0

dependencies:
  - name: reloader
    version: 2.2.17
    repository: "https://stakater.github.io/stakater-charts"
