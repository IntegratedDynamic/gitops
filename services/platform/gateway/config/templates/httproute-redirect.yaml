# Catch-all: any plain-HTTP request on the shared Gateway gets redirected to
# HTTPS, so apps don't each need their own redirect rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    # See services/products/demo/chart/templates/httproute.yaml's comment:
    # written explicitly to match the Gateway API's own schema defaults,
    # avoiding permanent OutOfSync in ArgoCD.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gatewayName }}
      sectionName: http
  # No hostnames set on purpose: the HTTP listener already only accepts
  # *.scalepack.fr traffic, so this still matches everything it should —
  # but a wildcard here would make external-dns try to register a literal
  # "a-*.scalepack.fr" TXT ownership record, which Scaleway's DNS API
  # rejects as an invalid name and crashloops the whole external-dns pod.
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      # Also a schema default (omitted matches means "match everything"),
      # written explicitly for the same reason as elsewhere in this repo's
      # HTTPRoute templates — see
      # services/platform/argocd-config/config/templates/httproute.yaml.
      matches:
        - path:
            type: PathPrefix
            value: /
