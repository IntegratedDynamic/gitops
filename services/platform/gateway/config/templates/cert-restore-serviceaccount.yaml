# PreSync hook resource: applies before the rest of this Application's sync
# (the Gateway/ClusterIssuers below), guaranteed by ArgoCD within a single
# Application's own sync lifecycle — unlike cross-Application sync-waves,
# which proved unreliable here (see cert-restore-job.yaml).
{{- if .Values.certRestore.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-restore
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "0"
{{- end }}
