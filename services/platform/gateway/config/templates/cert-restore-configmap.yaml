{{- if .Values.certRestore.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-restore
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "0"
data:
  restore.sh: |
    #!/usr/bin/env sh
    set -eu

    # Idempotence: once this Restore exists, Velero has already processed it
    # (or is processing it) — never re-create it. It only comes back at all
    # when the whole cluster (this object included) gets destroyed and
    # recreated. This hook Job itself re-runs on every sync of this
    # Application (hook-delete-policy recreates it each time), so this guard
    # is what keeps a normal, already-restored cluster a no-op.
    if kubectl get restore cert-secrets-restore -n velero >/dev/null 2>&1; then
      echo "Restore already exists — nothing to do."
      exit 0
    fi

    # Wait for a completed backup to sync from the schedule. Velero's own
    # controller re-syncs Backup objects from the bucket into the cluster on
    # a timer (bootstrap/values.yaml sets backupSyncPeriod: 10s) — on
    # a fresh cluster that sync hasn't necessarily happened yet, and a
    # Restore created before it has fails validation permanently (Velero
    # does not retry a FailedValidation restore).
    #
    # Budget ~25 min, not ~10: this exits 0 (success) on timeout by design —
    # ArgoCD sees that as "hook done", not "hook failed", so it proceeds
    # straight to creating the Gateway/ClusterIssuers with nothing restored.
    # There's no retry-based recovery from that: once cert-manager issues a
    # fresh cert off the back of it, the ACME order already happened (fine
    # on staging, exactly what this whole mechanism exists to prevent on
    # prod), and existingResourcePolicy is deliberately left at its safe
    # default (skip-if-exists, see git history) — so even a later sync that
    # *does* find a backup will just skip a Secret that's already there.
    # A too-short budget can't tell "genuinely no backup yet" (the real
    # first-ever bootstrap case this fallback is for) apart from "there IS
    # one, the rest of the OpenBao → ESO → Velero credential chain just
    # hasn't finished yet" (confirmed live: a cold boot took ~15 min end to
    # end before Velero even had working credentials to sync anything).
    i=0
    while true; do
      if kubectl get backup -n velero -l "velero.io/schedule-name=${SCHEDULE_NAME}" --no-headers 2>/dev/null | grep -q .; then
        break
      fi
      i=$((i + 1))
      if [ "$i" -gt 150 ]; then
        echo "No backup synced from schedule ${SCHEDULE_NAME} after budget — leaving cert-manager/gateway empty for a fresh issuance."
        exit 0
      fi
      echo "waiting for a backup from schedule ${SCHEDULE_NAME} to sync..."
      sleep 10
    done

    # Build the namespace list as JSON — sidesteps YAML's indentation
    # sensitivity entirely (kubectl accepts JSON as valid manifest input).
    NS_JSON=""
    IFS=','
    for ns in $RESTORE_NAMESPACES; do
      NS_JSON="${NS_JSON}\"${ns}\","
    done
    unset IFS
    NS_JSON="[${NS_JSON%,}]"

    cat <<EOF | kubectl create -f -
    {
      "apiVersion": "velero.io/v1",
      "kind": "Restore",
      "metadata": {
        "name": "cert-secrets-restore",
        "namespace": "velero"
      },
      "spec": {
        "scheduleName": "${SCHEDULE_NAME}",
        "includedNamespaces": ${NS_JSON},
        "includedResources": ["secrets"]
      }
    }
    EOF

    # Wait for it to finish — this Job is a PreSync hook of this Application,
    # so ArgoCD will not create the Gateway/ClusterIssuers (the main Sync
    # phase, right after) until this exits 0.
    i=0
    while true; do
      phase=$(kubectl get restore cert-secrets-restore -n velero -o jsonpath='{.status.phase}' 2>/dev/null || true)
      case "$phase" in
        Completed|PartiallyFailed) echo "Restore: $phase"; exit 0 ;;
        Failed|FailedValidation) echo "Restore: $phase"; exit 1 ;;
      esac
      i=$((i + 1))
      if [ "$i" -gt 60 ]; then echo "timeout waiting for Restore to finish"; exit 1; fi
      sleep 5
    done
{{- end }}
