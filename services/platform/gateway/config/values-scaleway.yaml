gatewayClassName: envoy-gateway
gatewayName: scaleway-gateway
namespace: gateway

# Wildcard covers every current and future subdomain — new apps attach an
# HTTPRoute for their own hostname and need zero changes here.
domain: scalepack.fr
wildcardHostname: "*.scalepack.fr"
wildcardCertSecretName: scalepack-fr-wildcard-tls

# Which ClusterIssuer the Gateway's TLS listener actually uses.
#
# Back on letsencrypt-prod as of 2026-08-20: was flipped to staging on
# 2026-07-25 after enough rebuilds that week (ArgoCD, OpenBao, Grafana OIDC
# testing) hit Let's Encrypt's "5 duplicate certs per exact identifier set
# per 168h" rate limit (retry-after: 2026-07-26 05:49:40 UTC) -- that
# window closed weeks ago, this just never got flipped back. Confirmed
# live it was still causing real problems a month later: browsers hard-
# blocking login (no click-through) on domains where they'd previously
# cached an HSTS policy from a real cert, and every native-OIDC app's
# server-side calls to auth.scalepack.fr (token exchange, userinfo)
# failing TLS verification -- those pods don't trust the staging CA.
# (argo-workflows' own server-side calls route around this entirely via
# Dex's in-cluster Service instead of this cert -- see
# services/platform/argo-workflows/chart's server.sso.issuer -- but
# every *other* native-OIDC app, and any interactive browser login,
# still goes through this cert.) A full cluster rebuild still wipes
# scalepack-fr-wildcard-tls and forces a new ACME order each time
# (certRestore below exists specifically to avoid that by restoring the
# previous cert from backup instead) -- if a burst of same-week rebuilds
# ever hits the rate limit again, flip back to staging same as before,
# but actually flip it back this time once the window passes.
activeClusterIssuer: letsencrypt-prod

acmeEmail: nicolas.brieussel@gmail.com

# Secret services/platform/cert-manager/webhook-secret materializes into the cert-manager
# namespace (same Scaleway DNS credentials external-dns already uses).
scalewayCredentialsSecretName: scaleway-dns-credentials


# PreSync hook (templates/cert-restore-*.yaml): restores the ACME account key
# + wildcardCertSecretName above from the latest Velero backup BEFORE this
# chart's own ClusterIssuers/Gateway get created on a fresh cluster — see
# those templates for why this has to be a hook on THIS Application rather
# than a separate wave-ordered one (services/platform/velero/init, tried first, proved
# unreliable: a sibling Application's sync-wave doesn't reliably block this
# one's, confirmed live across two rebuilds with two different root causes).
certRestore:
  # true here (unlike services/platform/monitoring/grafana-chart's
  # grafanaRestore.enabled, which defaults false): this schedule has
  # already been running long enough to have real backups — confirmed live
  # across two real cluster rebuilds. A fresh chart/schedule with zero
  # backup history yet should start this false instead (see that chart's
  # own comment on the same gate) to skip the restore Job's 25-minute
  # "wait for a backup that can't exist yet" budget for nothing.
  enabled: true
  scheduleName: velero-cert-secrets
  namespaces:
    - cert-manager
    - gateway
  image:
    repository: alpine/kubectl
    tag: "1.35.3"
    pullPolicy: IfNotPresent
