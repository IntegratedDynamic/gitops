# The vendor chart.vendor.yaml this replaces shipped no custom helm values
# — 100% chart defaults, except the anti-affinity below. Nests under
# `gateway-helm:` (not `envoy-gateway:`) — that's the dependency's real
# chart name in chart/Chart.yaml, distinct from this wrapper's own name.
gateway-helm:
  # crds.gatewayAPI.safeUpgradePolicy: disabled here (2026-08-26) -- this
  # renders the safe-upgrades.gateway.networking.k8s.io
  # ValidatingAdmissionPolicy/-Binding pair from a plain `templates/`
  # manifest inside gateway-helm's OWN bundled `crds` subchart, NOT from
  # Helm's special `crds/` directory -- meaning ArgoCD's `skipCrds: true`
  # (10-cluster/scaleway's values-networking.yaml, needed so this chart
  # doesn't also fight the standalone gateway-api-crds domain for the REAL
  # CRDs) has no effect on it at all. Confirmed live: both this Application
  # and gateway-api-crds kept re-claiming ownership of the same VAP/Binding
  # objects (`argocd.argoproj.io/tracking-id` flipping between them),
  # causing perpetual OutOfSync no `ignoreDifferences` rule could paper
  # over, since it's a genuine two-owners conflict, not a diff-normalization
  # gap. gateway-api-crds (values-crds.yaml) owns this pair exclusively now.
  crds:
    gatewayAPI:
      safeUpgradePolicy:
        enabled: false
  deployment:
    pod:
      # Soft "spread pods from this same sync-wave across nodes" (shared
      # with cert-manager, not gateway-config — see the infra repo's
      # values-networking.yaml wave 1/2 comments for why gateway-config
      # alone needs its own later wave while cert-manager can safely bundle
      # here) — see
      # services/platform/cert-manager/chart/values-scaleway.yaml's
      # comment on the same fix. labels' value is a fallback default, not
      # the source of truth — the infrastructure repo's platform-apps chart injects
      # this app's real `wave` here (see this app's `syncWaveLabelPaths`
      # entry in values-networking.yaml, infra#84). Set to "-1" (not a real wave)
      # rather than a plausible-looking number, so a standalone render
      # makes the un-injected fallback obvious instead of silently
      # matching production.
      labels:
        scalepack.fr/sync-wave: "-1"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - scalepack.fr/sync-wave
          labelSelector: {}
