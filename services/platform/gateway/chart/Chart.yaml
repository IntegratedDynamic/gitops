apiVersion: v2
name: envoy-gateway
description: Wrapper chart pulling in vendor Envoy Gateway (the Gateway API
  controller, incl. its own bundled CRDs), managed as an Application by the
  infrastructure repo's 10-cluster/scaleway/platform-apps/values-networking.yaml
  (infra#84, 2026-08-25 — extracted from this repo's own
  bootstrap/values.yaml, see that file's own note). The operator itself
  consumes no OpenBao-sourced Secret — bundled in that domain with
  gateway-config (the actual Gateway/ClusterIssuer objects, which do need
  cert-manager + its DNS01 webhook, same domain).
type: application
version: 0.1.0

dependencies:
  - name: gateway-helm
    version: v1.8.1
    repository: "oci://registry-1.docker.io/envoyproxy"
