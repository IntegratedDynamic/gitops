apiVersion: v2
name: envoy-gateway
description: Wrapper chart pulling in vendor Envoy Gateway (the Gateway API
  controller, incl. its own bundled CRDs), so this deployment goes through
  a plain Application managed directly by bootstrap/templates/scaleway.yaml (see bootstrap/values.yaml's scalewayApps list) instead of the old,
  uncoordinated services-vendor-scaleway/services-app-scaleway split. The operator itself
  consumes no OpenBao-sourced Secret — stage "platform", bundled with
  gateway-config (the actual Gateway/ClusterIssuer objects, which do need
  cert-manager + the DNS01 webhook from stage "eso") and the other
  platform-tier apps (wireguard, Dex, external-dns).
type: application
version: 0.1.0

dependencies:
  - name: gateway-helm
    version: v1.8.1
    repository: "oci://registry-1.docker.io/envoyproxy"
