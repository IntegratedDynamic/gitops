# Mirrors services/platform/external-dns/init/templates/externalsecret.yaml, but reshapes
# the extracted SCW_ACCESS_KEY / SCW_SECRET_KEY pair into the single "cloud"
# key velero-plugin-for-aws reads (AWS shared-config/INI format), via
# credentials.existingSecret in bootstrap/values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
    # deletionPolicy/engineVersion/mergePolicy: written explicitly so this
    # matches what the API server defaults to anyway — ExternalSecrets
    # otherwise showed permanent OutOfSync in ArgoCD (confirmed live
    # 2026-08-11), since the API server fills these in on creation and
    # ArgoCD has no built-in knowledge of this CRD's schema defaults.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        cloud: |
          [default]
          aws_access_key_id={{ "{{ .SCW_ACCESS_KEY }}" }}
          aws_secret_access_key={{ "{{ .SCW_SECRET_KEY }}" }}
  dataFrom:
    - extract:
        key: {{ .Values.openbao.path }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
