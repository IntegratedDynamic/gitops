apiVersion: v2
name: velero
description: Wrapper chart pulling in vendor Velero, managed as an Application by
  the infrastructure repo's 10-cluster/scaleway/platform-apps/values-backups.yaml
  (infra#84 — extracted from this repo's own bootstrap/values.yaml, see that
  file's own note). Consumes velero-scaleway-credentials, written directly by
  that repo's 10-cluster/scaleway/main.tf (kubernetes_secret.velero_scaleway_credentials)
  instead of ESO/OpenBao — see infra repo's platform-apps/README.md.
type: application
version: 0.1.0

dependencies:
  - name: velero
    version: 12.1.0
    repository: https://vmware-tanzu.github.io/helm-charts
