# CNCF-incubating, Apache-2.0, no paid tier — chosen over AppsCode's
# KubeStash specifically so nothing here ever hits a license wall.
#
# Scope is deliberately narrow: this cluster is otherwise 100% declarative
# from this repo, so there's nothing worth backing up except the handful of
# Secrets Kubernetes controllers mint at runtime and never write back to
# git. The one that actually bit us: `scalepack-fr-wildcard-tls` (the
# cert-manager-issued Gateway TLS secret) gets wiped on every full cluster
# rebuild, forcing a brand new Let's Encrypt order every time — which is
# exactly what hit the "5 duplicate certs / 168h" prod rate limit on
# 2026-07-25 (see services/platform/gateway/config/values-scaleway.yaml). Backing up
# `secrets` in `cert-manager` (also covers the ACME account key) and
# `gateway`, then restoring after a rebuild, means cert-manager finds a
# still-valid cert already in place and skips ACME entirely.
#
# Deliberately NOT backing up `openbao`: OpenBao already owns its own
# backup/restore story (snapshotAgent, in its own bootstrap/values.yaml)
# — a second, competing backup system for Raft data would just be two sources
# of truth fighting over the same state. `openbao` is excluded by omission:
# includedNamespaces is an allow-list, so anything not named there is never
# touched. Also on a DIFFERENT bucket than OpenBao's own snapshots
# (backup-velero-dev-id, not backup-dev-id) — confirmed live (2026-07-28)
# that sharing a bucket breaks OpenBao's own `s3cmd`-based retention cleanup,
# which chokes on any object/prefix it doesn't own. See infra repo's
# 03-backup/scaleway/main.tf (scaleway_object_bucket.velero).
#
# One deliberate exception to "only Secrets" below: the grafana-data
# schedule backs up Grafana's own PVC (services/platform/monitoring/
# grafana-chart's values-scaleway.yaml `grafana.persistence`, added once
# Grafana's own docs made ephemeral SQLite look like the wrong default even
# for a single instance). Prometheus's separate PVC in the same
# `monitoring` namespace stays out of Velero's scope on purpose (Thanos
# already owns that durability story) — the grafana-data schedule below is
# namespace + labelSelector scoped specifically to avoid ever touching it.
#
# Uses a CSI VolumeSnapshot (configuration.features: EnableCSI below,
# templates/volumesnapshotclass.yaml), not the node-agent/kopia
# file-system-backup this originally shipped with — confirmed live
# (infra#75) that kopia's restore path is Pod-centric (the actual data
# copy only triggers when a Pod object goes through the restore, matched
# by original pod identity), which can't work here: grafana-chart's own
# restore hook (services/platform/monitoring/grafana-chart/templates/
# grafana-restore-*.yaml) is a PreSync hook that runs *before* Grafana's
# Deployment/ServiceAccount/Secret-mounting resources exist in that same
# Application's sync, so a restored original Pod object would reference
# Secrets/ConfigMaps that don't exist yet and never get past
# ContainerCreating. CSI-snapshot restore works directly against the
# PVC/PV, no owning Pod required, which fits that ordering instead of
# fighting it. Scaleway's CSI driver (csi.scaleway.com) and the
# snapshot.storage.k8s.io CRDs are already provisioned cluster-wide by
# Kapsule itself (confirmed live: `kubectl get volumesnapshotclass` shows
# its own system-managed scw-snapshot/scw-snapshot-retain) — this chart
# only needs to point Velero at them via its own VolumeSnapshotClass.
#
# Restoring after a rebuild is automatic: a PreSync hook Job on
# services/platform/gateway/config (not here, and not a separate wave-ordered
# Application — that was tried first and proved unreliable, see that
# chart's templates/cert-restore-job.yaml) waits for a completed backup to
# sync, then restores it, before gateway-config's own Gateway/ClusterIssuers
# get created — the thing that would otherwise trigger a fresh ACME order.
# The grafana-data schedule below gets the same treatment, via its own
# PreSync hook Job templated straight into
# services/platform/monitoring/chart (grafana-restore-*.yaml) — same reason,
# a different consuming Application.
#
# Values below nest under `velero:` because this chart is a thin wrapper
# declaring the real Velero chart as a dependency (see chart/Chart.yaml) —
# Helm only exposes a subchart the values under its dependency name.
velero:
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.13.1
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  # Secret written directly by the infrastructure repo's 10-cluster/scaleway/main.tf
  # (kubernetes_secret.velero_scaleway_credentials, infra#84) — never
  # generated by this chart, never committed here.
  credentials:
    useSecret: true
    existingSecret: velero-scaleway-credentials

  # No node-agent needed: every backup in this chart is either Secrets-only
  # (no node-level agent involved at all) or, since infra#75, CSI
  # VolumeSnapshot-based (grafana-data) — CSI snapshots also don't touch
  # the node agent, the CSI driver's own sidecars do the work. False here
  # is the upstream chart's own default; left explicit so it's obvious this
  # was a deliberate choice, not an oversight.
  deployNodeAgent: false

  configuration:
    # EnableCSI: turns on Velero's built-in CSI VolumeSnapshot data path
    # (merged into the main velero binary since 1.14 — confirmed against
    # the vendored chart's own values.yaml comment, no separate
    # velero-plugin-for-csi initContainer needed) — required for the
    # grafana-data schedule below to use templates/volumesnapshotclass.yaml
    # instead of file-system backup.
    features: EnableCSI

    # Chart default renders one blank (provider: "") VolumeSnapshotLocation
    # unconditionally — invalid, and never applies live, so ArgoCD flags it
    # permanently OutOfSync. Dropped regardless of EnableCSI above: that's a
    # different, older mechanism (a native cloud-provider snapshot plugin,
    # e.g. velero-plugin-for-aws's own EBS snapshotter) that CSI
    # VolumeSnapshotClass-based snapshots don't need at all.
    volumeSnapshotLocation: []

    backupStorageLocation:
      - name: default
        provider: velero.io/aws
        bucket: backup-velero-dev-id
        # Default is 1 minute: on a fresh cluster, Backup objects are
        # gone (they're cluster-local — only the S3 data survives) and
        # have to be re-synced from the bucket before Grafana's own
        # grafana-restore-* PreSync hook can find one to restore from.
        # Shortened here to shrink that wait, not eliminate it — the hook
        # still polls.
        backupSyncPeriod: 10s
        credential:
          name: velero-scaleway-credentials
          key: cloud
        config:
          region: fr-par
          s3Url: https://s3.fr-par.scw.cloud
          s3ForcePathStyle: "true"

  schedules:
    cert-secrets:
      schedule: "0 * * * *"
      template:
        ttl: "336h" # 14 days, matches openbao's own snapshot retention
        storageLocation: default
        includedNamespaces:
          - cert-manager
          - gateway
        includedResources:
          - secrets

    # CSI VolumeSnapshot backup of Grafana's own PVC — see this file's
    # header comment. labelSelector (not just includedNamespaces) is what
    # keeps this off Prometheus's separate PVC in the same `monitoring`
    # namespace: only the pod carrying app.kubernetes.io/name=grafana is
    # ever in scope — CSI eligibility is per-PVC (via the PVC's
    # StorageClass driver + templates/volumesnapshotclass.yaml), so scoping
    # by the Grafana pod's own label is still what keeps Prometheus's PVC
    # out, same as it did for the old file-system backup. Offset 15 minutes
    # from cert-secrets purely so the two don't contend for the same
    # minute.
    grafana-data:
      schedule: "15 * * * *"
      template:
        ttl: "336h" # matches cert-secrets' retention
        storageLocation: default
        includedNamespaces:
          - monitoring
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: grafana

  # Chart ships resources: {} by default (its own commented-out example
  # suggests 500m/128Mi request, 1000m/512Mi limit — scaled down here
  # since this instance's backup scope is a handful of Secrets, not
  # volumes). See cert-manager/applications/scaleway/chart.app.yaml's
  # comment on the same fix. Request sized from `kubectl top pods -n
  # velero` (2026-08-11, observed ~81Mi at idle) — limit stays well
  # above that: backup runs (listing/serializing API objects) spike
  # above the idle footprint the rest of the time.
  resources:
    requests:
      cpu: 10m
      memory: 112Mi
    limits:
      cpu: 500m
      memory: 384Mi

  # Soft "spread pods from this same sync-wave across nodes" — see
  # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
  # the same fix. podLabels' value is a fallback default, not the source
  # of truth — bootstrap/templates/scaleway.yaml injects this app's real
  # `wave` here (see this app's `syncWaveLabelPaths` entry in
  # bootstrap/values.yaml). Set to "-1" (not a real wave) rather than a
  # plausible-looking number, so a standalone render makes the
  # un-injected fallback obvious instead of silently matching production.
  podLabels:
    scalepack.fr/sync-wave: "-1"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - scalepack.fr/sync-wave
      labelSelector: {}
