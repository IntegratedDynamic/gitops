# CNCF-incubating, Apache-2.0, no paid tier — chosen over AppsCode's
# KubeStash specifically so nothing here ever hits a license wall.
#
# Scope is deliberately narrow: this cluster is otherwise 100% declarative
# from this repo, so there's nothing worth backing up except the handful of
# Secrets Kubernetes controllers mint at runtime and never write back to
# git. The one that actually bit us: `scalepack-fr-wildcard-tls` (the
# cert-manager-issued Gateway TLS secret) gets wiped on every full cluster
# rebuild, forcing a brand new Let's Encrypt order every time — which is
# exactly what hit the "5 duplicate certs / 168h" prod rate limit on
# 2026-07-25 (see services/platform/gateway/config/values-scaleway.yaml). Backing up
# `secrets` in `cert-manager` (also covers the ACME account key) and
# `gateway`, then restoring after a rebuild, means cert-manager finds a
# still-valid cert already in place and skips ACME entirely.
#
# Deliberately NOT backing up `openbao`: OpenBao already owns its own
# backup/restore story (snapshotAgent, in its own bootstrap/values.yaml)
# — a second, competing backup system for Raft data would just be two sources
# of truth fighting over the same state. `openbao` is excluded by omission:
# includedNamespaces is an allow-list, so anything not named there is never
# touched. Also on a DIFFERENT bucket than OpenBao's own snapshots
# (backup-velero-dev-id, not backup-dev-id) — confirmed live (2026-07-28)
# that sharing a bucket breaks OpenBao's own `s3cmd`-based retention cleanup,
# which chokes on any object/prefix it doesn't own. See infra repo's
# 03-backup/scaleway/main.tf (scaleway_object_bucket.velero).
#
# No volume snapshots (CSI plugin / node agent) — nothing in scope here
# lives on a PV, only in Secrets.
#
# Restoring after a rebuild is automatic: a PreSync hook Job on
# services/platform/gateway/config (not here, and not a separate wave-ordered
# Application — that was tried first and proved unreliable, see that
# chart's templates/cert-restore-job.yaml) waits for a completed backup to
# sync, then restores it, before gateway-config's own Gateway/ClusterIssuers
# get created — the thing that would otherwise trigger a fresh ACME order.
#
# Values below nest under `velero:` because this chart is a thin wrapper
# declaring the real Velero chart as a dependency (see chart/Chart.yaml) —
# Helm only exposes a subchart the values under its dependency name.
velero:
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.13.1
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  # Secret materialized by services/platform/velero/secret from OpenBao — never
  # generated by this chart, never committed here.
  credentials:
    useSecret: true
    existingSecret: velero-scaleway-credentials

  configuration:
    # Chart default renders one blank (provider: "") VolumeSnapshotLocation
    # unconditionally — invalid, and never applies live, so ArgoCD flags it
    # permanently OutOfSync. We don't do volume snapshots here, so drop it.
    volumeSnapshotLocation: []

    backupStorageLocation:
      - name: default
        provider: velero.io/aws
        bucket: backup-velero-dev-id
        # Default is 1 minute: on a fresh cluster, Backup objects are
        # gone (they're cluster-local — only the S3 data survives) and
        # have to be re-synced from the bucket before services/platform/velero/secret's
        # restore Job can find one to restore from. Shortened here to
        # shrink that wait, not eliminate it — the Job still polls.
        backupSyncPeriod: 10s
        credential:
          name: velero-scaleway-credentials
          key: cloud
        config:
          region: fr-par
          s3Url: https://s3.fr-par.scw.cloud
          s3ForcePathStyle: "true"

  schedules:
    cert-secrets:
      schedule: "0 * * * *"
      template:
        ttl: "336h" # 14 days, matches openbao's own snapshot retention
        storageLocation: default
        includedNamespaces:
          - cert-manager
          - gateway
        includedResources:
          - secrets

  # Chart ships resources: {} by default (its own commented-out example
  # suggests 500m/128Mi request, 1000m/512Mi limit — scaled down here
  # since this instance's backup scope is a handful of Secrets, not
  # volumes). See cert-manager/applications/scaleway/chart.app.yaml's
  # comment on the same fix. Request sized from `kubectl top pods -n
  # velero` (2026-08-11, observed ~81Mi at idle) — limit stays well
  # above that: backup runs (listing/serializing API objects) spike
  # above the idle footprint the rest of the time.
  resources:
    requests:
      cpu: 10m
      memory: 112Mi
    limits:
      cpu: 500m
      memory: 384Mi

  # Soft "spread pods from this same sync-wave across nodes" — see
  # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
  # the same fix. podLabels' value is a fallback default, not the source
  # of truth — bootstrap/templates/scaleway.yaml injects this app's real
  # `wave` here (see this app's `syncWaveLabelPaths` entry in
  # bootstrap/values.yaml). Set to "-1" (not a real wave) rather than a
  # plausible-looking number, so a standalone render makes the
  # un-injected fallback obvious instead of silently matching production.
  podLabels:
    scalepack.fr/sync-wave: "-1"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - scalepack.fr/sync-wave
      labelSelector: {}
