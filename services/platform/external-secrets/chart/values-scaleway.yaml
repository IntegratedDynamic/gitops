# Values below nest under `external-secrets:` because this chart is a thin
# wrapper declaring the real chart as a dependency (see chart/Chart.yaml) —
# Helm only exposes a subchart the values under its dependency name.
external-secrets:
  # Chart ships resources: {} by default for every component. See
  # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
  # the same fix — without this, the scheduler can't balance the
  # cluster's 2 nodes and Cluster Autoscaler never gets a reason to
  # use the pool's 3rd node.
  #
  # Sized from `kubectl top pods -n external-secrets` on the live
  # cluster (2026-08-11), not chart-doc guesses — a first pass left
  # every one of these requests below observed usage.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # Soft "don't stack on other pods from this same sync-wave" (wave 1
  # here — must match this app's `wave` in bootstrap/values.yaml) — see
  # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
  # the same fix.
  podLabels: &waveLabel
    scalepack.fr/sync-wave: "2"
  affinity: &antiAffinity
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: scalepack.fr/sync-wave
                  operator: In
                  values: ["2"]
            topologyKey: kubernetes.io/hostname

  webhook:
    podLabels: *waveLabel
    affinity: *antiAffinity
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 50m
        memory: 96Mi
  certController:
    podLabels: *waveLabel
    affinity: *antiAffinity
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 128Mi
