# Values below nest under `external-secrets:` because this chart is a thin
# wrapper declaring the real chart as a dependency (see chart/Chart.yaml) —
# Helm only exposes a subchart the values under its dependency name.
external-secrets:
  # Chart ships resources: {} by default for every component. See
  # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
  # the same fix — without this, the scheduler can't balance the
  # cluster's 2 nodes and Cluster Autoscaler never gets a reason to
  # use the pool's 3rd node.
  #
  # Sized from `kubectl top pods -n external-secrets` on the live
  # cluster (2026-08-11), not chart-doc guesses — a first pass left
  # every one of these requests below observed usage.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # Soft "spread pods from this same sync-wave across nodes" — see
  # services/platform/cert-manager/chart/values-scaleway.yaml's comment on
  # the same fix. podLabels' value here is a fallback default, not the
  # source of truth — the infrastructure repo's platform-apps chart injects
  # this app's real `wave` into each of the 3 podLabels below independently
  # (see this app's `syncWaveLabelPaths` entry in values-secrets.yaml, infra#84) —
  # the YAML anchor only shares the *default*, each becomes its own
  # independent map once Helm parses this file, so each still needs its
  # own override. topologySpreadConstraints has no wave number embedded
  # at all (matchLabelKeys resolves it from the pod's own label), so that
  # part of the anchor never needs touching. Set to "-1" (not a real
  # wave) rather than a plausible-looking number, so a standalone render
  # makes the un-injected fallback obvious instead of silently matching
  # production.
  podLabels: &waveLabel
    scalepack.fr/sync-wave: "-1"
  topologySpreadConstraints: &waveSpread
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - scalepack.fr/sync-wave
      labelSelector: {}

  webhook:
    podLabels: *waveLabel
    topologySpreadConstraints: *waveSpread
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 50m
        memory: 96Mi
  certController:
    podLabels: *waveLabel
    topologySpreadConstraints: *waveSpread
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      # limits.memory bumped 128Mi -> 256Mi (2026-08-27): confirmed live,
      # OOMKilled during a fresh-cluster boot's initial burst (the same
      # window crds-apps' wider CRD set widened, see
      # 10-cluster/scaleway/platform-apps/README.md's CRD-graph
      # generalization) -- 128Mi had no real headroom above this
      # component's own idle usage the original 2026-08-11 sizing was based
      # on, let alone a burst spike.
      limits:
        cpu: 50m
        memory: 256Mi
