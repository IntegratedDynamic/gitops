apiVersion: v2
name: external-secrets
description: Wrapper chart pulling in vendor external-secrets (ESO), managed as an
  Application by the infrastructure repo's
  10-cluster/scaleway/platform-apps/values-secrets.yaml (infra#84 —
  extracted from this repo's own bootstrap/values.yaml, see that file's own
  note). ESO is the controller itself — it consumes no OpenBao-sourced
  Secret (it's what PROVIDES that mechanism to everything else), wave 1
  (after OpenBao's own server AND its raft restore, wave 0 — see that
  values-secrets.yaml). The ClusterSecretStore this operator's
  ServiceAccount authenticates through is declared in
  services/platform/secrets-sync/config, same wave
  as this chart — not here, and not in openbao-init either (it's not
  coupled to that chart's restore Job on purpose).
type: application
version: 0.1.0

dependencies:
  - name: external-secrets
    version: 2.6.0
    repository: "https://external-secrets.io"
