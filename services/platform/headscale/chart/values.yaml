image:
  repository: ghcr.io/juanfont/headscale
  # One MINOR at a time: headscale refuses to start on a database upgraded by
  # skipping a minor version, and refuses to downgrade. Take a Velero backup
  # first (see ../README.md).
  tag: "0.29.7"
  pullPolicy: IfNotPresent

domain: staging.scalepack.fr

# Overridden per-cluster by the infra repo's argocd.tf (var.env_suffix, this
# app's hostSuffix valueParam in values-headscale.yaml). Empty on main's
# workspace. Must match ../gateway's hostname and authentik's.
hostSuffix: ""

# headscale.<domain> (the control server URL clients use, ../gateway).
hostPrefix: headscale
# MagicDNS names are <node>.<magicDNSPrefix><hostSuffix>.<domain>. Must differ
# from the control server's own hostname.
magicDNSPrefix: ts

oidc:
  # Human logins (`tailscale up`) through authentik. Who may log in is decided
  # there (infra repo 14-sso/managed, application `headscale`), not here.
  enabled: true
  # Slug of the authentik application, hence part of the issuer URL.
  applicationSlug: headscale
  # Empty: authentik's issuer for that application. Only the tests set it (to
  # a mock provider).
  issuer: ""
  clientID: headscale
  # NOT a secret: the authentik provider is a PUBLIC client (PKCE protects the
  # code exchange, authentik does not check any secret), but headscale refuses
  # to start without a non-empty client_secret.
  clientSecretPlaceholder: public-client-no-secret

# var.letsencrypt_staging (infra repo). Clients cannot trust a staging
# certificate, so headscale is not usable then; it only has to stay healthy:
# the staging root is added to its trust store so OIDC discovery still works.
letsEncryptStaging: false

# Personal (user-owned) nodes must log in again after this long. Tagged nodes
# never expire.
nodeExpiry: 180d

storage: 5Gi

# Measured in a test cluster with three nodes: 16Mi in use.
resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 192Mi}

serviceMonitor:
  enabled: true

# headscale-sts (https://github.com/fredrikekre/headscale-sts): a GitHub Actions
# job presents its own OIDC token on https://headscale.<domain>/sts/authkey and
# gets back a single-use, ephemeral, tagged preauth key. No secret stored in
# GitHub. A stopgap until headscale does workload identity federation itself
# (juanfont/headscale#3303): remove it then.
#
# A third-party service holding a headscale ADMIN API key, hence pinned by
# checksum. Before bumping, read the diff and check that the release binaries are
# what the tagged source builds (see ../README.md).
sts:
  enabled: true
  releasesURL: https://github.com/fredrikekre/headscale-sts/releases/download
  # The tag, the commit it points to and the Go version of its release build:
  # tests/test_sts_provenance.py rebuilds from them and compares with sha256.
  version: v0.2.0
  commit: 916abd9324cd97a6da4e04f31ab9cc4b8667b47b
  goVersion: go1.25.0
  sha256:
    amd64: 64d8b3bdd56917b649c85bd279fccc51aa3e8e04ecda34196a6a6db1533b55b8
    arm64: f8003af9984e7fd57bff10a1e7540fb275730b31691dc1a5170d41993df84d61
  # Lifetime of the API key the service creates for itself at each start. A pod
  # running longer than this stops minting keys until it is restarted.
  apiKeyExpiration: 90d
  # Who may get a key: any workflow job of this repository (any branch), the same
  # scope as the Tailscale federated identity it replaces. Pull requests from
  # forks get no OIDC token. The ID survives neither a rename-and-recreate nor a
  # name squat.
  github:
    issuer: https://token.actions.githubusercontent.com
    repository: IntegratedDynamic/infrastructure
    repositoryID: "1183095005"
  # Tags of the node registered with a key. Declared in files/policy.hujson.
  tags: [tag:ci-debug]
  keyExpiry: 5m
  resources:
    requests: {cpu: 5m, memory: 32Mi}
    limits: {memory: 128Mi}
