namespace: headscale

# Service created by ../chart (release name "headscale").
headscale:
  serviceName: headscale
  servicePort: 8080

domain: staging.scalepack.fr

# Overridden per-cluster by the infra repo's argocd.tf (var.env_suffix, this
# app's hostSuffix valueParam in values-networking-resources.yaml). Empty on
# main's workspace.
hostSuffix: ""

gateway:
  hostPrefix: headscale
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway
