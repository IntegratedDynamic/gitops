# Stands in for services/platform/gateway: same Gateway name, namespace and
# listener the HTTPRoute attaches to, with a certificate from the test CA.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: {name: eg}
spec: {controllerName: gateway.envoyproxy.io/gatewayclass-controller}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: scaleway-gateway, namespace: gateway}
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{name: headscale-tls}]}
      allowedRoutes: {namespaces: {from: All}}
