# Stand-in for GitHub's OIDC issuer: serves the discovery document and the
# public key of a keypair generated by the test session, which signs tokens.
apiVersion: v1
kind: Pod
metadata: {name: issuer, namespace: testing, labels: {app: issuer}}
spec:
  containers:
    - name: httpd
      image: busybox:1.37
      command:
        - sh
        - -c
        - mkdir -p /www/.well-known && cp /oidc/jwks /www/ && cp /oidc/openid-configuration /www/.well-known/ && exec httpd -f -p 8000 -h /www
      volumeMounts: [{name: oidc, mountPath: /oidc}]
      readinessProbe: {httpGet: {path: /jwks, port: 8000}, periodSeconds: 1}
  volumes: [{name: oidc, configMap: {name: issuer}}]
---
apiVersion: v1
kind: Service
metadata: {name: issuer, namespace: testing}
spec:
  selector: {app: issuer}
  ports: [{port: 8000}]
