apiVersion: v2
name: otel-collector
description: Wrapper chart pulling in the vendor OpenTelemetry Collector (Deployment/gateway
  mode, contrib distribution), managed as an Application by the infrastructure repo's
  10-cluster/scaleway/platform-apps/values-monitoring.yaml (infra#84 —
  extracted from this repo's own bootstrap/values.yaml, see that file's own
  note). This is the OTLP ingestion point for applications that push their own telemetry
  via an OTel SDK — a different, complementary path from Alloy
  (services/platform/monitoring/alloy-chart), which owns node-level container-log
  scraping. Fans out — logs to Loki, metrics to a scrape endpoint for Prometheus, traces
  to Tempo. Aliased to `otel-collector` (not the dependency's own name,
  `opentelemetry-collector`) purely so this chart's own values nest under a name matching
  the directory/service, same as every other wrapper chart here.
type: application
version: 0.1.0

dependencies:
  - name: opentelemetry-collector
    alias: otel-collector
    version: 0.170.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
