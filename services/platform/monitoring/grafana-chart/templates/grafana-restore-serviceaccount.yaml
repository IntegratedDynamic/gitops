{{- if .Values.grafanaRestore.enabled }}
# PreSync hook resource: applies before the rest of this Application's sync
# (the grafana dependency below, including Grafana's own Deployment/PVC),
# guaranteed by ArgoCD within a single Application's own sync lifecycle —
# same mechanism as
# services/platform/gateway/config/templates/cert-restore-serviceaccount.yaml,
# for the same reason (cross-Application sync-waves proved unreliable, see
# that chart's cert-restore-job.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-restore
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "0"
{{- end }}
