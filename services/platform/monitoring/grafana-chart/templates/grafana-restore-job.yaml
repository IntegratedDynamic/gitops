{{- if .Values.grafanaRestore.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-restore
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "1"
    # BeforeHookCreation: delete the previous instance (if the last sync's
    # attempt failed and left it behind) before creating a new one, so a
    # retry always gets a fresh Job rather than erroring on immutable
    # fields. HookSucceeded: also clean up after a successful run.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-restore
        component: restore
    spec:
      serviceAccountName: grafana-restore
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: "{{ .Values.grafanaRestore.image.repository }}:{{ .Values.grafanaRestore.image.tag }}"
          imagePullPolicy: {{ .Values.grafanaRestore.image.pullPolicy }}
          command: ["sh", "/scripts/restore.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: SCHEDULE_NAME
              value: {{ .Values.grafanaRestore.scheduleName | quote }}
            - name: RESTORE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: grafana-restore
{{- end }}
