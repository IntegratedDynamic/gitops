apiVersion: v2
name: alloy
description: Wrapper chart pulling in vendor Grafana Alloy (DaemonSet mode — the chart
  default), managed as an Application by the infrastructure repo's
  10-cluster/scaleway/platform-apps/values-monitoring.yaml (infra#84 —
  extracted from this repo's own bootstrap/values.yaml, see that file's own
  note). Ships every node's container logs to Loki (services/platform/monitoring/loki-chart)
  via loki.source.kubernetes — the Kubernetes-API-based log tail, not a hostPath mount,
  so no privileged securityContext or /var/log access is needed.
type: application
version: 0.1.0

dependencies:
  - name: alloy
    version: 1.11.1
    repository: https://grafana.github.io/helm-charts
