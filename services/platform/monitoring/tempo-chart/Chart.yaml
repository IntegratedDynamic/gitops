apiVersion: v2
name: tempo
description: Wrapper chart pulling in vendor Tempo (monolithic mode, S3-backed), managed
  as an Application by the infrastructure repo's
  10-cluster/scaleway/platform-apps/values-monitoring.yaml (infra#84 —
  extracted from this repo's own bootstrap/values.yaml, see that file's own
  note). Consumes tempo-s3-credentials, written directly by that repo's
  10-cluster/scaleway/main.tf (kubernetes_secret.tempo_s3_credentials)
  instead of ESO/OpenBao — see infra repo's platform-apps/README.md. Chart
  repo is the grafana-community fork, not grafana/helm-charts — the OSS
  Tempo chart migrated there 2026-01-30, same move
  services/platform/monitoring/grafana-chart already made for Grafana
  itself.
type: application
version: 0.1.0

dependencies:
  - name: tempo
    version: 2.2.4
    repository: https://grafana-community.github.io/helm-charts
