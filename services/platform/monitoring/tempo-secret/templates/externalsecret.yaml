# Same shape as services/platform/monitoring/loki-secret/templates/externalsecret.yaml
# — see this chart's values.yaml for why Tempo needs the same
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY keys despite consuming them
# differently (config-file env-expansion, not a plain SDK credential-chain
# fallback).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # Quoted — see loki-secret's identical template for why an
        # unquoted templated placeholder here breaks YAML parsing
        # (flow-mapping ambiguity), unlike thanos-secret's block-scalar
        # case.
        AWS_ACCESS_KEY_ID: '{{ "{{ .SCW_ACCESS_KEY }}" }}'
        AWS_SECRET_ACCESS_KEY: '{{ "{{ .SCW_SECRET_KEY }}" }}'
  dataFrom:
    - extract:
        key: {{ .Values.openbao.path }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
