# Pulls Scaleway Object Storage credentials from OpenBao into a Secret in the
# `monitoring` namespace, reshaped into AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# keys. Tempo's storage.trace.s3.access_key/secret_key config fields don't
# read a Secret directly — they're set to literal `${AWS_ACCESS_KEY_ID}` /
# `${AWS_SECRET_ACCESS_KEY}` strings in
# services/platform/monitoring/tempo-chart/values-scaleway.yaml, substituted
# at startup via Tempo's own -config.expand-env=true flag, with these env
# vars supplied through tempo.extraEnvFrom. OpenBao stays the source of
# truth — no credential value ever lives in this repo.
#
# The KV entry (keys SCW_ACCESS_KEY / SCW_SECRET_KEY) is managed by Terraform
# in the infra repo (05-secrets/openbao/managed/main.tf,
# vault_kv_secret_v2.tempo_scaleway_s3_credentials). A SEPARATE IAM key and
# bucket from every other tool bucket (infra repo's
# 03-storage/scaleway/env/*.tfvars' tempo entry) — same "one bucket, one
# identity, per consumer, never shared" contract every tool bucket in that
# root follows.
namespace: monitoring

# ClusterSecretStore declared by services/platform/secrets-sync/config.
clusterSecretStoreName: openbao

openbao:
  path: apps/monitoring/tempo-scaleway-s3-credentials

secret:
  name: tempo-s3-credentials

refreshInterval: 1h
