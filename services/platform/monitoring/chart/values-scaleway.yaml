# Values below nest under `kube-prometheus-stack:` because this chart is a
# thin wrapper declaring the real kube-prometheus-stack chart as a
# dependency (see chart/Chart.yaml) — Helm only exposes a subchart the
# values under its dependency name.
kube-prometheus-stack:
  # Lightweight config for the small Kapsule pool (DEV1-M nodes).
  alertmanager:
    enabled: false

  grafana:
    # auth.basic stays enabled (grafana-sc-dashboard/datasources'
    # reload calls to Grafana's own API authenticate this same way —
    # disabling it 401'd them, confirmed live). What actually keeps
    # this from being a human-usable admin/root account: the
    # password is randomly generated in OpenBao and never known to
    # any human (see services/platform/monitoring/grafana-config's admin ExternalSecret),
    # and grafana.ini's disable_login_form below hides the UI form
    # so OIDC via Dex is the only realistic way in for a person.
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: ClusterIP
    # Grafana 13's bleve-backend search indexer (dashboards/folders/
    # playlists) burns real CPU continuously, not just at startup —
    # observed live pegging a full node at ~2 CPU / 94% memory with
    # the original 50m/128Mi request and no CPU limit, which starved
    # readiness/liveness probes (SQLite "database is locked" retries)
    # and coincided with Dex's GitHub calls timing out mid-login.
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 512Mi

    # Soft anti-affinity against Prometheus — these two are the
    # heaviest pods in this Application, and having both land on the
    # same 3-vCPU node is exactly what starved probes/DNS during the
    # incident above. "Preferred" (not "required"): with only 2 nodes
    # in this pool, a hard rule would leave Grafana unschedulable
    # whenever the pool is temporarily down to 1 node.
    #
    # podLabels/the second affinity term: "don't stack on other pods from
    # this same sync-wave" (wave 5 here — must match this app's `wave` in
    # bootstrap/values.yaml) — see
    # services/platform/cert-manager/chart/values-scaleway.yaml's comment
    # on the same fix.
    podLabels:
      scalepack.fr/sync-wave: "5"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [prometheus]
              topologyKey: kubernetes.io/hostname
          # Lower weight than the specific anti-prometheus rule above:
          # both apply and their scores add up, this one is just a
          # lower-priority tiebreaker.
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: scalepack.fr/sync-wave
                    operator: In
                    values: ["5"]
              topologyKey: kubernetes.io/hostname

    # Native OIDC against our shared Dex (bootstrap/values.yaml,
    # staticClients.grafana), exposed at grafana.scalepack.fr by
    # services/platform/monitoring/grafana-config — mirrors how ArgoCD/OpenBao talk to Dex
    # natively instead of going through Envoy Gateway's SecurityPolicy.
    # client_secret comes in via envValueFrom below rather than here,
    # since grafana.ini is rendered into a plain (non-secret) ConfigMap.
    grafana.ini:
      server:
        root_url: https://grafana.scalepack.fr
      auth:
        # Hides the username/password form from the UI — doesn't
        # touch the API (auth.basic stays enabled, see admin: above).
        disable_login_form: true
      auth.generic_oauth:
        enabled: true
        name: GitHub (Dex)
        client_id: grafana
        scopes: "openid profile email groups"
        auth_url: https://auth.scalepack.fr/auth
        token_url: https://auth.scalepack.fr/token
        api_url: https://auth.scalepack.fr/userinfo
        # TEMPORARY (fix/gateway-staging-ca): while
        # services/platform/gateway/config runs letsencrypt-staging, Grafana's
        # server-side calls above fail TLS verification against
        # Dex's staging-signed cert ("x509: certificate signed by
        # unknown authority", confirmed live) — the pod's system
        # trust store has no idea about Let's Encrypt's staging CA.
        # Points at the bundle services/platform/monitoring/grafana-config's ConfigMap mounts
        # below. Remove both once back on letsencrypt-prod.
        tls_client_ca: /etc/grafana/certs/letsencrypt-staging/ca-bundle.pem
        # Maps the same IntegratedDynamic:Admin GitHub team ArgoCD's
        # rbac.policy.csv grants role:admin to — everyone else (no
        # team, or a different team) falls back to Viewer. NOTE:
        # several Grafana 11.1/11.2+ GitHub issues report
        # role_attribute_path sometimes not picking up groups from
        # the userinfo endpoint — validate this live before relying
        # on it for anything sensitive (see OIDC.md).
        role_attribute_path: "contains(groups[*], 'IntegratedDynamic:Admin') && 'Admin' || 'Viewer'"
        allow_assign_grafana_admin: true

    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc-client-secret
          key: client-secret

    # TEMPORARY (fix/gateway-staging-ca) — backs tls_client_ca
    # above. ConfigMap created by services/platform/monitoring/grafana-config.
    extraConfigmapMounts:
      - name: letsencrypt-staging-ca
        configMap: letsencrypt-staging-ca
        mountPath: /etc/grafana/certs/letsencrypt-staging
        readOnly: true

  prometheus:
    prometheusSpec:
      retention: 2d
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 768Mi
      # Mirrors grafana.affinity above — same "preferred, not
      # required" reasoning (2-node pool). podMetadata.labels propagates
      # to the prometheus pods themselves (unlike top-level podLabels
      # elsewhere in this file, this CRD-based component uses its own
      # key — see the chart's own values.yaml comment on podMetadata).
      podMetadata:
        labels:
          scalepack.fr/sync-wave: "5"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [grafana]
                topologyKey: kubernetes.io/hostname
            # Lower weight than the specific anti-grafana rule above:
            # both apply and their scores add up, this one is just a
            # lower-priority tiebreaker.
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: scalepack.fr/sync-wave
                      operator: In
                      values: ["5"]
                topologyKey: kubernetes.io/hostname
      # Uses the Kapsule default StorageClass (Scaleway block storage).
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 5Gi

  prometheusOperator:
    # Soft "don't stack on other pods from this same sync-wave" (wave 6
    # here — must match this app's `wave` in bootstrap/values.yaml) — see
    # services/platform/cert-manager/chart/values-scaleway.yaml's comment
    # on the same fix.
    podLabels:
      scalepack.fr/sync-wave: "5"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: scalepack.fr/sync-wave
                    operator: In
                    values: ["5"]
              topologyKey: kubernetes.io/hostname

  # DaemonSet pods are pinned to one specific node each (nodeAffinity
  # on that node's own name) — unlike a Deployment pod, they can't
  # just get scheduled on the other node if this one is full, and
  # Cluster Autoscaler adding a 3rd node doesn't rescue them either,
  # since the pod that needs scheduling is bound to a node that
  # already exists. Confirmed live 2026-08-11: node-exporter sat
  # Pending for minutes on a node running at ~99% requested memory,
  # because at default priority (0) it couldn't preempt anything to
  # make room for itself. Every other DaemonSet on this cluster
  # (cilium, csi-node, konnectivity-agent, kube-proxy — all
  # Scaleway-managed) already runs system-node-critical/
  # system-cluster-critical, so node-exporter reuses the same
  # built-in tier rather than inventing a dedicated one.
  prometheus-node-exporter:
    priorityClassName: system-node-critical
    resources:
      requests:
        cpu: 20m
        memory: 32Mi

  kube-state-metrics:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
