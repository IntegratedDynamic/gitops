# Values below nest under `kube-prometheus-stack:` because this chart is a
# thin wrapper declaring the real kube-prometheus-stack chart as a
# dependency (see chart/Chart.yaml) — Helm only exposes a subchart the
# values under its dependency name.
kube-prometheus-stack:
  # Lightweight config for the small Kapsule pool (DEV1-M nodes).
  alertmanager:
    enabled: false

  # Grafana moved out (2026-08-14) to its own Application/chart —
  # services/platform/monitoring/grafana-chart, wave 5 in this repo's
  # bootstrap/values.yaml — because its grafana-restore-* PreSync hook
  # (Velero PVC restore) needs the `velero` namespace/CRDs to exist first.
  # This chart itself moved out of bootstrap entirely (infra#84) into the
  # infrastructure repo's own monitoring-apps domain, which — like
  # backups-apps (Velero) — finishes well before bootstrap even starts
  # syncing, so grafana's wave-5 ordering here is unaffected either way.
  # `enabled: false` here (chart default is true) is what actually stops the bundled
  # grafana subchart's Deployment/PVC/Service/default-dashboard-and-
  # datasource ConfigMaps from rendering at all, not just losing their
  # value overrides — those default dashboards/datasource are now
  # Terraform-managed instead (infrastructure repo's
  # 12-monitoring/grafana/managed).
  grafana:
    enabled: false

  prometheus:
    prometheusSpec:
      retention: 1d
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 768Mi
      # Mirrors grafana.affinity above — same "preferred, not
      # required" reasoning (2-node pool). podMetadata.labels propagates
      # to the prometheus pods themselves (unlike top-level podLabels
      # elsewhere in this file, this CRD-based component uses its own
      # key — see the chart's own values.yaml comment on podMetadata).
      # Fallback default, not the source of truth — see this app's
      # `syncWaveLabelPaths` entry in bootstrap/values.yaml. Set to "-1"
      # (not a real wave) rather than a plausible-looking number, so a
      # standalone render makes the un-injected fallback obvious instead
      # of silently matching production.
      podMetadata:
        labels:
          scalepack.fr/sync-wave: "-1"
      # Anti-grafana stays podAntiAffinity (a specific-app repulsion, not
      # wave-based, topologySpreadConstraints doesn't fit this shape). The
      # wave-based spread moved to topologySpreadConstraints below instead
      # of a second affinity term — unlike grafana/prometheusOperator in
      # this file, prometheusSpec does support topologySpreadConstraints
      # natively (checked its values schema), and matchLabelKeys (K8s
      # 1.27+) needs no wave number embedded here at all.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [grafana]
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - scalepack.fr/sync-wave
          labelSelector: {}
      # Uses the Kapsule default StorageClass (Scaleway block storage).
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 5Gi

      # Thanos sidecar, for near-term durability of Prometheus's own TSDB
      # blocks in Scaleway Object Storage — not long-term queryable history
      # (no Thanos Query/Store Gateway reads this back yet, and the bucket's
      # own lifecycle expires objects after 1 day, see infra repo's
      # 03-storage/scaleway/env/*.tfvars thanos entry). Setting
      # objectStorageConfig is what makes prometheus-operator attach the
      # sidecar at all — no other values needed for that. existingSecret
      # points at a Secret written directly by the infrastructure repo's
      # 10-cluster/scaleway/main.tf (kubernetes_secret.thanos_objstore_config,
      # infra#84) — no ESO/OpenBao round-trip for this one, see infra
      # repo's platform-apps/README.md.
      thanos:
        objectStorageConfig:
          existingSecret:
            name: thanos-objstore-config
            key: objstore.yaml

  prometheusOperator:
    # No "don't stack on other pods from this same sync-wave" spread
    # here, unlike grafana/prometheus above: prometheusOperator's own
    # values schema has no topologySpreadConstraints field at all
    # (confirmed 2026-08-13 against the actually-pinned kube-prometheus-
    # stack 86.1.0 values.yaml). The only fallback would be a
    # podAntiAffinity term with a wave number hardcoded as a literal
    # array value — array-index overrides can't use matchLabelKeys, so
    # that number has to be kept in sync by hand every time this chart's
    # wave changes. Decided that tradeoff isn't worth it for one
    # operator pod: a well-named magic number is still a magic number,
    # and an unmaintained one silently stops doing its job instead of
    # failing loudly. Skipping the spread entirely — no affinity block.
    #
    # podLabels stays despite that: independent of any affinity/spread
    # use, it's uniform observability (see bootstrap/values.yaml's
    # `syncWaveLabelPaths` mechanism) — every pod in this repo carries
    # its real sync-wave as a label, useful on its own for
    # `kubectl get pods -o wide --show-labels`-style debugging. Fallback
    # default, not the source of truth — set to "-1" (not a real wave)
    # rather than a plausible-looking number, so a standalone render
    # makes the un-injected fallback obvious instead of silently
    # matching production.
    podLabels:
      scalepack.fr/sync-wave: "-1"

  # DaemonSet pods are pinned to one specific node each (nodeAffinity
  # on that node's own name) — unlike a Deployment pod, they can't
  # just get scheduled on the other node if this one is full, and
  # Cluster Autoscaler adding a 3rd node doesn't rescue them either,
  # since the pod that needs scheduling is bound to a node that
  # already exists. Confirmed live 2026-08-11: node-exporter sat
  # Pending for minutes on a node running at ~99% requested memory,
  # because at default priority (0) it couldn't preempt anything to
  # make room for itself. Every other DaemonSet on this cluster
  # (cilium, csi-node, konnectivity-agent, kube-proxy — all
  # Scaleway-managed) already runs system-node-critical/
  # system-cluster-critical, so node-exporter reuses the same
  # built-in tier rather than inventing a dedicated one.
  prometheus-node-exporter:
    priorityClassName: system-node-critical
    resources:
      requests:
        cpu: 20m
        memory: 32Mi

  kube-state-metrics:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
