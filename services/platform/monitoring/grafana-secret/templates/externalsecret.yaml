# Materializes Grafana's OIDC client secret into the monitoring namespace.
# Plain key (no app.kubernetes.io/part-of label needed — unlike ArgoCD,
# Grafana just reads it via a normal secretKeyRef env var, see
# bootstrap/values.yaml's grafana.envValueFrom).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.oidcSecret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.oidcSecret.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.oidcSecret.name }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.oidcSecret.openbaoPath }}
        property: grafana-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
