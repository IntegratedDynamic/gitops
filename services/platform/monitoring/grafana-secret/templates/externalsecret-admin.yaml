# Grafana's own bootstrap admin identity — auth.basic stays enabled (the
# grafana-sc-dashboard/grafana-sc-datasources sidecars authenticate their
# reload calls to Grafana's own API this same way, see
# kube-prometheus-stack.yml), but no human is meant to ever use it: the
# password is randomly generated and never surfaced anywhere a human
# reads it (not git, not this chart, not chat) — see openbao-claude.md
# for how it was seeded. grafana.ini's disable_login_form additionally
# hides the UI login form, so OIDC via Dex is the only realistic way in
# for a person; this Secret exists purely so auth.basic has something to
# validate the sidecars' reload calls against.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.adminSecret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.adminSecret.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.adminSecret.name }}
    creationPolicy: Owner
    # See services/platform/velero/secret/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.adminSecret.openbaoPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
