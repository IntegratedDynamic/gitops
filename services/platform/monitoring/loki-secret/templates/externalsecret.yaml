# Mirrors services/platform/monitoring/thanos-secret/templates/externalsecret.yaml,
# but reshapes the extracted SCW_ACCESS_KEY / SCW_SECRET_KEY pair into plain
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY keys instead of Thanos's single
# objstore.yaml key — Loki's S3 client (unlike Thanos's) has no
# existingSecret-shaped config field; it falls back to the standard AWS
# credential chain (env vars) when storage.s3.accessKeyId/secretAccessKey are
# left null, so this Secret is consumed via singleBinary.extraEnvFrom instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
    # deletionPolicy/engineVersion/mergePolicy: written explicitly so this
    # matches what the API server defaults to anyway — ExternalSecrets
    # otherwise showed permanent OutOfSync in ArgoCD (confirmed live
    # 2026-08-11 on velero/secret), since the API server fills these in on
    # creation and ArgoCD has no built-in knowledge of this CRD's schema
    # defaults.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # Single-quoted, unlike thanos-secret's objstore.yaml equivalent:
        # that one nests its templated placeholders inside a `|` block
        # scalar (one string value covering the whole block), so those
        # curly braces are never live YAML syntax. Here each key's value
        # IS the whole scalar, and an unquoted placeholder parses as a
        # YAML flow mapping (a leading brace opens one) instead of a
        # string — quoting forces it to stay a plain string for ESO to
        # template-substitute later.
        AWS_ACCESS_KEY_ID: '{{ "{{ .SCW_ACCESS_KEY }}" }}'
        AWS_SECRET_ACCESS_KEY: '{{ "{{ .SCW_SECRET_KEY }}" }}'
  dataFrom:
    - extract:
        key: {{ .Values.openbao.path }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
