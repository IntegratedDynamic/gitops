# Pulls Scaleway Object Storage credentials from OpenBao into a Secret in the
# `monitoring` namespace, reshaped into the AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# keys Loki's S3 client reads via env when its own storage.s3.accessKeyId/
# secretAccessKey config values are left null (see
# services/platform/monitoring/loki-chart/values-scaleway.yaml's storage.s3
# comment). OpenBao stays the source of truth — no credential value ever
# lives in this repo.
#
# The KV entry (keys SCW_ACCESS_KEY / SCW_SECRET_KEY) is managed by Terraform
# in the infra repo (11-secrets/openbao/managed/main.tf,
# vault_kv_secret_v2.loki_scaleway_s3_credentials). A SEPARATE IAM key and
# bucket from every other tool bucket (infra repo's
# 03-storage/scaleway/env/*.tfvars' loki entry) — same "one bucket, one
# identity, per consumer, never shared" contract every tool bucket in that
# root follows (a shared bucket broke OpenBao's own retention cleanup once
# already, see that root's own history).
namespace: monitoring

# ClusterSecretStore declared by services/platform/secrets-sync/config.
clusterSecretStoreName: openbao

openbao:
  path: apps/monitoring/loki-scaleway-s3-credentials

secret:
  name: loki-s3-credentials

refreshInterval: 1h
