# See services/platform/gateway/cert-restore/templates/job.yaml for the
# full "why" this domain exists and how it's ordered relative to grafana
# now (Terraform's module.wait_restore_healthy, not an ArgoCD PreSync hook).
#
# true: this schedule has already been running long enough to have real
# backups -- confirmed live across multiple real cluster rebuilds. A fresh
# chart/schedule with zero backup history yet should start this false
# instead, to skip the restore Job's ~25-minute "wait for a backup that
# can't exist yet" budget for nothing.
enabled: true
scheduleName: velero-grafana-data
image:
  repository: alpine/kubectl
  tag: "1.35.3"
  pullPolicy: IfNotPresent
