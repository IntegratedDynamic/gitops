{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-restore
  namespace: {{ .Release.Namespace }}
data:
  restore.sh: |
    #!/usr/bin/env sh
    set -eu

    # Idempotence: only CREATE the Restore once — if it already exists, skip
    # straight to the wait loop instead of recreating it. Mirrors
    # services/platform/gateway/cert-restore's own configmap.yaml —
    # see that file's own comment for the confirmed-live race this fixes
    # (2026-08-26): the old version exited 0 the instant the Restore object
    # existed, without checking its phase, which could let this domain's own
    # health-wait report done before the restore had actually finished if
    # this Job was itself recreated mid-wait.
    if ! kubectl get restore grafana-pvc-restore -n velero >/dev/null 2>&1; then
      # Wait for a completed backup to sync from the schedule. Same reasoning
      # as cert-restore's configmap.yaml: on a fresh cluster, Backup objects
      # haven't necessarily re-synced from the bucket yet, and a Restore
      # created before that happens fails validation permanently.
      #
      # Budget ~25 min, exits 0 (success) on timeout by design — a
      # genuinely-empty-bucket first boot shouldn't block this domain's own
      # health-wait forever; it proceeds to let Grafana's own Deployment/PVC
      # get created empty instead.
      i=0
      while true; do
        if kubectl get backup -n velero -l "velero.io/schedule-name=${SCHEDULE_NAME}" --no-headers 2>/dev/null | grep -q .; then
          break
        fi
        i=$((i + 1))
        if [ "$i" -gt 150 ]; then
          echo "No backup synced from schedule ${SCHEDULE_NAME} after budget — leaving Grafana's PVC to be created empty."
          exit 0
        fi
        echo "waiting for a backup from schedule ${SCHEDULE_NAME} to sync..."
        sleep 10
      done

      # includedResources needs volumesnapshots/volumesnapshotcontents
      # alongside persistentvolumeclaims, not just the PVC alone (dropped
      # persistentvolumes 2026-08-20 / infra#75, learned the hard way that
      # dropping too much breaks CSI restore too): Velero's PVC
      # restore-item-action unconditionally patches the restored PVC's
      # dataSourceRef to point at the backup's VolumeSnapshot by name, but
      # only actually *recreates* that VolumeSnapshot/VolumeSnapshotContent
      # object if those kinds are themselves in this allowlist. Without them,
      # confirmed live: the PVC ends up with a dangling dataSourceRef and the
      # CSI provisioner fails with "error getting snapshot ... not found" —
      # looks identical to a healthy CSI restore in `velero restore describe`
      # (phase Completed) until the PVC itself is inspected. No owning Pod
      # required either way, unlike the file-system-backup restore this
      # replaced.
      cat <<EOF | kubectl create -f -
      {
        "apiVersion": "velero.io/v1",
        "kind": "Restore",
        "metadata": {
          "name": "grafana-pvc-restore",
          "namespace": "velero"
        },
        "spec": {
          "scheduleName": "${SCHEDULE_NAME}",
          "includedNamespaces": ["${RESTORE_NAMESPACE}"],
          "labelSelector": {
            "matchLabels": {"app.kubernetes.io/name": "grafana"}
          },
          "includedResources": ["persistentvolumeclaims", "volumesnapshots", "volumesnapshotcontents"]
        }
      }
    EOF
    else
      echo "Restore already exists -- skipping creation, still waiting for it to finish."
    fi

    # Wait for it to finish (runs whether just-created above or already
    # existing) — this Job's own health (Complete) is what makes this
    # domain's Application Healthy, which is what
    # module.wait_restore_healthy (argocd.tf) actually polls for before
    # letting grafana's own Application be created.
    i=0
    while true; do
      phase=$(kubectl get restore grafana-pvc-restore -n velero -o jsonpath='{.status.phase}' 2>/dev/null || true)
      case "$phase" in
        Completed|PartiallyFailed) echo "Restore: $phase"; exit 0 ;;
        Failed|FailedValidation) echo "Restore: $phase"; exit 1 ;;
      esac
      i=$((i + 1))
      if [ "$i" -gt 60 ]; then echo "timeout waiting for Restore to finish"; exit 1; fi
      sleep 5
    done
{{- end }}
