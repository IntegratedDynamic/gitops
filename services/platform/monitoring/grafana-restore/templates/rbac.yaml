# Role/RoleBinding live in the `velero` namespace (where backups/restores
# actually are), not this chart's own `monitoring` namespace — mirrors
# services/platform/gateway/cert-restore/templates/rbac.yaml exactly, same
# reasoning (a RoleBinding only needs its own namespace to match the Role;
# the ServiceAccount it binds can live anywhere).
{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-restore
  namespace: velero
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["list"]
  - apiGroups: ["velero.io"]
    resources: ["restores"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-restore
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-restore
subjects:
  - kind: ServiceAccount
    name: grafana-restore
    namespace: {{ .Release.Namespace }}
{{- end }}
