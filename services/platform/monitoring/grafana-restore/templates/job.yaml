# Extracted from grafana-chart's own ArgoCD PreSync hook (2026-08-27) into
# its own domain — mirrors services/platform/gateway/cert-restore/templates/job.yaml
# exactly, see that file's own header comment for the full "why" (a plain
# cross-Application sync-wave, tried once already as services/platform/velero/init
# on 2026-07-29, failed live twice: ArgoCD's own ordering across sibling
# Applications isn't a hard blocking guarantee). Ordering relative to
# grafana itself is now Terraform's module.wait_restore_healthy (argocd.tf),
# not an ArgoCD PreSync hook.
{{- if .Values.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-restore
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-restore
        component: restore
    spec:
      serviceAccountName: grafana-restore
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/restore.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: SCHEDULE_NAME
              value: {{ .Values.scheduleName | quote }}
            - name: RESTORE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: grafana-restore
{{- end }}
