enabled: true

namespace: monitoring

# baseDomain: overridden per-cluster by the infra repo's argocd.tf
# (var.base_domain, this app's baseDomainParam: true in
# values-networking-resources.yaml) -- main's own workspace keeps this
# default unchanged, an ephemeral cluster workspace gets its own real
# subdomain instead. See services/platform/gateway/config/values-scaleway.yaml's
# baseDomain comment for the full "why".
baseDomain: scalepack.fr

gateway:
  hostPrefix: grafana
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# Service created by services/platform/monitoring/grafana-chart (its own
# Application since 2026-08-14, bootstrap/values.yaml's `grafana` entry,
# wave 5 — split out of kube-prometheus-stack, see that wave's comment).
# Release name "grafana" == chart name "grafana", so the fullname
# convention collapses to the plain name — confirmed via `helm template`
# against that chart, not assumed.
grafanaServer:
  serviceName: grafana
  servicePort: 80
