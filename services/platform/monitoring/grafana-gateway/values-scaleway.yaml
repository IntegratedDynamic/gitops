enabled: true

namespace: monitoring

gateway:
  hostname: grafana.scalepack.fr
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# Service created by services/platform/monitoring/grafana-chart (its own
# Application since 2026-08-14, bootstrap/values.yaml's `grafana` entry,
# wave 5 — split out of kube-prometheus-stack, see that wave's comment).
# Release name "grafana" == chart name "grafana", so the fullname
# convention collapses to the plain name — confirmed via `helm template`
# against that chart, not assumed.
grafanaServer:
  serviceName: grafana
  servicePort: 80
