enabled: true

namespace: monitoring

# domain: the platform's base domain -- a value like everything else here,
# never hardcoded in the template.
domain: scalepack.fr

# hostSuffix: overridden per-cluster by the infra repo's argocd.tf
# (var.env_suffix, this app's hostSuffixParam: true in
# values-networking-resources.yaml) -- empty by default (main's own
# workspace, hostname unchanged: "grafana.scalepack.fr"). An ephemeral
# cluster workspace overrides this to e.g. "-pr-123", producing
# "grafana-pr-123.scalepack.fr" -- still one flat DNS label under domain,
# no change needed to gateway-config's wildcard cert.
hostSuffix: ""

gateway:
  hostPrefix: grafana
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# Service created by services/platform/monitoring/grafana-chart (its own
# Application since 2026-08-14, bootstrap/values.yaml's `grafana` entry,
# wave 5 — split out of kube-prometheus-stack, see that wave's comment).
# Release name "grafana" == chart name "grafana", so the fullname
# convention collapses to the plain name — confirmed via `helm template`
# against that chart, not assumed.
grafanaServer:
  serviceName: grafana
  servicePort: 80
