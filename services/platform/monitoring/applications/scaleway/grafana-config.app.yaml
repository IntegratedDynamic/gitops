# Wave 5: its HTTPRoute needs gateway-config's wave-4 Gateway to exist first
# (same reasoning as argocd-config/openbao-config). Its ExternalSecret being
# this late relative to kube-prometheus-stack (default wave 0) is fine —
# Grafana's pod just stays in CreateContainerConfigError until the Secret
# shows up, same tolerated race as dex/external-dns.
name: grafana-config
namespace: monitoring
chartPath: services/platform/monitoring/grafana-config
valueFile: values-scaleway.yaml
syncWave: "5"
