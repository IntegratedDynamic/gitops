{{- if .Values.enabled }}
# TEMPORARY, tied to the letsencrypt-staging flip in
# services/platform/gateway/config/values-scaleway.yaml (fix/gateway-staging-ca): while
# the Gateway's wildcard cert is staging-signed, Grafana's server-side
# calls to Dex (token exchange, userinfo — see kube-prometheus-stack.yml's
# grafana.ini auth.generic_oauth) fail TLS verification, since the pod's
# system trust store has no idea about Let's Encrypt's staging root
# ("x509: certificate signed by unknown authority", confirmed live).
# Mounted into Grafana via grafana.extraConfigmapMounts and pointed to by
# auth.generic_oauth.tls_client_ca.
#
# Extracted directly from the live scalepack-fr-wildcard-tls Secret's
# served chain (intermediate "(STAGING) Ersatz Emmer YR2" + the
# cross-signed "(STAGING) Yonder Yam Root YR" that issues it) rather than
# re-fetched from Let's Encrypt's docs — this is exactly the chain
# actually being presented, and Go's TLS verifier doesn't require a
# RootCAs entry to be self-signed, just present and able to close the
# chain. Public CA material, not a secret — fine to commit.
#
# Delete this file (and the extraConfigmapMounts/tls_client_ca wiring in
# kube-prometheus-stack.yml) once back on letsencrypt-prod.
