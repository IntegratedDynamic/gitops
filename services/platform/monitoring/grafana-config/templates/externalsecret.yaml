{{- if .Values.enabled }}
# Materializes Grafana's OIDC client secret into the monitoring namespace.
# Plain key (no app.kubernetes.io/part-of label needed — unlike ArgoCD,
# Grafana just reads it via a normal secretKeyRef env var, see
# services/platform/monitoring/applications/scaleway/chart.vendor.yaml's grafana.envValueFrom).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.oidcSecret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.oidcSecret.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.oidcSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.oidcSecret.openbaoPath }}
        property: grafana-client-secret
{{- end }}
