{{- if .Values.enabled }}
# Exposes the Grafana UI at grafana.scalepack.fr on the shared gateway.
# Grafana authenticates natively via its own auth.generic_oauth provider
# (bootstrap/values.yaml) rather than going through
# Envoy Gateway's SecurityPolicy filter (charts/sso-guard) — same reasoning
# as services/platform/argocd-config/config / services/platform/openbao/config: Grafana's own login page and
# /login/generic_oauth callback need to be reachable before any session
# exists, and a blanket edge gate fights that handshake. The local
# admin/admin login stays enabled as a break-glass fallback for now (see
# bootstrap/values.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    # See services/products/demo/chart/templates/httproute.yaml's comment:
    # written explicitly to match the Gateway API's own schema defaults,
    # avoiding permanent OutOfSync in ArgoCD.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.grafanaServer.serviceName }}
          port: {{ .Values.grafanaServer.servicePort }}
          weight: 1
      # Also a schema default (omitted matches means "match everything"),
      # written explicitly for the same reason as backendRefs above.
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
