# Mirrors services/platform/velero/secret/templates/externalsecret.yaml, but
# reshapes the extracted SCW_ACCESS_KEY / SCW_SECRET_KEY pair into the single
# "objstore.yaml" key Thanos's objectStorageConfig.existingSecret expects
# (https://thanos.io/tip/thanos/storage.md/#s3) — bucket/endpoint/region are
# plain, non-secret values from values.yaml, not extracted from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
    # deletionPolicy/engineVersion/mergePolicy: written explicitly so this
    # matches what the API server defaults to anyway — ExternalSecrets
    # otherwise showed permanent OutOfSync in ArgoCD (confirmed live
    # 2026-08-11 on velero/secret), since the API server fills these in on
    # creation and ArgoCD has no built-in knowledge of this CRD's schema
    # defaults.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        objstore.yaml: |
          type: S3
          config:
            bucket: {{ .Values.s3.bucket }}
            endpoint: {{ .Values.s3.endpoint }}
            region: {{ .Values.s3.region }}
            access_key: {{ "{{ .SCW_ACCESS_KEY }}" }}
            secret_key: {{ "{{ .SCW_SECRET_KEY }}" }}
  dataFrom:
    - extract:
        key: {{ .Values.openbao.path }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
