replicas: 2

image:
  repository: nginx
  tag: "1.27"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Soft "spread pods from this same sync-wave across nodes" pod label
# (see templates/deployment.yaml, which hardcodes the actual
# topologySpreadConstraints — matchLabelKeys needs no wave-number value).
# Safe empty default here; the real wave number is injected per-env by
# bootstrap/templates/scaleway.yaml from that env's bootstrap/values.yaml
# scalewayApps entry (see this app's `syncWaveLabelPaths`).
syncWave: "0"

ingress:
  enabled: true
  className: nginx
  host: demo.example.com  # override per environment

# Gateway API routing (scaleway only — see values-scaleway.yaml). Disabled
# by default so local/other envs keep using the ingress-nginx path above.
gateway:
  enabled: false

# GitHub org SSO via Dex (scaleway only — see values-scaleway.yaml). Disabled
# by default; requires gateway.enabled since it targets this app's own
# HTTPRoute.
auth:
  enabled: false
