replicas: 2

image:
  repository: nginx
  tag: "1.27"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Soft "don't stack on other pods from this same sync-wave" pod label +
# rule (see templates/deployment.yaml) — see
# services/platform/cert-manager/chart/values-scaleway.yaml's comment on
# the same fix. Safe empty defaults here; the real wave number and rule
# are set per-env (e.g. values-scaleway.yaml), matching this app's `wave`
# in that env's bootstrap/values.yaml scalewayApps entry.
syncWave: "0"
affinity: {}

ingress:
  enabled: true
  className: nginx
  host: demo.example.com  # override per environment

# Gateway API routing (scaleway only — see values-scaleway.yaml). Disabled
# by default so local/other envs keep using the ingress-nginx path above.
gateway:
  enabled: false

# GitHub org SSO via Dex (scaleway only — see values-scaleway.yaml). Disabled
# by default; requires gateway.enabled since it targets this app's own
# HTTPRoute.
auth:
  enabled: false
