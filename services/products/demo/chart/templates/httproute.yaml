{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    # group/kind and backendRefs' group/kind/weight below: written
    # explicitly to match the Gateway API's own schema defaults, avoiding
    # permanent OutOfSync in ArgoCD (confirmed live 2026-08-11 — the API
    # server fills these in on creation and ArgoCD has no built-in
    # knowledge of this CRD's schema defaults).
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      # https only — otherwise this route would also bind to the http
      # listener and serve plaintext directly, bypassing gateway-config's
      # catch-all HTTP->HTTPS redirect route.
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - backendRefs:
        {{- if .Values.coldStart.enabled }}
        # Via the KEDA HTTP Add-on's interceptor, not straight to the app:
        # it holds the request while the Deployment cold-starts from zero,
        # then forwards it (routing on the Host header, which Envoy keeps).
        # Cross-namespace -> the cold-start subchart's ReferenceGrant.
        - group: ""
          kind: Service
          name: {{ .Values.coldStart.interceptor.service }}
          namespace: {{ .Values.coldStart.interceptor.namespace }}
          port: {{ .Values.coldStart.interceptor.port }}
          weight: 1
        {{- else }}
        - group: ""
          kind: Service
          name: {{ .Release.Name }}
          port: 80
          weight: 1
        {{- end }}
      # Also a schema default (omitted matches means "match everything"),
      # written explicitly for the same reason as backendRefs above.
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
