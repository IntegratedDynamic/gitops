apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        scalepack.fr/sync-wave: {{ .Values.syncWave | quote }}
    spec:
      # Soft "spread pods from this same sync-wave across nodes" — see
      # services/platform/cert-manager/chart/values-scaleway.yaml's
      # comment on the same fix. Hardcoded here (not driven by values)
      # since matchLabelKeys (K8s 1.27+) needs no wave number at all — it
      # resolves it from the pod's own scalepack.fr/sync-wave label above
      # at schedule time. This chart is in-house (not a vendored
      # dependency), so unlike other charts in this repo, this had to be
      # added to the template itself, not just set via values.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - scalepack.fr/sync-wave
          labelSelector: {}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
