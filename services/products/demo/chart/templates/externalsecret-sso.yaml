{{- if .Values.auth.enabled }}
# Materializes just the shared envoy-gateway client secret (the credential
# Envoy itself uses to talk to Dex) into this namespace, so the
# SecurityPolicy above can reference it. SecurityPolicy.oidc.clientSecret
# must be in the same namespace as the policy — this is the small,
# per-app-namespace price of the native-OIDC model, no routing changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.clientSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.auth.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.auth.clientSecretName }}
    creationPolicy: Owner
    # See services/platform/velero/init/templates/externalsecret.yaml's
    # comment: written explicitly to match the API server's own schema
    # defaults, avoiding permanent OutOfSync in ArgoCD.
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.auth.openbaoPath }}
        property: envoy-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
