replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# No ingress-nginx on scaleway — routing goes through the shared Envoy
# Gateway instead (services/platform/gateway/config), via HTTPRoute below.
ingress:
  enabled: false

gateway:
  enabled: true
  hostname: demo.scalepack.fr
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# demo is the guinea pig for GitHub org SSO — see services/platform/dex/init and
# bootstrap/values.yaml. Its callback URL is registered in Dex's
# staticClients.envoy-gateway.redirectURIs.
auth:
  enabled: true
  # Duplicates gateway.hostname above — the sso-guard subchart only sees
  # this auth: block (Helm scopes subchart values to the parent key
  # matching its dependency name), not sibling keys like gateway.hostname.
  hostname: demo.scalepack.fr
  issuer: https://auth.scalepack.fr
  clientID: envoy-gateway
  clientSecretName: demo-sso-client-secret
  cookieDomain: scalepack.fr
  clusterSecretStoreName: openbao
  openbaoPath: apps/dex/credentials
  # Service created by bootstrap/values.yaml — referenced directly so
  # OIDC discovery/token calls don't depend on external DNS (see
  # charts/sso-guard/templates/securitypolicy.yaml).
  dexServiceName: dex
  dexServiceNamespace: gateway
  dexServicePort: 5556
  # Restricts demo further to members of this GitHub team (on top of the
  # org-wide login gate) — see charts/sso-guard/templates/securitypolicy.yaml.
  requiredGroup: "IntegratedDynamic:Guest"

# syncWave/affinity: wave 7 here must match this app's `wave` in
# bootstrap/values.yaml's scalewayApps entry — see
# services/platform/cert-manager/chart/values-scaleway.yaml's comment on
# the same fix.
syncWave: "7"
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: scalepack.fr/sync-wave
                operator: In
                values: ["7"]
          topologyKey: kubernetes.io/hostname
