replicas: 1

# Cold start: scale to zero when idle, wake on the first incoming request
# (a warm-up page is served meanwhile). `replicas` above is ignored while this
# is on -- KEDA owns the count. See charts/cold-start for every knob.
coldStart:
  enabled: true
  # Duplicates gateway.hostname below (a subchart only sees its own block).
  hostname: demo.staging.scalepack.fr
  service: demo
  port: 80
  minReplicas: 0
  maxReplicas: 3

# No ingress-nginx on scaleway — routing goes through the shared Envoy
# Gateway instead (services/platform/gateway/config), via HTTPRoute below.
ingress:
  enabled: false

gateway:
  enabled: true
  hostname: demo.staging.scalepack.fr
  gatewayName: scaleway-gateway
  gatewayNamespace: gateway

# demo is the guinea pig for GitHub org SSO — see services/platform/dex/gateway and
# bootstrap/values.yaml. Its callback URL is registered in Dex's
# staticClients.envoy-gateway.redirectURIs.
auth:
  enabled: true
  # Duplicates gateway.hostname above — the sso-guard subchart only sees
  # this auth: block (Helm scopes subchart values to the parent key
  # matching its dependency name), not sibling keys like gateway.hostname.
  hostname: demo.staging.scalepack.fr
  issuer: https://auth.staging.scalepack.fr
  clientID: envoy-gateway
  clientSecretName: demo-sso-client-secret
  cookieDomain: staging.scalepack.fr
  clusterSecretStoreName: openbao
  openbaoPath: apps/dex/credentials
  # Service created by bootstrap/values.yaml — referenced directly so
  # OIDC discovery/token calls don't depend on external DNS (see
  # charts/sso-guard/templates/securitypolicy.yaml).
  dexServiceName: dex
  dexServiceNamespace: gateway
  dexServicePort: 5556
  # Restricts demo further to members of this GitHub team (on top of the
  # org-wide login gate) — see charts/sso-guard/templates/securitypolicy.yaml.
  requiredGroup: "IntegratedDynamic:Guest"

# syncWave: fallback default, not the source of truth —
# bootstrap/templates/scaleway.yaml injects this app's real `wave` here
# (see this app's `syncWaveLabelPaths` entry in bootstrap/values.yaml).
# The anti-affinity itself is hardcoded in templates/deployment.yaml now
# (topologySpreadConstraints' matchLabelKeys needs no wave-number value).
# Set to "-1" (not a real wave) rather than a plausible-looking number,
# so a standalone render makes the un-injected fallback obvious instead
# of silently matching production.
syncWave: "-1"
